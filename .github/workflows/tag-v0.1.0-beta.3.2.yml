name: Publish v0.1.0-beta.3.2

on:
  push:
    branches:
      - tag-v0.1.0-beta.3.2

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout validated Phase 32 commit
        uses: actions/checkout@v4
        with:
          ref: 2fd3728275adeddb89375d3a30699aa346186ab6
          fetch-depth: 0

      - name: Verify beta.3.2 tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          test "$(git rev-list -n 1 v0.1.0-beta.3.2)" = "2fd3728275adeddb89375d3a30699aa346186ab6"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build embedded frontend
        working-directory: frontend
        run: make all

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Show Go version
        run: go version

      - name: Publish beta.3.2 release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
          workdir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
