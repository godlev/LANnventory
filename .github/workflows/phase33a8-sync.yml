name: Phase 33A.8 Sync

on:
  push:
    branches:
      - phase-33-device-identity
    paths:
      - .github/workflows/phase33a8-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-33-device-identity

      - name: Keep managed Name separate from display fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/HostPage/HostCard.tsx')
          text = path.read_text()

          text = text.replace('import { deviceDisplayName } from "../../functions/deviceIdentity";\n', '')

          old_helper = '  const displayName = () => deviceDisplayName({ ..._props.host, Name: _props.editMode ? draft().Name : _props.host.Name });\n'
          new_helper = '  const inventoryName = () => (_props.editMode ? draft().Name : _props.host.Name).trim();\n'
          if old_helper not in text:
              raise SystemExit('displayName helper pattern not found')
          text = text.replace(old_helper, new_helper, 1)

          old_row = '                <Show when={_props.editMode} fallback={<span>{displayName()}</span>}>\n'
          new_row = '''                <Show\n                  when={_props.editMode}\n                  fallback={\n                    <Show when={inventoryName()} fallback={<span class="device-cell-muted">Not set</span>}>\n                      <span>{inventoryName()}</span>\n                    </Show>\n                  }\n                >\n'''
          if old_row not in text:
              raise SystemExit('Inventory Name row pattern not found')
          text = text.replace(old_row, new_row, 1)

          path.write_text(text)
          PY

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          make all

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Format backend and regenerate Swagger
        run: |
          gofmt -w backend/internal/api/api-identity.go backend/internal/api/api_identity_test.go backend/internal/api/routes.go backend/internal/routines/scan-routine.go backend/internal/routines/discovery_evidence_scan_test.go backend/internal/routines/ssdp_discovery_test.go
          cd backend
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Commit synchronized sources and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/HostPage/HostCard.tsx backend/internal/api backend/internal/routines backend/docs backend/internal/web/public
          if git diff --cached --quiet; then
            echo "Nothing to synchronize"
            exit 0
          fi
          git commit -m "Phase 33A.8: sync identity UI and generated artifacts"
          git push origin HEAD:phase-33-device-identity
