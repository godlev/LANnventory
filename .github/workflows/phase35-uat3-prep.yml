name: Phase35 UAT3 prep

on:
  push:
    branches:
      - phase35-device-profiles-proxmox
    paths:
      - .github/workflows/phase35-uat3-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase35-device-profiles-proxmox
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply UAT3 metadata
        env:
          FROM_VERSION: 0.1.0-beta.6.uat.2
          TO_VERSION: 0.1.0-beta.6.uat.3
          TO_TAG: v0.1.0-beta.6.uat.3
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          old = os.environ["FROM_VERSION"]
          new = os.environ["TO_VERSION"]
          tag = os.environ["TO_TAG"]
          old_tag = "v" + old
          tick = chr(96)

          def replace_once(path_name, old_text, new_text):
              p = Path(path_name)
              text = p.read_text()
              if text.count(old_text) != 1:
                  raise SystemExit(f"{path_name}: expected exactly one {old_text!r}")
              p.write_text(text.replace(old_text, new_text, 1))

          replace_once("backend/internal/version/version.go", f'var Version = "{old}"', f'var Version = "{new}"')

          p = Path("backend/cmd/LANnventory/main.go")
          text = p.read_text()
          text, count = re.subn(rf'(?m)^// @version {re.escape(old)}$', f'// @version {new}', text, count=1)
          if count != 1:
              raise SystemExit("Swagger version marker mismatch")
          p.write_text(text)

          package = Path("frontend/package.json")
          obj = json.loads(package.read_text())
          if obj.get("version") != old:
              raise SystemExit("frontend/package.json version mismatch")
          obj["version"] = new
          package.write_text(json.dumps(obj, indent=2) + "\n")

          lock_path = Path("frontend/package-lock.json")
          lock = json.loads(lock_path.read_text())
          if lock.get("version") != old or lock.get("packages", {}).get("", {}).get("version") != old:
              raise SystemExit("frontend/package-lock.json version mismatch")
          lock["version"] = new
          lock["packages"][""]["version"] = new
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          replace_once("Dockerfile", f"ARG LANNVENTORY_VERSION={old}", f"ARG LANNVENTORY_VERSION={new}")
          replace_once("proxmox/lannventory.sh", f'RELEASE_TAG="{old_tag}"', f'RELEASE_TAG="{tag}"')
          replace_once("proxmox/lannventory.sh", f'VERSION="{old}"', f'VERSION="{new}"')

          test_path = Path("proxmox/lannventory_test.sh")
          test_text = test_path.read_text()
          old_url = f"https://github.com/godlev/LANnventory/releases/download/{old_tag}/lannventory_{old}_linux_amd64.deb"
          new_url = f"https://github.com/godlev/LANnventory/releases/download/{tag}/lannventory_{new}_linux_amd64.deb"
          if test_text.count(old_url) != 1:
              raise SystemExit("Proxmox package test URL mismatch")
          test_path.write_text(test_text.replace(old_url, new_url, 1))

          readme = Path("README.md")
          readme_text = readme.read_text()
          old_marker = f"Current beta release: {tick}{old}{tick}"
          new_marker = f"Current beta release: {tick}{new}{tick}"
          if readme_text.count(old_marker) != 1:
              raise SystemExit("README current beta marker mismatch")
          readme.write_text(readme_text.replace(old_marker, new_marker, 1))

          prox_readme = Path("proxmox/README.md")
          prox_text = prox_readme.read_text()
          prox_text = prox_text.replace(f"This installer currently installs {tick}{old}{tick}.", f"This installer currently installs {tick}{new}{tick}.")
          prox_readme.write_text(prox_text)

          release = Path("docs/releases") / f"{tag}.md"
          release.parent.mkdir(parents=True, exist_ok=True)
          release.write_text(f"""# LANnventory {tag}

          ## Summary

          - Fixes a Proxmox collector bug found during Phase 35A UAT where snapshot sections in guest configuration files could emit duplicate network interfaces.
          - Collector 1.0.1 now reads only the active Proxmox configuration section before snapshot blocks, preventing historical network values from being imported as current state.
          - LXC network parsing also deduplicates repeated netN keys defensively.
          - Adds a regression test based on the observed CT129 case where eth0 appeared three times and caused Preview validation to stop with a duplicate-interface error.
          - Keeps the UAT2 guided collector wizard and data-source provenance UX unchanged.

          ## UAT focus

          Upgrade from v0.1.0-beta.6.uat.2 through Settings → Updates on the Beta channel.

          Re-run the collector from the Proxmox Host wizard. Confirm:
          - collectorVersion is 1.0.1;
          - the collector completes without collectionErrors;
          - each workload has unique interface names;
          - the previously failing LANnventory CT no longer produces duplicate eth0 rows;
          - Preview accepts the snapshot and displays the workload diff;
          - no data is written before Apply is confirmed.

          ## Release status

          Phase 35A bugfix UAT. Phase 35.8 Proxmox API credentials/automatic sync remains intentionally out of scope until UAT is approved.
          """.replace("          ", ""))
          PY

          cat >> backend/internal/updater/updater_test.go <<'EOF'

          func TestPhase35UAT3SelectionFromUAT2(t *testing.T) {
            releases := []release{
              {TagName: "v0.1.0-beta.6.uat.3", Prerelease: true, Draft: false},
              {TagName: "v0.1.0-beta.6.uat.2", Prerelease: true, Draft: false},
              {TagName: "v0.1.0-beta.6", Prerelease: true, Draft: false},
            }

            status, selected, ok := buildStatus(
              "v0.1.0-beta.6.uat.2",
              BetaChannel,
              releases,
              time.Time{},
              false,
            )
            if !ok || selected.TagName != "v0.1.0-beta.6.uat.3" {
              t.Fatalf("Beta selected %+v ok=%v, want UAT3", selected, ok)
            }
            if !status.Available || status.LatestVersion != "0.1.0-beta.6.uat.3" {
              t.Fatalf("Beta status = %+v, want UAT3 available", status)
            }

            stableStatus, selected, ok := buildStatus(
              "v0.1.0-beta.6.uat.2",
              StableChannel,
              releases,
              time.Time{},
              false,
            )
            if ok || selected.TagName != "" || stableStatus.Available {
              t.Fatalf("Stable channel exposed UAT3: status=%+v selected=%+v ok=%v", stableStatus, selected, ok)
            }
          }
          EOF

          gofmt -w backend/internal/updater/updater_test.go backend/internal/version/version.go backend/cmd/LANnventory/main.go

      - name: Rebuild frontend and Swagger
        run: |
          cd frontend
          npm ci
          npm run test:host-ux
          make all
          cd ../backend
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Validate UAT3
        env:
          UAT_VERSION: 0.1.0-beta.6.uat.3
        run: |
          set -euo pipefail
          cmp -s proxmox/collect_inventory.py frontend/public/lannventory-proxmox-collector.py
          cmp -s proxmox/collect_inventory.py backend/internal/web/public/lannventory-proxmox-collector.py
          python3 -m unittest proxmox/collect_inventory_test.py
          node --check frontend/dev/mock-api.mjs
          bash -n proxmox/lannventory.sh
          bash proxmox/lannventory_test.sh
          cd backend
          go test ./...
          go test ./internal/version -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}"
          go vet ./...
          go build -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}" ./cmd/LANnventory

      - name: Commit UAT3 metadata
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/internal/version/version.go \
            backend/internal/updater/updater_test.go \
            backend/cmd/LANnventory/main.go \
            backend/docs \
            backend/internal/web/public \
            frontend/package.json \
            frontend/package-lock.json \
            Dockerfile \
            proxmox/lannventory.sh \
            proxmox/lannventory_test.sh \
            proxmox/README.md \
            README.md \
            docs/releases/v0.1.0-beta.6.uat.3.md
          git diff --cached --check
          git commit -m "phase35: prepare v0.1.0-beta.6.uat.3 UAT"
          git push origin HEAD:phase35-device-profiles-proxmox
