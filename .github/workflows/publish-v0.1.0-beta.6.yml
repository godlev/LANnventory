name: Publish v0.1.0-beta.6

on:
  push:
    branches:
      - publish-v0.1.0-beta.6
    paths:
      - .github/workflows/publish-v0.1.0-beta.6.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: 0.1.0-beta.6
      RELEASE_TAG: v0.1.0-beta.6
      TARGET_SHA: 7c618095a106111405c6ef48d9a1fd61edeba128
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: 7c618095a106111405c6ef48d9a1fd61edeba128
          fetch-depth: 0

      - name: Guard tag and release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Remote tag ${RELEASE_TAG} already exists"
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${TARGET_SHA}" -m "LANnventory ${RELEASE_TAG}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend and embedded bundle
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run test:host-ux
          make all
          git diff --exit-code -- ../backend/internal/web/public

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify updater selection from UAT.2
        working-directory: backend
        run: |
          set -euo pipefail
          go test ./internal/updater -run TestPhase34FinalBetaReleaseSelection -count=1

      - name: Build exact release artifacts without publishing
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --skip=publish
          workdir: backend

      - name: Validate exact Debian package, checksum and runtime API version
        run: |
          set -euo pipefail
          cd backend/dist

          deb="lannventory_${RELEASE_VERSION}_linux_amd64.deb"
          test -f "$deb"
          test -f checksums.txt

          package_version="$(dpkg-deb -f "$deb" Version)"
          package_arch="$(dpkg-deb -f "$deb" Architecture)"
          debian_expected_version="$(printf '%s' "$RELEASE_VERSION" | sed 's/-/~/')"

          printf 'Package: %s\nVersion: %s\nArchitecture: %s\nExpected Debian version: %s\n' \
            "$deb" "$package_version" "$package_arch" "$debian_expected_version"

          test "$package_version" = "$debian_expected_version"
          test "$package_arch" = "amd64"

          checksum_line="$(grep -E "^[0-9a-fA-F]{64}[[:space:]]+[*]?${deb}$" checksums.txt)"
          test -n "$checksum_line"
          expected_hash="$(printf '%s\n' "$checksum_line" | awk '{print $1}')"
          actual_hash="$(sha256sum "$deb" | awk '{print $1}')"
          printf 'Expected SHA256: %s\nActual SHA256:   %s\n' "$expected_hash" "$actual_hash"
          test "$expected_hash" = "$actual_hash"

          extract_dir="$(mktemp -d)"
          runtime_dir="$(mktemp -d)"
          dpkg-deb -x "$deb" "$extract_dir"
          test -x "$extract_dir/usr/bin/lannventory"

          cat > "$runtime_dir/config_v2.yaml" <<'EOF'
          HOST: "127.0.0.1"
          PORT: "18846"
          IFACES: ""
          UPDATE_CHANNEL: "beta"
          UPDATE_CHECK_AUTO: false
          UPDATE_AUTO: false
          EOF

          cleanup() {
            if [ -n "${app_pid:-}" ]; then
              kill "${app_pid}" >/dev/null 2>&1 || true
              wait "${app_pid}" >/dev/null 2>&1 || true
            fi
            rm -rf "$extract_dir" "$runtime_dir"
          }
          trap cleanup EXIT

          "$extract_dir/usr/bin/lannventory" -d "$runtime_dir" >"$runtime_dir/lannventory.log" 2>&1 &
          app_pid=$!

          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18846/api/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            if ! kill -0 "$app_pid" >/dev/null 2>&1; then
              cat "$runtime_dir/lannventory.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            cat "$runtime_dir/lannventory.log"
            exit 1
          fi

          version_json="$(curl -fsS http://127.0.0.1:18846/api/version)"
          printf '/api/version => %s\n' "$version_json"
          python3 -c 'import json, os, sys; got=json.load(sys.stdin); want=os.environ["RELEASE_VERSION"]; assert got == want, (got, want)' <<< "$version_json"

          trap - EXIT
          cleanup
          cd ../..

      - name: Publish exact beta.6 prerelease and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            backend/dist/checksums.txt
            backend/dist/*.deb
            backend/dist/*.rpm
            backend/dist/*.apk
            backend/dist/*.tar.gz
          )
          test "${#assets[@]}" -gt 1
          gh release create "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --target "${TARGET_SHA}" \
            --prerelease \
            --title "LANnventory ${RELEASE_TAG}" \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            "${assets[@]}"

      - name: Verify published release and downloaded amd64 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" > /tmp/release.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("/tmp/release.json").read_text())
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]

          if release.get("tag_name") != tag:
              raise SystemExit(f"unexpected tag: {release.get('tag_name')}")
          if not release.get("prerelease") or release.get("draft"):
              raise SystemExit("beta.6 is not a published prerelease")

          names = {asset["name"] for asset in release.get("assets", [])}
          required = {
              "checksums.txt",
              f"lannventory_{version}_linux_amd64.deb",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"missing required release assets: {sorted(missing)}")

          print("Published release:", release["html_url"])
          print("Required assets:", sorted(required))
          PY

          published_dir="$(mktemp -d)"
          gh release download "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --pattern checksums.txt \
            --pattern "lannventory_${RELEASE_VERSION}_linux_amd64.deb" \
            --dir "$published_dir"

          cd "$published_dir"
          deb="lannventory_${RELEASE_VERSION}_linux_amd64.deb"
          checksum_line="$(grep -E "^[0-9a-fA-F]{64}[[:space:]]+[*]?${deb}$" checksums.txt)"
          test -n "$checksum_line"
          expected_hash="$(printf '%s\n' "$checksum_line" | awk '{print $1}')"
          actual_hash="$(sha256sum "$deb" | awk '{print $1}')"
          test "$expected_hash" = "$actual_hash"
          test "$(dpkg-deb -f "$deb" Architecture)" = "amd64"
          test "$(dpkg-deb -f "$deb" Version)" = "$(printf '%s' "$RELEASE_VERSION" | sed 's/-/~/')"
          printf 'Published amd64 SHA256: %s\n' "$actual_hash"
