name: Phase35 UAT2 prep

on:
  push:
    branches:
      - phase35-device-profiles-proxmox
    paths:
      - .github/workflows/phase35-uat2-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase35-device-profiles-proxmox
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply UAT2 version metadata and release summary
        env:
          OLD_VERSION: 0.1.0-beta.6.uat.1
          UAT_VERSION: 0.1.0-beta.6.uat.2
          UAT_TAG: v0.1.0-beta.6.uat.2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          old = os.environ["OLD_VERSION"]
          version = os.environ["UAT_VERSION"]
          tag = os.environ["UAT_TAG"]
          old_tag = "v" + old
          tick = chr(96)

          def replace_once(path_name, old_text, new_text):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old_text)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one match for {old_text!r}, found {count}")
              path.write_text(text.replace(old_text, new_text, 1))

          replace_once("backend/internal/version/version.go", f'var Version = "{old}"', f'var Version = "{version}"')
          replace_once("backend/cmd/LANnventory/main.go", f"// @version {old}", f"// @version {version}")

          package_path = Path("frontend/package.json")
          package = json.loads(package_path.read_text())
          if package.get("version") != old:
              raise SystemExit("frontend/package.json: unexpected version")
          package["version"] = version
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          lock_path = Path("frontend/package-lock.json")
          lock = json.loads(lock_path.read_text())
          if lock.get("version") != old or lock.get("packages", {}).get("", {}).get("version") != old:
              raise SystemExit("frontend/package-lock.json: unexpected root version")
          lock["version"] = version
          lock["packages"][""]["version"] = version
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          replace_once("Dockerfile", f"ARG LANNVENTORY_VERSION={old}", f"ARG LANNVENTORY_VERSION={version}")
          replace_once("proxmox/lannventory.sh", f'RELEASE_TAG="{old_tag}"', f'RELEASE_TAG="{tag}"')
          replace_once("proxmox/lannventory.sh", f'VERSION="{old}"', f'VERSION="{version}"')

          test_path = Path("proxmox/lannventory_test.sh")
          test_text = test_path.read_text()
          old_url = f"https://github.com/godlev/LANnventory/releases/download/{old_tag}/lannventory_{old}_linux_amd64.deb"
          new_url = f"https://github.com/godlev/LANnventory/releases/download/{tag}/lannventory_{version}_linux_amd64.deb"
          if test_text.count(old_url) != 1:
              raise SystemExit("proxmox/lannventory_test.sh: old package URL not found exactly once")
          test_path.write_text(test_text.replace(old_url, new_url, 1))

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          old_marker = f"Current beta release: {tick}{old}{tick}"
          new_marker = f"Current beta release: {tick}{version}{tick}"
          if readme.count(old_marker) != 1:
              raise SystemExit("README.md: old beta marker not found exactly once")
          readme_path.write_text(readme.replace(old_marker, new_marker, 1))

          prox_readme_path = Path("proxmox/README.md")
          prox_readme = prox_readme_path.read_text()
          prox_readme = re.sub(
              r"The current installer installs LANnventory `[^\n]+` from the official GitHub release package:",
              f"The current installer installs LANnventory {tick}{tag}{tick} from the official GitHub release package:",
              prox_readme,
              count=1,
          )
          prox_readme = re.sub(
              r"https://github\.com/godlev/LANnventory/releases/download/[^/]+/lannventory_[^\s]+_linux_amd64\.deb",
              f"https://github.com/godlev/LANnventory/releases/download/{tag}/lannventory_{version}_linux_amd64.deb",
              prox_readme,
              count=1,
          )
          prox_readme = re.sub(
              r"This installer currently installs `[^\n]+`\. Future installer versions",
              f"This installer currently installs {tick}{tag}{tick}. Future installer versions",
              prox_readme,
              count=1,
          )
          prox_readme_path.write_text(prox_readme)

          release_path = Path("docs/releases") / f"{tag}.md"
          release_path.parent.mkdir(parents=True, exist_ok=True)
          release_path.write_text(f"""# LANnventory {tag}

          ## Summary

          This Phase 35A follow-up keeps the UAT1 Proxmox data model and safety rules unchanged, while making the onboarding flow understandable without repository knowledge.

          - Adds a visible data-source legend for Manual, Discovered and Imported information.
          - Adds per-field provenance icons/tooltips to managed Device Profile fields.
          - Clarifies that Proxmox version, node name and cluster name in the managed profile are optional manual reference values; imported observations remain separate.
          - Replaces the raw JSON-first import form with a four-step Proxmox import wizard.
          - Explains exactly how collector permissions work: the collector runs locally on the Proxmox node and inherits the shell user's permissions; LANnventory does not need a Proxmox password or API token.
          - Adds a copy-ready command that downloads the collector from the running LANnventory instance and executes it on the Proxmox node.
          - Adds a local Download collector fallback for nodes that cannot fetch the LANnventory URL directly.
          - Packages the exact allowlisted collector inside the LANnventory binary and regression-tests that the canonical, frontend and embedded collector copies remain identical.
          - Keeps Preview mandatory before Apply and preserves all UAT1 import validation, transaction, retirement and workload matching safeguards.

          ## UAT focus

          Upgrade from v0.1.0-beta.6.uat.1 through Settings → Updates on the Beta channel, then verify:
          - the updater offers and installs {tag};
          - Device Profile clearly shows Manual / Discovered / Imported provenance guidance;
          - managed profile fields show source information and optional Proxmox reference fields are understandable;
          - the Proxmox Inventory panel shows a four-step import wizard instead of an unexplained JSON box;
          - the wizard explains that the collector must be run in the Proxmox shell as root or another user allowed to run qm/pct and read the allowlisted /etc/pve network lines;
          - Copy produces a command using this LANnventory instance's URL;
          - Download collector returns lannventory-proxmox-collector.py from the installed LANnventory instance;
          - running the command on the Proxmox node prints JSON without asking for Proxmox credentials;
          - pasting/uploading that JSON and choosing Preview changes shows the expected diff before Apply;
          - Apply, workloads and Host matching continue to behave as in UAT1.

          ## Release status

          Phase 35A UAT follow-up. Proxmox API credentials and automatic synchronization remain intentionally out of scope until this UAT passes.

          UX patch validated from development branch source before UAT2 metadata: 55daef45478e9cff00e74f3764d4fd00ebc7a1d9.
          """.replace("          ", ""))
          PY

          cat >> backend/internal/updater/updater_test.go <<'EOF'

          func TestPhase35UAT2SelectionFromUAT1(t *testing.T) {
            releases := []release{
              {
                TagName:     "v0.1.0-beta.6.uat.2",
                Prerelease:  true,
                Draft:       false,
                PublishedAt: "2026-09-19T00:00:00Z",
                HTMLURL:     "https://github.com/godlev/LANnventory/releases/tag/v0.1.0-beta.6.uat.2",
              },
              {
                TagName:    "v0.1.0-beta.6.uat.1",
                Prerelease: true,
                Draft:      false,
              },
              {
                TagName:    "v0.1.0-beta.6",
                Prerelease: true,
                Draft:      false,
              },
            }

            betaStatus, selected, ok := buildStatus(
              "v0.1.0-beta.6.uat.1",
              BetaChannel,
              releases,
              time.Time{},
              false,
            )
            if !ok {
              t.Fatal("Beta channel did not select a release")
            }
            if selected.TagName != "v0.1.0-beta.6.uat.2" {
              t.Fatalf("Beta selected %q, want Phase 35 UAT2", selected.TagName)
            }
            if !betaStatus.Available || betaStatus.LatestVersion != "0.1.0-beta.6.uat.2" {
              t.Fatalf("Beta status = %+v, want available Phase 35 UAT2", betaStatus)
            }

            stableStatus, selected, ok := buildStatus(
              "v0.1.0-beta.6.uat.1",
              StableChannel,
              releases,
              time.Time{},
              false,
            )
            if ok || selected.TagName != "" {
              t.Fatalf("Stable channel selected prerelease: selected=%+v ok=%v", selected, ok)
            }
            if stableStatus.Available || stableStatus.LatestVersion != "" {
              t.Fatalf("Stable status exposed Phase 35 UAT2 prerelease: %+v", stableStatus)
            }

            future := []release{
              {TagName: "v0.1.0-beta.7", Prerelease: true},
              {TagName: "v0.1.0-beta.6.uat.2", Prerelease: true},
              {TagName: "v0.1.0-beta.6.uat.1", Prerelease: true},
            }
            next, ok := selectLatestRelease(future, BetaChannel)
            if !ok || next.TagName != "v0.1.0-beta.7" {
              t.Fatalf("future beta.7 should supersede Phase 35 UAT2, got %+v ok=%v", next, ok)
            }
          }
          EOF

          gofmt -w backend/internal/updater/updater_test.go backend/internal/version/version.go backend/cmd/LANnventory/main.go

      - name: Build frontend and refresh embedded bundle
        working-directory: frontend
        run: |
          npm ci
          npm run test:host-ux
          make all

      - name: Refresh Swagger
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Validate UAT2
        env:
          UAT_VERSION: 0.1.0-beta.6.uat.2
          UAT_TAG: v0.1.0-beta.6.uat.2
        run: |
          set -euo pipefail
          cmp -s proxmox/collect_inventory.py frontend/public/lannventory-proxmox-collector.py
          cmp -s proxmox/collect_inventory.py backend/internal/web/public/lannventory-proxmox-collector.py
          node --check frontend/dev/mock-api.mjs
          bash -n proxmox/lannventory.sh
          bash proxmox/lannventory_test.sh
          python3 -m unittest proxmox/collect_inventory_test.py

          cd backend
          go test ./...
          go test ./internal/version -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}"
          go vet ./...
          go build -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}" ./cmd/LANnventory
          cd ..

      - name: Commit UAT2 metadata
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/internal/version/version.go \
            backend/internal/updater/updater_test.go \
            backend/cmd/LANnventory/main.go \
            backend/docs \
            backend/internal/web/public \
            frontend/package.json \
            frontend/package-lock.json \
            Dockerfile \
            proxmox/lannventory.sh \
            proxmox/lannventory_test.sh \
            proxmox/README.md \
            README.md \
            docs/releases/v0.1.0-beta.6.uat.2.md
          git diff --cached --check
          git commit -m "phase35: prepare v0.1.0-beta.6.uat.2 UAT"
          git push origin HEAD:phase35-device-profiles-proxmox
