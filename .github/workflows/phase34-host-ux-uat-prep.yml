name: Phase34 Host UX UAT prep

on:
  push:
    branches:
      - phase34-host-ux-uat
    paths:
      - .github/workflows/phase34-host-ux-uat-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase34-host-ux-uat
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply UAT.2 version metadata and updater selection test
        env:
          OLD_VERSION: 0.1.0-beta.5.uat.1
          OLD_TAG: v0.1.0-beta.5.uat.1
          UAT_VERSION: 0.1.0-beta.5.uat.2
          UAT_TAG: v0.1.0-beta.5.uat.2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          old = os.environ["OLD_VERSION"]
          old_tag = os.environ["OLD_TAG"]
          version = os.environ["UAT_VERSION"]
          tag = os.environ["UAT_TAG"]
          tick = chr(96)

          def replace_once(path_name, old_text, new_text):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old_text)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one match for {old_text!r}, found {count}")
              path.write_text(text.replace(old_text, new_text, 1))

          replace_once(
              "backend/internal/version/version.go",
              f'var Version = "{old}"',
              f'var Version = "{version}"',
          )
          replace_once(
              "backend/cmd/LANnventory/main.go",
              f"// @version {old}",
              f"// @version {version}",
          )

          package_path = Path("frontend/package.json")
          package = json.loads(package_path.read_text())
          if package.get("version") != old:
              raise SystemExit(f"frontend/package.json: expected {old}, got {package.get('version')}")
          package["version"] = version
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          lock_path = Path("frontend/package-lock.json")
          lock = json.loads(lock_path.read_text())
          if lock.get("version") != old or lock.get("packages", {}).get("", {}).get("version") != old:
              raise SystemExit("frontend/package-lock.json: root version mismatch before UAT.2 bump")
          lock["version"] = version
          lock["packages"][""]["version"] = version
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          replace_once("Dockerfile", f"ARG LANNVENTORY_VERSION={old}", f"ARG LANNVENTORY_VERSION={version}")
          replace_once("proxmox/lannventory.sh", f'RELEASE_TAG="{old_tag}"', f'RELEASE_TAG="{tag}"')
          replace_once("proxmox/lannventory.sh", f'VERSION="{old}"', f'VERSION="{version}"')
          replace_once(
              "proxmox/lannventory_test.sh",
              f"https://github.com/godlev/LANnventory/releases/download/{old_tag}/lannventory_{old}_linux_amd64.deb",
              f"https://github.com/godlev/LANnventory/releases/download/{tag}/lannventory_{version}_linux_amd64.deb",
          )
          replace_once(
              "README.md",
              f"Current beta release: {tick}{old}{tick}",
              f"Current beta release: {tick}{version}{tick}",
          )

          updater_path = Path("backend/internal/updater/updater_test.go")
          updater = updater_path.read_text()
          marker = "func TestPhase34HostUXUATReleaseSelectionFromUAT1"
          if marker in updater:
              raise SystemExit("Host UX UAT updater selection test already exists")
          updater += r'''

func TestPhase34HostUXUATReleaseSelectionFromUAT1(t *testing.T) {
	releases := []release{
		{
			TagName:     "v0.1.0-beta.5.uat.2",
			Prerelease:  true,
			Draft:       false,
			PublishedAt: "2026-09-18T00:00:00Z",
			HTMLURL:     "https://github.com/godlev/LANnventory/releases/tag/v0.1.0-beta.5.uat.2",
		},
		{
			TagName:    "v0.1.0-beta.5.uat.1",
			Prerelease: true,
			Draft:      false,
		},
	}

	betaStatus, selected, ok := buildStatus(
		"v0.1.0-beta.5.uat.1",
		BetaChannel,
		releases,
		time.Time{},
		false,
	)
	if !ok {
		t.Fatal("Beta channel did not select the Host UX UAT release")
	}
	if selected.TagName != "v0.1.0-beta.5.uat.2" {
		t.Fatalf("Beta selected %q, want Host UX UAT", selected.TagName)
	}
	if !betaStatus.Available || betaStatus.LatestVersion != "0.1.0-beta.5.uat.2" {
		t.Fatalf("Beta status = %+v, want available Host UX UAT", betaStatus)
	}

	stableStatus, selected, ok := buildStatus(
		"v0.1.0-beta.5.uat.1",
		StableChannel,
		releases,
		time.Time{},
		false,
	)
	if ok || selected.TagName != "" {
		t.Fatalf("Stable channel selected prerelease: selected=%+v ok=%v", selected, ok)
	}
	if stableStatus.Available || stableStatus.LatestVersion != "" {
		t.Fatalf("Stable status exposed Host UX UAT prerelease: %+v", stableStatus)
	}

	future, ok := selectLatestRelease([]release{
		{TagName: "v0.1.0-beta.6", Prerelease: true},
		{TagName: "v0.1.0-beta.5.uat.2", Prerelease: true},
	}, BetaChannel)
	if !ok || future.TagName != "v0.1.0-beta.6" {
		t.Fatalf("future beta.6 should supersede Host UX UAT, got %+v ok=%v", future, ok)
	}
}
'''
          updater_path.write_text(updater)

          notes = f"""# LANnventory {tag}
          
          ## Summary
          
          - Clarifies Host Details as current network identity: Current IP, Current MAC, MAC type, Interface, Network vendor, and MAC-scoped first/last seen timestamps.
          - Renames the observation area to Network identity history and makes shared-IP history explicit: an IP reused by another MAC is not a same-physical-device conclusion.
          - Keeps same-device correlation visibly separate from IP reuse history; correlation scoring and user decisions are unchanged.
          - Host Recent Events now show Event, historical IP snapshot, historical MAC snapshot, and Time, without redundant links back to the same Host page.
          - Adds responsive stacking for Host Recent Events and regression contracts preserving global Events Host links and missing IP/MAC fallbacks.
          
          ## UAT focus
          
          Update from v0.1.0-beta.5.uat.1 through Settings → Updates on the Beta channel. Verify the Host page with a reused IP, the separation between IP history and same-device correlation, historical event IP/MAC snapshots, and narrow/mobile layout.
          
          ## Release status
          
          Phase 34 UAT usability correction. This prerelease is for updater UAT only and is not the final Phase 34 merge or stable release.
          """
          Path("docs/releases", f"{tag}.md").write_text(notes.replace("          ", ""))
          PY

          gofmt -w backend/internal/updater/updater_test.go backend/internal/version/version.go backend/cmd/LANnventory/main.go

      - name: Build frontend and refresh embedded bundle
        working-directory: frontend
        run: |
          npm ci
          npm run test:host-ux
          make all

      - name: Refresh Swagger docs
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Validate updater ordering and UAT.2 surfaces
        env:
          UAT_VERSION: 0.1.0-beta.5.uat.2
          UAT_TAG: v0.1.0-beta.5.uat.2
        run: |
          set -euo pipefail
          cd backend
          go test ./internal/updater ./internal/version ./internal/api ./internal/correlation
          go vet ./internal/updater ./internal/version ./internal/api ./internal/correlation
          go build -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}" ./cmd/LANnventory
          cd ..

          bash -n proxmox/lannventory.sh
          bash proxmox/lannventory_test.sh

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          version = os.environ["UAT_VERSION"]
          tag = os.environ["UAT_TAG"]
          checks = {
              "backend fallback": f'var Version = "{version}"' in Path("backend/internal/version/version.go").read_text(),
              "swagger source": f"// @version {version}" in Path("backend/cmd/LANnventory/main.go").read_text(),
              "frontend package": json.loads(Path("frontend/package.json").read_text()).get("version") == version,
              "frontend lock": json.loads(Path("frontend/package-lock.json").read_text()).get("version") == version,
              "docker": f"ARG LANNVENTORY_VERSION={version}" in Path("Dockerfile").read_text(),
              "proxmox tag": f'RELEASE_TAG="{tag}"' in Path("proxmox/lannventory.sh").read_text(),
              "proxmox version": f'VERSION="{version}"' in Path("proxmox/lannventory.sh").read_text(),
              "release summary": Path("docs/releases", f"{tag}.md").exists(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("UAT.2 version surface failures: " + ", ".join(failed))
          print("UAT.2 version surfaces PASS")
          PY

      - name: Commit UAT.2 metadata
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/internal/version/version.go \
            backend/internal/updater/updater_test.go \
            backend/cmd/LANnventory/main.go \
            backend/docs \
            backend/internal/web/public \
            frontend/package.json \
            frontend/package-lock.json \
            Dockerfile \
            proxmox/lannventory.sh \
            proxmox/lannventory_test.sh \
            README.md \
            docs/releases/v0.1.0-beta.5.uat.2.md
          git diff --cached --check
          git commit -m "phase34: prepare v0.1.0-beta.5.uat.2 Host UX UAT"
          git push origin HEAD:phase34-host-ux-uat
