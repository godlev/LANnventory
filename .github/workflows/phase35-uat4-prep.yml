name: Phase35 UAT4 prep

on:
  push:
    branches:
      - phase35-device-profiles-proxmox
    paths:
      - .github/workflows/phase35-uat4-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase35-device-profiles-proxmox
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply UAT4 version metadata and release notes
        env:
          PREVIOUS_VERSION: 0.1.0-beta.6.uat.3
          PREVIOUS_TAG: v0.1.0-beta.6.uat.3
          UAT_VERSION: 0.1.0-beta.6.uat.4
          UAT_TAG: v0.1.0-beta.6.uat.4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          previous = os.environ["PREVIOUS_VERSION"]
          previous_tag = os.environ["PREVIOUS_TAG"]
          version = os.environ["UAT_VERSION"]
          tag = os.environ["UAT_TAG"]
          tick = chr(96)

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one match for {old!r}, found {count}")
              path.write_text(text.replace(old, new, 1))

          replace_once("backend/internal/version/version.go", f'var Version = "{previous}"', f'var Version = "{version}"')

          main = Path("backend/cmd/LANnventory/main.go")
          text = main.read_text()
          text, count = re.subn(rf'(?m)^// @version {re.escape(previous)}$', f'// @version {version}', text, count=1)
          if count != 1:
              raise SystemExit("Swagger version annotation mismatch")
          main.write_text(text)

          package_path = Path("frontend/package.json")
          package = json.loads(package_path.read_text())
          if package.get("version") != previous:
              raise SystemExit("frontend/package.json version mismatch")
          package["version"] = version
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          lock_path = Path("frontend/package-lock.json")
          lock = json.loads(lock_path.read_text())
          if lock.get("version") != previous or lock.get("packages", {}).get("", {}).get("version") != previous:
              raise SystemExit("frontend/package-lock.json version mismatch")
          lock["version"] = version
          lock["packages"][""]["version"] = version
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          replace_once("Dockerfile", f"ARG LANNVENTORY_VERSION={previous}", f"ARG LANNVENTORY_VERSION={version}")
          replace_once("proxmox/lannventory.sh", f'RELEASE_TAG="{previous_tag}"', f'RELEASE_TAG="{tag}"')
          replace_once("proxmox/lannventory.sh", f'VERSION="{previous}"', f'VERSION="{version}"')

          prox_test = Path("proxmox/lannventory_test.sh")
          text = prox_test.read_text()
          old_url = f"https://github.com/godlev/LANnventory/releases/download/{previous_tag}/lannventory_{previous}_linux_amd64.deb"
          new_url = f"https://github.com/godlev/LANnventory/releases/download/{tag}/lannventory_{version}_linux_amd64.deb"
          if text.count(old_url) != 1:
              raise SystemExit("Proxmox installer test URL mismatch")
          prox_test.write_text(text.replace(old_url, new_url, 1))

          readme = Path("README.md")
          text = readme.read_text()
          old_marker = f"Current beta release: {tick}{previous}{tick}"
          new_marker = f"Current beta release: {tick}{version}{tick}"
          if text.count(old_marker) != 1:
              raise SystemExit("README beta marker mismatch")
          readme.write_text(text.replace(old_marker, new_marker, 1))

          release = Path("docs/releases") / f"{tag}.md"
          release.parent.mkdir(parents=True, exist_ok=True)
          release.write_text(f"""# LANnventory {tag}

          ## Summary

          - Improves the Phase 35A Proxmox collector workflow for larger environments: the generated command now writes compact JSON directly to /tmp/lannventory-proxmox.json instead of flooding the Proxmox terminal.
          - Makes file upload the recommended path for larger snapshots and provides an SCP example to copy the snapshot from Proxmox to the user's computer; manual compact JSON paste remains available for smaller setups.
          - Removes programmatic clipboard writes for terminal commands. "Copy" is replaced with "Select command", so security extensions that detect ClickFix-style clipboard injection are not triggered by LANnventory.
          - Adds an explicit "What Import will do in LANnventory" section to Preview with the actual Add / Update / Retire counts.
          - Clarifies that workloads remain separate inventory records and are not turned into fake LANnventory Hosts.
          - Clarifies that Import never creates, modifies, starts, stops, or deletes VMs/LXCs on Proxmox.
          - Clarifies that managed Device Profile fields and manual workload links remain protected.
          - Renames the final action from the ambiguous "Apply reviewed snapshot" to "Import into LANnventory".

          ## UAT focus

          Upgrade from {previous_tag} through Settings → Updates on the Beta channel.

          Verify:
          - the collector command creates /tmp/lannventory-proxmox.json without dumping the full JSON into the shell;
          - "Select command" only selects text and does not write terminal commands to the clipboard automatically;
          - the SCP example uses the current Proxmox Host address and the JSON file can be uploaded with "Choose JSON file";
          - manual paste of compact JSON still works as a fallback;
          - Preview clearly explains what Import will change in LANnventory before confirmation;
          - the Preview explicitly says that Proxmox itself will not be modified and no fake Hosts will be created;
          - the final button reads "Import into LANnventory";
          - the UAT3 duplicate-interface collector fix remains intact.

          ## Release status

          Phase 35A UX/safety UAT patch. Phase 35.8 Proxmox API credentials/automatic sync remains intentionally out of scope until UAT is approved.
          """.replace("          ", ""))
          PY

          cat >> backend/internal/updater/updater_test.go <<'EOF'

          func TestPhase35UAT4SelectionFromUAT3(t *testing.T) {
            releases := []release{
              {
                TagName:     "v0.1.0-beta.6.uat.4",
                Prerelease:  true,
                Draft:       false,
                PublishedAt: "2026-09-20T00:00:00Z",
                HTMLURL:     "https://github.com/godlev/LANnventory/releases/tag/v0.1.0-beta.6.uat.4",
              },
              {
                TagName:    "v0.1.0-beta.6.uat.3",
                Prerelease: true,
                Draft:      false,
              },
            }

            betaStatus, selected, ok := buildStatus(
              "v0.1.0-beta.6.uat.3",
              BetaChannel,
              releases,
              time.Time{},
              false,
            )
            if !ok || selected.TagName != "v0.1.0-beta.6.uat.4" {
              t.Fatalf("Beta did not select UAT4: selected=%+v ok=%v", selected, ok)
            }
            if !betaStatus.Available || betaStatus.LatestVersion != "0.1.0-beta.6.uat.4" {
              t.Fatalf("Beta status = %+v, want available UAT4", betaStatus)
            }

            stableStatus, selected, ok := buildStatus(
              "v0.1.0-beta.6.uat.3",
              StableChannel,
              releases,
              time.Time{},
              false,
            )
            if ok || selected.TagName != "" || stableStatus.Available {
              t.Fatalf("Stable channel exposed UAT4 prerelease: status=%+v selected=%+v ok=%v", stableStatus, selected, ok)
            }

            future := []release{
              {TagName: "v0.1.0-beta.7", Prerelease: true},
              {TagName: "v0.1.0-beta.6.uat.4", Prerelease: true},
              {TagName: "v0.1.0-beta.6.uat.3", Prerelease: true},
            }
            next, ok := selectLatestRelease(future, BetaChannel)
            if !ok || next.TagName != "v0.1.0-beta.7" {
              t.Fatalf("future beta.7 should supersede UAT4, got %+v ok=%v", next, ok)
            }
          }
          EOF

          gofmt -w backend/internal/updater/updater_test.go backend/internal/version/version.go backend/cmd/LANnventory/main.go

      - name: Build frontend and refresh embedded bundle
        working-directory: frontend
        run: |
          npm ci
          npm run test:host-ux
          make all

      - name: Refresh Swagger docs
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Validate UAT4
        env:
          UAT_VERSION: 0.1.0-beta.6.uat.4
        run: |
          set -euo pipefail
          node --check frontend/dev/mock-api.mjs
          bash -n proxmox/lannventory.sh
          bash proxmox/lannventory_test.sh
          cd backend
          go test ./...
          go test ./internal/version -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}"
          go vet ./...
          go build -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}" ./cmd/LANnventory

      - name: Commit UAT4 metadata
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/internal/version/version.go \
            backend/internal/updater/updater_test.go \
            backend/cmd/LANnventory/main.go \
            backend/docs \
            backend/internal/web/public \
            frontend/package.json \
            frontend/package-lock.json \
            Dockerfile \
            proxmox/lannventory.sh \
            proxmox/lannventory_test.sh \
            README.md \
            docs/releases/v0.1.0-beta.6.uat.4.md
          git diff --cached --check
          git commit -m "phase35: prepare v0.1.0-beta.6.uat.4 UAT"
          git push origin HEAD:phase35-device-profiles-proxmox
