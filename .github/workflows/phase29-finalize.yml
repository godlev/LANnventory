name: Phase 29 Finalize Generated Assets

on:
  push:
    branches:
      - phase-29-self-update

permissions:
  contents: write

jobs:
  finalize-generated:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: phase-29-self-update

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Replace complete embedded frontend asset set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/internal/web/public/assets
          mkdir -p backend/internal/web/public/assets
          cp -a frontend/dist/assets/. backend/internal/web/public/assets/
          python3 - <<'PY'
          from pathlib import Path
          root = Path("backend/internal/web/public/assets")
          entry_js = root / "index.js"
          entry_css = root / "index.css"
          entry_js.write_text(entry_js.read_text().replace("assets/", "fs/public/assets/"))
          entry_css.write_text(entry_css.read_text().replace("url(/assets/", "url(/fs/public/assets/"))
          PY

      - name: Verify update UI is embedded
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/internal/web/public/assets/Config.js
          grep -Fq '/api/update/status' backend/internal/web/public/assets/Config.js
          grep -Fq '/api/update/channel' backend/internal/web/public/assets/Config.js
          grep -Fq '/api/update/apply' backend/internal/web/public/assets/Config.js
          grep -Fq 'Update available' backend/internal/web/public/assets/Config.js
          grep -Fq 'Stable' backend/internal/web/public/assets/Config.js
          grep -Fq 'Beta' backend/internal/web/public/assets/Config.js

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Refresh Swagger docs
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Commit generated files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase29-finalize.yml
          git add -A backend/internal/web/public/assets backend/docs
          git diff --cached --check
          git commit -m "Refresh Phase 29 generated frontend and API docs"
          git push origin HEAD:phase-29-self-update
