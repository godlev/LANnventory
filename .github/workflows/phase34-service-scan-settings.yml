name: Phase34 service scan settings API

on:
  push:
    branches:
      - phase34-service-inventory
    paths:
      - .github/workflows/phase34-service-scan-settings.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase34-service-inventory
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Add service scan settings domain and API
        run: |
          mkdir -p backend/internal/servicescan
          cat > backend/internal/servicescan/ports.go <<'EOF'
          package servicescan

          import (
            "encoding/json"
            "errors"
            "sort"
            "strings"
          )

          const MaxScheduledPorts = 256

          var (
            ErrInvalidPort  = errors.New("invalid service scan port")
            ErrTooManyPorts = errors.New("too many scheduled service scan ports")
          )

          // NormalizePorts validates, de-duplicates and sorts scheduled TCP ports.
          func NormalizePorts(ports []int) ([]int, error) {
            seen := make(map[int]struct{}, len(ports))
            normalized := make([]int, 0, len(ports))

            for _, port := range ports {
              if port < 1 || port > 65535 {
                return nil, ErrInvalidPort
              }
              if _, exists := seen[port]; exists {
                continue
              }
              seen[port] = struct{}{}
              normalized = append(normalized, port)
            }

            if len(normalized) > MaxScheduledPorts {
              return nil, ErrTooManyPorts
            }

            sort.Ints(normalized)
            return normalized, nil
          }

          // DecodePortsJSON decodes persisted settings and applies the same validation
          // used by the API before a scheduled scan can run.
          func DecodePortsJSON(value string) ([]int, error) {
            value = strings.TrimSpace(value)
            if value == "" {
              return []int{}, nil
            }

            var ports []int
            if err := json.Unmarshal([]byte(value), &ports); err != nil {
              return nil, err
            }
            return NormalizePorts(ports)
          }

          // EncodePortsJSON returns canonical persisted JSON plus normalized ports.
          func EncodePortsJSON(ports []int) (string, []int, error) {
            normalized, err := NormalizePorts(ports)
            if err != nil {
              return "", nil, err
            }
            encoded, err := json.Marshal(normalized)
            if err != nil {
              return "", nil, err
            }
            return string(encoded), normalized, nil
          }

          // CanonicalPortsJSON validates and canonicalizes an existing JSON representation.
          func CanonicalPortsJSON(value string) (string, []int, error) {
            ports, err := DecodePortsJSON(value)
            if err != nil {
              return "", nil, err
            }
            return EncodePortsJSON(ports)
          }
          EOF

          cat > backend/internal/servicescan/ports_test.go <<'EOF'
          package servicescan

          import (
            "errors"
            "fmt"
            "testing"
          )

          func TestNormalizePortsSortsAndDeduplicates(t *testing.T) {
            ports, err := NormalizePorts([]int{443, 22, 443, 80})
            if err != nil {
              t.Fatalf("NormalizePorts: %v", err)
            }
            want := []int{22, 80, 443}
            if fmt.Sprint(ports) != fmt.Sprint(want) {
              t.Fatalf("ports = %v, want %v", ports, want)
            }
          }

          func TestNormalizePortsRejectsInvalidAndOversizedLists(t *testing.T) {
            if _, err := NormalizePorts([]int{0, 443}); !errors.Is(err, ErrInvalidPort) {
              t.Fatalf("invalid port error = %v, want %v", err, ErrInvalidPort)
            }

            ports := make([]int, MaxScheduledPorts+1)
            for i := range ports {
              ports[i] = i + 1
            }
            if _, err := NormalizePorts(ports); !errors.Is(err, ErrTooManyPorts) {
              t.Fatalf("oversized error = %v, want %v", err, ErrTooManyPorts)
            }
          }

          func TestPortsJSONCanonicalization(t *testing.T) {
            encoded, ports, err := CanonicalPortsJSON(" [443, 22, 443] ")
            if err != nil {
              t.Fatalf("CanonicalPortsJSON: %v", err)
            }
            if encoded != "[22,443]" || fmt.Sprint(ports) != "[22 443]" {
              t.Fatalf("encoded=%q ports=%v", encoded, ports)
            }

            encoded, ports, err = CanonicalPortsJSON("")
            if err != nil {
              t.Fatalf("CanonicalPortsJSON empty: %v", err)
            }
            if encoded != "[]" || len(ports) != 0 {
              t.Fatalf("empty encoded=%q ports=%v", encoded, ports)
            }
          }
          EOF

          cat > backend/internal/api/api-service-scan.go <<'EOF'
          package api

          import (
            "net/http"
            "time"

            "github.com/gin-gonic/gin"

            "github.com/godlev/LANnventory/internal/gdb"
            "github.com/godlev/LANnventory/internal/models"
            "github.com/godlev/LANnventory/internal/servicescan"
          )

          const defaultServiceScanIntervalMinutes = 1440

          type serviceScanSettingsRequest struct {
            Enabled         bool  `json:"enabled"`
            IntervalMinutes int   `json:"intervalMinutes"`
            Ports           []int `json:"ports"`
          }

          type serviceScanSettingsResponse struct {
            Enabled          bool   `json:"enabled"`
            IntervalMinutes  int    `json:"intervalMinutes"`
            Ports            []int  `json:"ports"`
            NextScanAt       string `json:"nextScanAt"`
            LastAttemptAt    string `json:"lastAttemptAt"`
            LastSuccessfulAt string `json:"lastSuccessfulAt"`
            LastError        string `json:"lastError"`
          }

          // getHostServiceScanSettings godoc
          // @Summary      Get scheduled service scan settings
          // @Description  Return opt-in scheduled TCP service scan settings and runtime state for a host.
          // @Tags         hosts
          // @Produce      json
          // @Param        id   path      int  true  "Host ID"
          // @Success      200  {object}  serviceScanSettingsResponse
          // @Failure      400  {object}  map[string]string
          // @Failure      500  {object}  map[string]string
          // @Router       /host/{id}/service-scan-settings [get]
          func getHostServiceScanSettings(c *gin.Context) {
            host, err := getHostByID(c.Param("id"))
            if err != nil || host.ID < 1 {
              c.IndentedJSON(http.StatusBadRequest, gin.H{"error": errInvalidHostID.Error()})
              return
            }

            response, err := loadServiceScanSettingsResponse(host.Mac)
            if err != nil {
              c.IndentedJSON(http.StatusInternalServerError, gin.H{"error": "failed to load service scan settings"})
              return
            }
            c.IndentedJSON(http.StatusOK, response)
          }

          // setHostServiceScanSettings godoc
          // @Summary      Save scheduled service scan settings
          // @Description  Enable or disable scheduled TCP service scanning for a host. Ports are validated, de-duplicated and sorted. Enabling or changing settings schedules the next scan immediately.
          // @Tags         hosts
          // @Accept       json
          // @Produce      json
          // @Param        id    path      int                         true  "Host ID"
          // @Param        body  body      serviceScanSettingsRequest  true  "Service scan settings"
          // @Success      200   {object}  serviceScanSettingsResponse
          // @Failure      400   {object}  map[string]string
          // @Failure      500   {object}  map[string]string
          // @Router       /host/{id}/service-scan-settings [put]
          func setHostServiceScanSettings(c *gin.Context) {
            host, err := getHostByID(c.Param("id"))
            if err != nil || host.ID < 1 {
              c.IndentedJSON(http.StatusBadRequest, gin.H{"error": errInvalidHostID.Error()})
              return
            }

            var request serviceScanSettingsRequest
            if err := c.ShouldBindJSON(&request); err != nil {
              c.IndentedJSON(http.StatusBadRequest, gin.H{"error": "invalid service scan settings"})
              return
            }
            if request.IntervalMinutes <= 0 {
              c.IndentedJSON(http.StatusBadRequest, gin.H{"error": "intervalMinutes must be greater than zero"})
              return
            }

            portsJSON, normalizedPorts, err := servicescan.EncodePortsJSON(request.Ports)
            if err != nil {
              c.IndentedJSON(http.StatusBadRequest, gin.H{"error": "invalid scheduled service scan ports"})
              return
            }
            if request.Enabled && len(normalizedPorts) == 0 {
              c.IndentedJSON(http.StatusBadRequest, gin.H{"error": "at least one port is required when scheduled scanning is enabled"})
              return
            }

            settings, found, err := gdb.SelectServiceScanSettingsByMAC(host.Mac)
            if err != nil {
              c.IndentedJSON(http.StatusInternalServerError, gin.H{"error": "failed to load service scan settings"})
              return
            }
            if !found {
              settings = models.ServiceScanSettings{Mac: host.Mac}
            }

            settings.Enabled = request.Enabled
            settings.IntervalMinutes = request.IntervalMinutes
            settings.PortsJSON = portsJSON
            settings.LastError = ""
            if request.Enabled {
              settings.NextScanAt = time.Now().Format(models.HostEventDateLayout)
            } else {
              settings.NextScanAt = ""
            }

            settings, err = gdb.UpsertServiceScanSettings(settings)
            if err != nil {
              c.IndentedJSON(http.StatusInternalServerError, gin.H{"error": "failed to save service scan settings"})
              return
            }

            response, err := serviceScanSettingsResponseFromModel(settings)
            if err != nil {
              c.IndentedJSON(http.StatusInternalServerError, gin.H{"error": "failed to read saved service scan settings"})
              return
            }
            c.IndentedJSON(http.StatusOK, response)
          }

          func loadServiceScanSettingsResponse(mac string) (serviceScanSettingsResponse, error) {
            settings, found, err := gdb.SelectServiceScanSettingsByMAC(mac)
            if err != nil {
              return serviceScanSettingsResponse{}, err
            }
            if !found {
              return serviceScanSettingsResponse{
                Enabled:         false,
                IntervalMinutes: defaultServiceScanIntervalMinutes,
                Ports:           []int{},
              }, nil
            }
            return serviceScanSettingsResponseFromModel(settings)
          }

          func serviceScanSettingsResponseFromModel(settings models.ServiceScanSettings) (serviceScanSettingsResponse, error) {
            ports, err := servicescan.DecodePortsJSON(settings.PortsJSON)
            if err != nil {
              return serviceScanSettingsResponse{}, err
            }
            return serviceScanSettingsResponse{
              Enabled:          settings.Enabled,
              IntervalMinutes:  settings.IntervalMinutes,
              Ports:            ports,
              NextScanAt:       settings.NextScanAt,
              LastAttemptAt:    settings.LastAttemptAt,
              LastSuccessfulAt: settings.LastSuccessfulAt,
              LastError:        settings.LastError,
            }, nil
          }
          EOF

          cat > backend/internal/api/api_service_scan_test.go <<'EOF'
          package api

          import (
            "bytes"
            "encoding/json"
            "net/http"
            "net/http/httptest"
            "strconv"
            "testing"

            "github.com/godlev/LANnventory/internal/gdb"
            "github.com/godlev/LANnventory/internal/models"
          )

          func TestHostServiceScanSettingsDefaultAndSave(t *testing.T) {
            router := setupTestRouter(t)
            host := seedHost(t, models.Host{
              Name:  "server",
              IP:    "192.168.1.80",
              Mac:   "AA:BB:CC:DD:EE:B0",
              Iface: "eth0",
              Known: 1,
              Now:   1,
            })
            path := "/api/host/" + strconv.Itoa(host.ID) + "/service-scan-settings"

            req := httptest.NewRequest(http.MethodGet, path, nil)
            rec := httptest.NewRecorder()
            router.ServeHTTP(rec, req)
            if rec.Code != http.StatusOK {
              t.Fatalf("GET status = %d; body: %s", rec.Code, rec.Body.String())
            }

            var initial serviceScanSettingsResponse
            if err := json.Unmarshal(rec.Body.Bytes(), &initial); err != nil {
              t.Fatalf("GET json.Unmarshal: %v", err)
            }
            if initial.Enabled || initial.IntervalMinutes != defaultServiceScanIntervalMinutes || len(initial.Ports) != 0 {
              t.Fatalf("initial settings = %+v", initial)
            }

            body := []byte(`{"enabled":true,"intervalMinutes":60,"ports":[443,22,443]}`)
            req = httptest.NewRequest(http.MethodPut, path, bytes.NewReader(body))
            req.Header.Set("Content-Type", "application/json")
            rec = httptest.NewRecorder()
            router.ServeHTTP(rec, req)
            if rec.Code != http.StatusOK {
              t.Fatalf("PUT status = %d; body: %s", rec.Code, rec.Body.String())
            }

            var saved serviceScanSettingsResponse
            if err := json.Unmarshal(rec.Body.Bytes(), &saved); err != nil {
              t.Fatalf("PUT json.Unmarshal: %v", err)
            }
            if !saved.Enabled || saved.IntervalMinutes != 60 || len(saved.Ports) != 2 || saved.Ports[0] != 22 || saved.Ports[1] != 443 || saved.NextScanAt == "" {
              t.Fatalf("saved settings = %+v", saved)
            }

            stored, found, err := gdb.SelectServiceScanSettingsByMAC(host.Mac)
            if err != nil || !found {
              t.Fatalf("SelectServiceScanSettingsByMAC found=%v err=%v", found, err)
            }
            if stored.PortsJSON != "[22,443]" || !stored.Enabled || stored.NextScanAt == "" {
              t.Fatalf("stored settings = %+v", stored)
            }
          }

          func TestHostServiceScanSettingsRejectsUnsafeEnabledConfig(t *testing.T) {
            router := setupTestRouter(t)
            host := seedHost(t, models.Host{
              Name:  "server",
              IP:    "192.168.1.81",
              Mac:   "AA:BB:CC:DD:EE:B1",
              Iface: "eth0",
              Known: 1,
              Now:   1,
            })
            path := "/api/host/" + strconv.Itoa(host.ID) + "/service-scan-settings"

            tests := []string{
              `{"enabled":true,"intervalMinutes":60,"ports":[]}`,
              `{"enabled":true,"intervalMinutes":0,"ports":[443]}`,
              `{"enabled":true,"intervalMinutes":60,"ports":[0,443]}`,
              `{"enabled":true,"intervalMinutes":60,"ports":[65536]}`,
            }
            for _, body := range tests {
              req := httptest.NewRequest(http.MethodPut, path, bytes.NewBufferString(body))
              req.Header.Set("Content-Type", "application/json")
              rec := httptest.NewRecorder()
              router.ServeHTTP(rec, req)
              if rec.Code != http.StatusBadRequest {
                t.Fatalf("body %s status = %d, want 400; response: %s", body, rec.Code, rec.Body.String())
              }
            }
          }

          func TestHostServiceScanSettingsDisableClearsNextScanAndPreservesRuntime(t *testing.T) {
            router := setupTestRouter(t)
            host := seedHost(t, models.Host{
              Name:  "server",
              IP:    "192.168.1.82",
              Mac:   "AA:BB:CC:DD:EE:B2",
              Iface: "eth0",
              Known: 1,
              Now:   1,
            })
            if _, err := gdb.UpsertServiceScanSettings(models.ServiceScanSettings{
              Mac:              host.Mac,
              Enabled:          true,
              IntervalMinutes:  30,
              PortsJSON:        "[22]",
              NextScanAt:       "2026-09-18 11:00:00",
              LastAttemptAt:    "2026-09-18 10:00:00",
              LastSuccessfulAt: "2026-09-18 10:00:00",
              LastError:        "old error",
            }); err != nil {
              t.Fatalf("UpsertServiceScanSettings: %v", err)
            }

            path := "/api/host/" + strconv.Itoa(host.ID) + "/service-scan-settings"
            body := []byte(`{"enabled":false,"intervalMinutes":120,"ports":[22,443]}`)
            req := httptest.NewRequest(http.MethodPut, path, bytes.NewReader(body))
            req.Header.Set("Content-Type", "application/json")
            rec := httptest.NewRecorder()
            router.ServeHTTP(rec, req)
            if rec.Code != http.StatusOK {
              t.Fatalf("PUT status = %d; body: %s", rec.Code, rec.Body.String())
            }

            stored, found, err := gdb.SelectServiceScanSettingsByMAC(host.Mac)
            if err != nil || !found {
              t.Fatalf("SelectServiceScanSettingsByMAC found=%v err=%v", found, err)
            }
            if stored.Enabled || stored.NextScanAt != "" || stored.IntervalMinutes != 120 || stored.LastAttemptAt != "2026-09-18 10:00:00" || stored.LastSuccessfulAt != "2026-09-18 10:00:00" || stored.LastError != "" {
              t.Fatalf("disabled settings = %+v", stored)
            }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one exact match, found {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'backend/internal/gdb/services.go',
              '''\t"github.com/godlev/LANnventory/internal/identity"\n\t"github.com/godlev/LANnventory/internal/models"''',
              '''\t"github.com/godlev/LANnventory/internal/identity"\n\t"github.com/godlev/LANnventory/internal/models"\n\t"github.com/godlev/LANnventory/internal/servicescan"''',
          )
          replace_once(
              'backend/internal/gdb/services.go',
              '''\terrInvalidServiceProtocol = errors.New("invalid service protocol")\n\terrInvalidServiceInterval = errors.New("invalid service scan interval")''',
              '''\terrInvalidServiceProtocol = errors.New("invalid service protocol")\n\terrInvalidServiceInterval = errors.New("invalid service scan interval")\n\terrInvalidServicePorts    = errors.New("invalid service scan ports")''',
          )
          replace_once(
              'backend/internal/gdb/services.go',
              '''\tif settings.IntervalMinutes <= 0 {\n\t\treturn models.ServiceScanSettings{}, errInvalidServiceInterval\n\t}\n\tsettings.Mac = canonical\n\tsettings.PortsJSON = strings.TrimSpace(settings.PortsJSON)\n\tif settings.PortsJSON == "" {\n\t\tsettings.PortsJSON = "[]"\n\t}''',
              '''\tif settings.IntervalMinutes <= 0 {\n\t\treturn models.ServiceScanSettings{}, errInvalidServiceInterval\n\t}\n\tportsJSON, ports, err := servicescan.CanonicalPortsJSON(settings.PortsJSON)\n\tif err != nil || (settings.Enabled && len(ports) == 0) {\n\t\treturn models.ServiceScanSettings{}, errInvalidServicePorts\n\t}\n\tsettings.Mac = canonical\n\tsettings.PortsJSON = portsJSON\n\tsettings.LastError = strings.TrimSpace(settings.LastError)''',
          )
          replace_once(
              'backend/internal/gdb/services.go',
              '''func selectServiceByIdentity(activeDB *gorm.DB, mac, address, protocol string, port int)''',
              '''// SelectDueServiceScanSettings returns enabled scheduled scans due at or before now.\nfunc SelectDueServiceScanSettings(now string, limit int) ([]models.ServiceScanSettings, error) {\n\tnow = strings.TrimSpace(now)\n\tif now == "" {\n\t\treturn nil, errors.New("service scan due time is required")\n\t}\n\tif limit <= 0 {\n\t\tlimit = 32\n\t}\n\tif limit > 100 {\n\t\tlimit = 100\n\t}\n\n\tactiveDB, release, err := acquireDB()\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tdefer release()\n\n\tsettings := make([]models.ServiceScanSettings, 0)\n\terr = activeDB.Table(serviceScanSettingsTable).\n\t\tWhere("\\\"ENABLED\\\" = ? AND (\\\"NEXT_SCAN_AT\\\" = ? OR \\\"NEXT_SCAN_AT\\\" <= ?)", true, "", now).\n\t\tOrder("\\\"NEXT_SCAN_AT\\\" ASC, \\\"MAC\\\" ASC").\n\t\tLimit(limit).\n\t\tFind(&settings).Error\n\treturn settings, err\n}\n\n// UpdateServiceScanRuntime updates scheduler-owned fields without overwriting user configuration.\nfunc UpdateServiceScanRuntime(mac, nextScanAt, lastAttemptAt, lastError string, successful bool) error {\n\tcanonical, err := identity.NormalizeMAC(strings.TrimSpace(mac))\n\tif err != nil {\n\t\treturn errInvalidServiceIdentity\n\t}\n\n\tupdates := map[string]any{\n\t\t"NEXT_SCAN_AT":   strings.TrimSpace(nextScanAt),\n\t\t"LAST_ATTEMPT_AT": strings.TrimSpace(lastAttemptAt),\n\t\t"LAST_ERROR":      strings.TrimSpace(lastError),\n\t}\n\tif successful {\n\t\tupdates["LAST_SUCCESSFUL_AT"] = strings.TrimSpace(lastAttemptAt)\n\t}\n\n\tactiveDB, release, err := acquireDB()\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer release()\n\n\tresult := activeDB.Table(serviceScanSettingsTable).Where("\\\"MAC\\\" = ?", canonical).Updates(updates)\n\tif result.Error != nil {\n\t\treturn result.Error\n\t}\n\tif result.RowsAffected == 0 {\n\t\treturn gorm.ErrRecordNotFound\n\t}\n\treturn nil\n}\n\nfunc selectServiceByIdentity(activeDB *gorm.DB, mac, address, protocol string, port int)''',
          )

          replace_once(
              'backend/internal/api/routes.go',
              '''\t\tr0.GET("/host/:id/services", getHostServices)\n\t\tr0.GET("/host/:id/identity", getHostIdentity)''',
              '''\t\tr0.GET("/host/:id/services", getHostServices)\n\t\tr0.GET("/host/:id/service-scan-settings", getHostServiceScanSettings)\n\t\tr0.PUT("/host/:id/service-scan-settings", setHostServiceScanSettings)\n\t\tr0.GET("/host/:id/identity", getHostIdentity)''',
          )
          PY

          cat >> backend/internal/gdb/services_test.go <<'EOF'

          func TestServiceScanSettingsCanonicalDueAndRuntimeUpdate(t *testing.T) {
            oldConfig := conf.GetAppConfig()
            conf.SetAppConfigForTest(models.Conf{
              UseDB:  "sqlite",
              DBPath: filepath.Join(t.TempDir(), "service-due.db"),
            })
            t.Cleanup(func() {
              if err := Close(); err != nil {
                t.Errorf("Close: %v", err)
              }
              conf.SetAppConfigForTest(oldConfig)
            })

            if err := StartErr(); err != nil {
              t.Fatalf("StartErr: %v", err)
            }

            due, err := UpsertServiceScanSettings(models.ServiceScanSettings{
              Mac:             "AA:BB:CC:DD:EE:C0",
              Enabled:         true,
              IntervalMinutes: 60,
              PortsJSON:       "[443,22,443]",
              NextScanAt:      "2026-09-18 10:00:00",
            })
            if err != nil {
              t.Fatalf("Upsert due: %v", err)
            }
            if due.PortsJSON != "[22,443]" {
              t.Fatalf("canonical ports = %q, want [22,443]", due.PortsJSON)
            }

            if _, err := UpsertServiceScanSettings(models.ServiceScanSettings{
              Mac:             "AA:BB:CC:DD:EE:C1",
              Enabled:         true,
              IntervalMinutes: 60,
              PortsJSON:       "[80]",
              NextScanAt:      "2026-09-18 12:00:00",
            }); err != nil {
              t.Fatalf("Upsert future: %v", err)
            }
            if _, err := UpsertServiceScanSettings(models.ServiceScanSettings{
              Mac:             "AA:BB:CC:DD:EE:C2",
              Enabled:         false,
              IntervalMinutes: 60,
              PortsJSON:       "[]",
              NextScanAt:      "2026-09-18 09:00:00",
            }); err != nil {
              t.Fatalf("Upsert disabled: %v", err)
            }

            rows, err := SelectDueServiceScanSettings("2026-09-18 11:00:00", 10)
            if err != nil {
              t.Fatalf("SelectDueServiceScanSettings: %v", err)
            }
            if len(rows) != 1 || rows[0].Mac != "AA:BB:CC:DD:EE:C0" {
              t.Fatalf("due rows = %+v", rows)
            }

            if err := UpdateServiceScanRuntime(
              due.Mac,
              "2026-09-18 12:00:00",
              "2026-09-18 11:00:00",
              "2 of 4 probes indeterminate",
              false,
            ); err != nil {
              t.Fatalf("UpdateServiceScanRuntime failure: %v", err)
            }

            stored, found, err := SelectServiceScanSettingsByMAC(due.Mac)
            if err != nil || !found {
              t.Fatalf("Select after failure found=%v err=%v", found, err)
            }
            if stored.LastAttemptAt != "2026-09-18 11:00:00" || stored.LastSuccessfulAt != "" || stored.LastError == "" || stored.NextScanAt != "2026-09-18 12:00:00" {
              t.Fatalf("failure runtime = %+v", stored)
            }

            if err := UpdateServiceScanRuntime(
              due.Mac,
              "2026-09-18 13:00:00",
              "2026-09-18 12:00:00",
              "",
              true,
            ); err != nil {
              t.Fatalf("UpdateServiceScanRuntime success: %v", err)
            }
            stored, found, err = SelectServiceScanSettingsByMAC(due.Mac)
            if err != nil || !found {
              t.Fatalf("Select after success found=%v err=%v", found, err)
            }
            if stored.LastSuccessfulAt != "2026-09-18 12:00:00" || stored.LastError != "" || stored.NextScanAt != "2026-09-18 13:00:00" {
              t.Fatalf("success runtime = %+v", stored)
            }
          }
          EOF

          gofmt -w backend/internal/servicescan backend/internal/gdb/services.go backend/internal/gdb/services_test.go backend/internal/api/api-service-scan.go backend/internal/api/api_service_scan_test.go backend/internal/api/routes.go

      - name: Refresh Swagger docs
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Verify settings checkpoint
        working-directory: backend
        run: |
          go test ./internal/servicescan ./internal/gdb ./internal/api
          go vet ./internal/servicescan ./internal/gdb ./internal/api
          go build ./...

      - name: Commit settings checkpoint
