name: Phase 35 Refresh Generated State

on:
  push:
    branches:
      - phase35-device-profiles-proxmox

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase35-device-profiles-proxmox

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Format Phase 35 Go files
        run: |
          gofmt -w             backend/internal/models/device_profile*.go             backend/internal/gdb/device_profile*.go             backend/internal/gdb/start.go             backend/internal/gdb/start_test.go             backend/internal/gdb/edit.go             backend/internal/gdb/export.go             backend/internal/backup/backup.go             backend/internal/api/api-device-profile.go             backend/internal/api/api_device_profile*.go             backend/internal/api/api-export.go             backend/internal/api/api_export_test.go             backend/internal/api/routes.go

      - name: Refresh embedded frontend
        working-directory: frontend
        run: |
          npm ci
          make all

      - name: Refresh Swagger
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Test backend before committing generated state
        working-directory: backend
        run: go test ./...

      - name: Commit refreshed state
        run: |
          if git diff --quiet; then
            echo "No generated or formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal backend/docs
          git commit -m "phase35: refresh profile generated state"
          git push origin HEAD:phase35-device-profiles-proxmox
