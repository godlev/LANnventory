name: Phase35 UAT Hardening Prep

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase35-uat-hardening-prep-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prep:
    if: github.event.pull_request.head.ref == 'phase35-device-profiles-proxmox'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Phase 35 branch
        uses: actions/checkout@v4
        with:
          ref: phase35-device-profiles-proxmox
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format changed Go sources
        run: |
          gofmt -w \
            backend/internal/models/infrastructure_workload.go \
            backend/internal/models/infrastructure_workload_candidate_rejection.go \
            backend/internal/gdb/workload_candidate_rejections.go \
            backend/internal/gdb/workload_memberships.go \
            backend/internal/gdb/infrastructure_workloads.go \
            backend/internal/gdb/start.go \
            backend/internal/gdb/start_test.go \
            backend/internal/gdb/workload_matching_test.go \
            backend/internal/api/api-workload-matches.go \
            backend/internal/api/api-workload-memberships.go \
            backend/internal/api/api_workload_matches_test.go \
            backend/internal/api/api_infrastructure_workloads_test.go \
            backend/internal/api/routes.go \
            backend/internal/workloadmatch/match.go \
            backend/internal/workloadmatch/match_test.go

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend semantic regression
        working-directory: frontend
        run: npm run test:host-ux

      - name: Check mock API syntax
        run: node --check frontend/dev/mock-api.mjs

      - name: Build frontend and embedded bundle
        working-directory: frontend
        run: make all

      - name: Regenerate Swagger docs
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Verify patch semantics
        run: git diff --check

      - name: Commit generated artifacts
        run: |
          mkdir -p docs/uat
          cat > docs/uat/phase35-hardening-prep-status.md <<EOF
          # Phase 35A UAT hardening prep status

          Result: green
          Source PR: #${{ github.event.pull_request.number }}
          Source head before generated-artifact commit: ${{ github.event.pull_request.head.sha }}

          - gofmt: success
          - npm ci: success
          - Host UX semantic regression: success
          - Mock API syntax: success
          - Frontend build: success
          - Embedded bundle regenerated: success
          - Swagger regenerated: success
          - Backend tests: success
          - git diff --check: success
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/uat/phase35-hardening-prep-status.md \
            backend/internal/web/public backend/docs \
            backend/internal/models/infrastructure_workload.go \
            backend/internal/models/infrastructure_workload_candidate_rejection.go \
            backend/internal/gdb/workload_candidate_rejections.go \
            backend/internal/gdb/workload_memberships.go \
            backend/internal/gdb/infrastructure_workloads.go \
            backend/internal/gdb/start.go \
            backend/internal/gdb/start_test.go \
            backend/internal/gdb/workload_matching_test.go \
            backend/internal/api/api-workload-matches.go \
            backend/internal/api/api-workload-memberships.go \
            backend/internal/api/api_workload_matches_test.go \
            backend/internal/api/api_infrastructure_workloads_test.go \
            backend/internal/api/routes.go \
            backend/internal/workloadmatch/match.go \
            backend/internal/workloadmatch/match_test.go
          git rm .github/workflows/phase35-uat-hardening-prep.yml
          git commit -m "chore: refresh Phase 35A UAT hardening artifacts"
          git push origin HEAD:phase35-device-profiles-proxmox
