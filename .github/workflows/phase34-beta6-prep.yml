name: Phase34 beta6 release prep

on:
  push:
    branches:
      - release-v0.1.0-beta.6
    paths:
      - .github/workflows/phase34-beta6-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v0.1.0-beta.6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply final Phase 34 beta metadata
        env:
          RELEASE_VERSION: 0.1.0-beta.6
          RELEASE_TAG: v0.1.0-beta.6
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          tick = chr(96)

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one match for {old!r}, found {count}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "backend/internal/version/version.go",
              'var Version = "0.1.0-beta.3.1"',
              f'var Version = "{version}"',
          )

          main_path = Path("backend/cmd/LANnventory/main.go")
          main_text = main_path.read_text()
          main_text, count = re.subn(r'(?m)^// @version .+$', f'// @version {version}', main_text, count=1)
          if count != 1:
              raise SystemExit("Swagger @version marker not found")
          main_path.write_text(main_text)

          package_path = Path("frontend/package.json")
          package = json.loads(package_path.read_text())
          package["version"] = version
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          lock_path = Path("frontend/package-lock.json")
          lock = json.loads(lock_path.read_text())
          lock["version"] = version
          lock["packages"][""]["version"] = version
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          docker_path = Path("Dockerfile")
          docker_text = docker_path.read_text()
          docker_text, count = re.subn(r'(?m)^ARG LANNVENTORY_VERSION=.*$', f'ARG LANNVENTORY_VERSION={version}', docker_text, count=1)
          if count != 1:
              raise SystemExit("Docker version marker not found")
          docker_path.write_text(docker_text)

          prox_path = Path("proxmox/lannventory.sh")
          prox = prox_path.read_text()
          prox, count_tag = re.subn(r'(?m)^RELEASE_TAG="[^"]+"$', f'RELEASE_TAG="{tag}"', prox, count=1)
          prox, count_ver = re.subn(r'(?m)^VERSION="[^"]+"$', f'VERSION="{version}"', prox, count=1)
          if count_tag != 1 or count_ver != 1:
              raise SystemExit("Proxmox version markers not found")
          prox_path.write_text(prox)

          prox_test_path = Path("proxmox/lannventory_test.sh")
          prox_test = prox_test_path.read_text()
          prox_test, count = re.subn(
              r'expected_url="https://github\.com/godlev/LANnventory/releases/download/[^"]+"',
              f'expected_url="https://github.com/godlev/LANnventory/releases/download/{tag}/lannventory_{version}_linux_amd64.deb"',
              prox_test,
              count=1,
          )
          if count != 1:
              raise SystemExit("Proxmox expected URL not found")
          prox_test_path.write_text(prox_test)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme, count = re.subn(r'(?m)^Current beta release: .+$', f'Current beta release: {tick}{version}{tick}', readme, count=1)
          if count != 1:
              raise SystemExit("README beta marker not found")
          readme_path.write_text(readme)

          release_path = Path("docs/releases") / f"{tag}.md"
          release_path.parent.mkdir(parents=True, exist_ok=True)
          release_path.write_text(f"""# LANnventory {tag}
          
          ## Summary
          
          - Adds a persistent Services inventory per device address, protocol and port, with First Detected, Last Detected, Last Checked and current open/closed state.
          - Manual TCP port scans now persist definitive observations and emit service-opened/service-closed Events only on real state transitions.
          - Failed, timed-out, unreachable and cancelled probes remain indeterminate and never fabricate a service closure.
          - Adds opt-in per-device scheduled TCP service scanning with configurable ports/interval, bounded concurrency, cancellation safety and stale in-flight result protection.
          - Adds IPv4/IPv6-aware address attribution through the Phase 33 identity/address model and conservative common-port service hints.
          
          ## Upgrade and migration
          
          - Services and scheduled-scan settings use additive database migrations.
          - Existing WatchYourLAN/LANnventory data remains compatible; no destructive migration is introduced.
          - Existing updater backup, package install, restart, health verification and recovery behavior is unchanged.
          
          ## Validation
          
          - Updater-based UAT completed from v0.1.0-beta.5 using v0.1.0-beta.5.uat.1.
          - Phase 32 scanner/diagnostics and Phase 33 identity/address regression suites remain green.
          - Full test, race, vet, frontend, Docker/container and release-artifact validation passed before final Beta publication.
          """.replace("          ", ""))
          PY

          cat >> backend/internal/updater/updater_test.go <<'EOF'

          func TestPhase34FinalBetaReleaseSelection(t *testing.T) {
            releases := []release{
              {
                TagName:     "v0.1.0-beta.6",
                Prerelease:  true,
                Draft:       false,
                PublishedAt: "2026-09-18T00:00:00Z",
                HTMLURL:     "https://github.com/godlev/LANnventory/releases/tag/v0.1.0-beta.6",
              },
              {TagName: "v0.1.0-beta.5.uat.1", Prerelease: true, Draft: false},
              {TagName: "v0.1.0-beta.5", Prerelease: true, Draft: false},
            }

            for _, installed := range []string{"v0.1.0-beta.5", "v0.1.0-beta.5.uat.1"} {
              status, selected, ok := buildStatus(installed, BetaChannel, releases, time.Time{}, false)
              if !ok {
                t.Fatalf("Beta channel did not select a release for installed %s", installed)
              }
              if selected.TagName != "v0.1.0-beta.6" {
                t.Fatalf("installed %s selected %q, want v0.1.0-beta.6", installed, selected.TagName)
              }
              if !status.Available || status.LatestVersion != "0.1.0-beta.6" {
                t.Fatalf("installed %s status = %+v, want available beta.6", installed, status)
              }
            }

            stableStatus, selected, ok := buildStatus(
              "v0.1.0-beta.5.uat.1",
              StableChannel,
              releases,
              time.Time{},
              false,
            )
            if ok || selected.TagName != "" {
              t.Fatalf("Stable channel selected prerelease: selected=%+v ok=%v", selected, ok)
            }
            if stableStatus.Available || stableStatus.LatestVersion != "" {
              t.Fatalf("Stable status exposed beta.6 prerelease: %+v", stableStatus)
            }
          }
          EOF

          gofmt -w backend/internal/updater/updater_test.go backend/internal/version/version.go backend/cmd/LANnventory/main.go

      - name: Build frontend and refresh embedded bundle
        working-directory: frontend
        run: |
          npm ci
          make all

      - name: Refresh Swagger docs
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Validate final beta metadata and updater paths
        env:
          RELEASE_VERSION: 0.1.0-beta.6
          RELEASE_TAG: v0.1.0-beta.6
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          tick = chr(96)
          package = json.loads(Path("frontend/package.json").read_text())
          lock = json.loads(Path("frontend/package-lock.json").read_text())
          release_path = Path("docs/releases", f"{tag}.md")
          checks = {
              "backend fallback": version in Path("backend/internal/version/version.go").read_text(),
              "Swagger annotation": f"// @version {version}" in Path("backend/cmd/LANnventory/main.go").read_text(),
              "frontend package": package.get("version") == version,
              "frontend lock": lock.get("version") == version and lock.get("packages", {}).get("", {}).get("version") == version,
              "Docker default": f"ARG LANNVENTORY_VERSION={version}" in Path("Dockerfile").read_text(),
              "Proxmox tag": f'RELEASE_TAG="{tag}"' in Path("proxmox/lannventory.sh").read_text(),
              "Proxmox version": f'VERSION="{version}"' in Path("proxmox/lannventory.sh").read_text(),
              "README current beta": f"Current beta release: {tick}{version}{tick}" in Path("README.md").read_text(),
              "release summary": release_path.exists() and "## Summary" in release_path.read_text(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("final beta metadata mismatch: " + ", ".join(failed))
          print("Final beta metadata surfaces: PASS")
          PY

          cd backend
          go test ./internal/updater ./internal/version ./internal/api
          go test ./internal/version -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${RELEASE_VERSION}"
          go vet ./internal/updater ./internal/version ./internal/api
          go build -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${RELEASE_VERSION}" ./cmd/LANnventory
          cd ..

          bash -n proxmox/lannventory.sh
          bash proxmox/lannventory_test.sh

      - name: Commit final beta metadata
        env:
          RELEASE_TAG: v0.1.0-beta.6
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/internal/version/version.go \
            backend/internal/updater/updater_test.go \
            backend/cmd/LANnventory/main.go \
            backend/docs \
            backend/internal/web/public \
            frontend/package.json \
            frontend/package-lock.json \
            Dockerfile \
            proxmox/lannventory.sh \
            proxmox/lannventory_test.sh \
            README.md \
            "docs/releases/${RELEASE_TAG}.md"
          git diff --cached --check
          git commit -m "release: prepare v0.1.0-beta.6 Phase 34 beta"

      - name: Remove one-shot prep workflow and push clean release branch
        run: |
          set -euo pipefail
          git rm .github/workflows/phase34-beta6-prep.yml
          git commit -m "chore: remove one-shot Phase 34 beta6 prep workflow"
          git push origin HEAD:release-v0.1.0-beta.6
