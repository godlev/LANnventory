name: Phase34 services inventory UI

on:
  push:
    branches:
      - phase34-service-inventory
    paths:
      - .github/workflows/phase34-services-ui.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase34-service-inventory
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Add Services API and UI
        run: |
          cat > backend/internal/api/api-services.go <<'EOF'
          package api

          import (
            "net/http"

            "github.com/gin-gonic/gin"

            "github.com/godlev/LANnventory/internal/gdb"
            "github.com/godlev/LANnventory/internal/models"
          )

          // getHostServices godoc
          // @Summary      Get retained services for a host
          // @Description  Return durable service summary records for the host MAC across retained IPv4 and IPv6 addresses.
          // @Tags         hosts
          // @Produce      json
          // @Param        id   path      int  true  "Host ID"
          // @Success      200  {array}   models.Service
          // @Failure      400  {object}  map[string]string
          // @Failure      500  {object}  map[string]string
          // @Router       /host/{id}/services [get]
          func getHostServices(c *gin.Context) {
            host, err := getHostByID(c.Param("id"))
            if err != nil || host.ID < 1 {
              c.IndentedJSON(http.StatusBadRequest, gin.H{"error": errInvalidHostID.Error()})
              return
            }

            services, err := gdb.SelectServicesByMAC(host.Mac)
            if err != nil {
              c.IndentedJSON(http.StatusInternalServerError, gin.H{"error": "failed to load host services"})
              return
            }
            if services == nil {
              services = make([]models.Service, 0)
            }

            c.IndentedJSON(http.StatusOK, services)
          }
          EOF

          cat > backend/internal/api/api_services_test.go <<'EOF'
          package api

          import (
            "encoding/json"
            "net/http"
            "net/http/httptest"
            "strconv"
            "strings"
            "testing"

            "github.com/godlev/LANnventory/internal/gdb"
            "github.com/godlev/LANnventory/internal/models"
          )

          func TestHostServicesEndpointReturnsRetainedServicesAcrossAddresses(t *testing.T) {
            router := setupTestRouter(t)
            host := seedHost(t, models.Host{
              Name:  "nas",
              IP:    "192.168.1.50",
              Mac:   "AA:BB:CC:DD:EE:A0",
              Iface: "eth0",
              Known: 1,
              Now:   1,
            })
            otherHost := seedHost(t, models.Host{
              Name:  "other",
              IP:    "192.168.1.60",
              Mac:   "AA:BB:CC:DD:EE:A1",
              Iface: "eth0",
              Known: 1,
              Now:   1,
            })

            observations := []models.Service{
              {
                Mac:            host.Mac,
                Address:        host.IP,
                Protocol:       "tcp",
                Port:           443,
                State:          "open",
                FirstDetected:  "2026-09-18 09:00:00",
                LastDetected:   "2026-09-18 10:00:00",
                LastChecked:    "2026-09-18 10:00:00",
                StateChangedAt: "2026-09-18 09:00:00",
                LastScanSource: "manual",
              },
              {
                Mac:            host.Mac,
                Address:        "fd00::50",
                Protocol:       "tcp",
                Port:           22,
                State:          "closed",
                FirstDetected:  "2026-09-17 09:00:00",
                LastDetected:   "2026-09-17 09:00:00",
                LastChecked:    "2026-09-18 10:05:00",
                StateChangedAt: "2026-09-18 10:05:00",
                LastScanSource: "manual",
              },
              {
                Mac:            otherHost.Mac,
                Address:        otherHost.IP,
                Protocol:       "tcp",
                Port:           8080,
                State:          "open",
                FirstDetected:  "2026-09-18 08:00:00",
                LastDetected:   "2026-09-18 08:00:00",
                LastChecked:    "2026-09-18 08:00:00",
                StateChangedAt: "2026-09-18 08:00:00",
                LastScanSource: "manual",
              },
            }
            for _, service := range observations {
              if _, err := gdb.UpsertService(service); err != nil {
                t.Fatalf("UpsertService(%+v): %v", service, err)
              }
            }

            req := httptest.NewRequest(http.MethodGet, "/api/host/"+strconv.Itoa(host.ID)+"/services", nil)
            rec := httptest.NewRecorder()
            router.ServeHTTP(rec, req)

            if rec.Code != http.StatusOK {
              t.Fatalf("status = %d, want %d; body: %s", rec.Code, http.StatusOK, rec.Body.String())
            }

            var services []models.Service
            if err := json.Unmarshal(rec.Body.Bytes(), &services); err != nil {
              t.Fatalf("json.Unmarshal: %v", err)
            }
            if len(services) != 2 {
              t.Fatalf("services len = %d, want 2: %+v", len(services), services)
            }

            byPort := make(map[int]models.Service, len(services))
            for _, service := range services {
              byPort[service.Port] = service
              if service.Mac != host.Mac {
                t.Fatalf("unexpected service for another MAC: %+v", service)
              }
            }

            httpsService, ok := byPort[443]
            if !ok || httpsService.State != "open" || httpsService.Address != host.IP || httpsService.AddressFamily != "ipv4" {
              t.Fatalf("HTTPS service = %+v", httpsService)
            }
            sshService, ok := byPort[22]
            if !ok || sshService.State != "closed" || sshService.Address != "fd00::50" || sshService.AddressFamily != "ipv6" {
              t.Fatalf("SSH service = %+v", sshService)
            }
          }

          func TestHostServicesEndpointReturnsEmptyArray(t *testing.T) {
            router := setupTestRouter(t)
            host := seedHost(t, models.Host{
              Name:  "empty",
              IP:    "192.168.1.70",
              Mac:   "AA:BB:CC:DD:EE:A2",
              Iface: "eth0",
              Known: 1,
              Now:   1,
            })

            req := httptest.NewRequest(http.MethodGet, "/api/host/"+strconv.Itoa(host.ID)+"/services", nil)
            rec := httptest.NewRecorder()
            router.ServeHTTP(rec, req)

            if rec.Code != http.StatusOK {
              t.Fatalf("status = %d, want %d; body: %s", rec.Code, http.StatusOK, rec.Body.String())
            }
            if strings.TrimSpace(rec.Body.String()) != "[]" {
              t.Fatalf("body = %q, want []", rec.Body.String())
            }
          }
          EOF

          cat > frontend/src/components/HostPage/ServicesCard.tsx <<'EOF'
          import { createEffect, createMemo, createSignal, For, onCleanup, Show } from "solid-js";

          import { apiGetHostServices } from "../../functions/api";
          import { formatLastSeen } from "../../functions/dateFormat";
          import type { Host, Service } from "../../functions/exports";

          type ServicesCardProps = {
            host: Host;
            refreshKey?: number;
          };

          function ServicesCard(props: ServicesCardProps) {
            const [services, setServices] = createSignal<Service[]>([]);
            const [loading, setLoading] = createSignal(false);
            const [loadError, setLoadError] = createSignal("");
            let requestID = 0;

            createEffect(() => {
              const id = props.host.ID;
              void props.refreshKey;

              if (id < 1) {
                requestID++;
                setServices([]);
                setLoadError("");
                setLoading(false);
                return;
              }

              const activeRequest = ++requestID;
              setLoading(true);
              setLoadError("");

              apiGetHostServices(id)
                .then((result) => {
                  if (activeRequest !== requestID) {
                    return;
                  }
                  setServices(result);
                })
                .catch(() => {
                  if (activeRequest !== requestID) {
                    return;
                  }
                  setServices([]);
                  setLoadError("Service inventory could not be loaded.");
                })
                .finally(() => {
                  if (activeRequest === requestID) {
                    setLoading(false);
                  }
                });
            });

            onCleanup(() => {
              requestID++;
            });

            const sortedServices = createMemo(() =>
              [...services()].sort((left, right) => {
                if (left.state !== right.state) {
                  return left.state === "open" ? -1 : 1;
                }
                const addressOrder = left.address.localeCompare(right.address);
                if (addressOrder !== 0) {
                  return addressOrder;
                }
                const protocolOrder = left.protocol.localeCompare(right.protocol);
                return protocolOrder !== 0 ? protocolOrder : left.port - right.port;
              }),
            );
            const openCount = createMemo(() => services().filter((service) => service.state === "open").length);

            return (
              <section class="card wyl-panel host-panel" aria-labelledby="host-services-title">
                <div class="card-header host-panel-header">
                  <div>
                    <div id="host-services-title" class="host-panel-title">Services</div>
                    <div class="host-panel-subtitle">
                      Retained TCP service state is tracked per exact device address.
                    </div>
                  </div>
                  <Show when={services().length > 0}>
                    <span class="host-detail-section-badge">
                      {openCount()} open · {services().length} retained
                    </span>
                  </Show>
                </div>

                <div class="card-body">
                  <Show when={!loading()} fallback={<div class="device-cell-muted">Loading services…</div>}>
                    <Show when={!loadError()} fallback={<div class="host-inline-error" role="alert">{loadError()}</div>}>
                      <Show
                        when={sortedServices().length > 0}
                        fallback={
                          <div class="device-cell-muted">
                            No services have been observed yet. Run a port scan to start building service inventory.
                          </div>
                        }
                      >
                        <div class="table-responsive">
                          <table class="table table-sm align-middle mb-0">
                            <thead>
                              <tr>
                                <th scope="col">Service</th>
                                <th scope="col">State</th>
                                <th scope="col">Address</th>
                                <th scope="col">First detected</th>
                                <th scope="col">Last detected</th>
                                <th scope="col">Last checked</th>
                                <th scope="col">Source</th>
                              </tr>
                            </thead>
                            <tbody>
                              <For each={sortedServices()}>{(service) =>
                                <tr>
                                  <td>
                                    <div class="fw-semibold">{serviceLabel(service)}</div>
                                    <Show when={service.serviceHint}>
                                      <div class="small device-cell-muted">{service.serviceHint}</div>
                                    </Show>
                                  </td>
                                  <td>
                                    <span class={service.state === "open" ? "badge text-bg-success" : "badge text-bg-secondary"}>
                                      {service.state === "open" ? "Open" : "Closed"}
                                    </span>
                                  </td>
                                  <td>
                                    <div class="font-monospace text-break">{service.address}</div>
                                    <div class="small device-cell-muted">{service.addressFamily.toUpperCase()}</div>
                                  </td>
                                  <td>{formatServiceTime(service.firstDetected)}</td>
                                  <td>{formatServiceTime(service.lastDetected)}</td>
                                  <td>{formatServiceTime(service.lastChecked)}</td>
                                  <td>{scanSourceLabel(service.lastScanSource)}</td>
                                </tr>
                              }</For>
                            </tbody>
                          </table>
                        </div>
                      </Show>
                    </Show>
                  </Show>
                </div>
              </section>
            );
          }

          function serviceLabel(service: Service) {
            return service.protocol.toUpperCase() + "/" + service.port;
          }

          function formatServiceTime(value: string) {
            return value ? formatLastSeen(value) : "—";
          }

          function scanSourceLabel(value: string) {
            switch (value) {
              case "manual":
                return "Manual scan";
              case "scheduled":
                return "Scheduled scan";
              default:
                return value || "Unknown";
            }
          }

          export default ServicesCard;
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one exact match, found {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'backend/internal/api/routes.go',
              '''\t\tr0.GET("/host/:id/activity", getHostActivity)\n\t\tr0.GET("/host/:id/identity", getHostIdentity)''',
              '''\t\tr0.GET("/host/:id/activity", getHostActivity)\n\t\tr0.GET("/host/:id/services", getHostServices)\n\t\tr0.GET("/host/:id/identity", getHostIdentity)''',
          )

          replace_once(
              'frontend/src/functions/exports.ts',
              '''export interface HostEvent {''',
              '''export interface Service {\n\tid: number;\n\tmac: string;\n\taddress: string;\n\taddressFamily: string;\n\tprotocol: string;\n\tport: number;\n\tstate: "open" | "closed";\n\tfirstDetected: string;\n\tlastDetected: string;\n\tlastChecked: string;\n\tstateChangedAt: string;\n\tserviceHint: string;\n\tlastScanSource: string;\n};\n\nexport interface HostEvent {''',
          )

          replace_once(
              'frontend/src/functions/api.ts',
              '''import type { ActivityDeviceOption, ActivityStats, Conf, Host, HostEvent } from "./exports";''',
              '''import type { ActivityDeviceOption, ActivityStats, Conf, Host, HostEvent, Service } from "./exports";''',
          )
          replace_once(
              'frontend/src/functions/api.ts',
              '''export const apiGetHost = async (id:string) => {\n\n  const url = apiPath+'/api/host/'+id;\n  const res = await apiJSON<Host>(url);\n\n  return res;\n};\n\nexport const apiGetHostIdentity''',
              '''export const apiGetHost = async (id:string) => {\n\n  const url = apiPath+'/api/host/'+id;\n  const res = await apiJSON<Host>(url);\n\n  return res;\n};\n\nexport const apiGetHostServices = async (id: number | string): Promise<Service[]> => {\n  const url = apiPath+'/api/host/'+encodeURIComponent(String(id))+'/services';\n  return await apiJSON<Service[]>(url);\n};\n\nexport const apiGetHostIdentity''',
          )

          replace_once(
              'frontend/src/components/HostPage/Ping.tsx',
              '''type PingProps = {\n  host: Host;\n};''',
              '''type PingProps = {\n  host: Host;\n  onScanComplete?: () => void;\n};''',
          )
          replace_once(
              'frontend/src/components/HostPage/Ping.tsx',
              '''    } finally {\n      setIsRunning(false);\n    }''',
              '''    } finally {\n      setIsRunning(false);\n      props.onScanComplete?.();\n    }''',
          )

          replace_once(
              'frontend/src/pages/HostPage.tsx',
              '''import Ping from "../components/HostPage/Ping";\nimport HostActivityCard from "../components/HostPage/HostActivityCard";''',
              '''import Ping from "../components/HostPage/Ping";\nimport ServicesCard from "../components/HostPage/ServicesCard";\nimport HostActivityCard from "../components/HostPage/HostActivityCard";''',
          )
          replace_once(
              'frontend/src/pages/HostPage.tsx',
              '''  const [hasUnsavedHostChanges, setHasUnsavedHostChanges] = createSignal(false);\n  const params = useParams();''',
              '''  const [hasUnsavedHostChanges, setHasUnsavedHostChanges] = createSignal(false);\n  const [serviceRefreshKey, setServiceRefreshKey] = createSignal(0);\n  const params = useParams();''',
          )
          replace_once(
              'frontend/src/pages/HostPage.tsx',
              '''          <Ping host={currentHost()}></Ping>''',
              '''          <Ping\n            host={currentHost()}\n            onScanComplete={() => setServiceRefreshKey((value) => value + 1)}\n          ></Ping>''',
          )
          replace_once(
              'frontend/src/pages/HostPage.tsx',
              '''      <div class="row g-3 mx-0 mt-1 host-page-row">\n        <div class="col-md">\n          <IdentityCard host={currentHost()}></IdentityCard>\n        </div>\n      </div>''',
              '''      <div class="row g-3 mx-0 mt-1 host-page-row">\n        <div class="col-md">\n          <ServicesCard host={currentHost()} refreshKey={serviceRefreshKey()}></ServicesCard>\n        </div>\n      </div>\n      <div class="row g-3 mx-0 mt-1 host-page-row">\n        <div class="col-md">\n          <IdentityCard host={currentHost()}></IdentityCard>\n        </div>\n      </div>''',
          )
          PY

          gofmt -w backend/internal/api/api-services.go backend/internal/api/api_services_test.go backend/internal/api/routes.go

      - name: Build frontend and refresh embedded bundle
        working-directory: frontend
        run: |
          npm ci
          make all

      - name: Refresh Swagger docs
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Verify Services checkpoint
        run: |
          cd backend
          go test ./internal/api ./internal/gdb ./internal/models ./internal/portscan
          go vet ./internal/api ./internal/gdb ./internal/models ./internal/portscan
          go build ./...

      - name: Commit Services checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/internal/api/api-services.go backend/internal/api/api_services_test.go backend/internal/api/routes.go backend/docs backend/internal/web/public frontend/src/functions/exports.ts frontend/src/functions/api.ts frontend/src/components/HostPage/Ping.tsx frontend/src/components/HostPage/ServicesCard.tsx frontend/src/pages/HostPage.tsx
          git diff --cached --check
          git commit -m 'phase34: add host services inventory UI'
          git push origin HEAD:phase34-service-inventory
