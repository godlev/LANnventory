name: Phase 33A Hardening Sync

on:
  push:
    branches:
      - phase-33-device-identity
    paths:
      - .github/workflows/phase33a-hardening-sync.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-33-device-identity

      - name: Apply hardening patch
        run: python3 .github/scripts/phase33a-hardening.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Format and run targeted regressions
        working-directory: backend
        run: |
          gofmt -w internal/routines/scan-routine.go internal/routines/identity_compatibility.go internal/routines/identity_hardening_test.go internal/gdb/identity_delete_hardening_test.go
          go test ./internal/routines ./internal/gdb
          go test -race ./internal/routines ./internal/gdb

      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/routines/scan-routine.go backend/internal/routines/identity_compatibility.go backend/internal/routines/identity_hardening_test.go backend/internal/gdb/identity_delete_hardening_test.go
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Phase 33A: harden multi-IP identity compatibility"
          git push origin HEAD:phase-33-device-identity
