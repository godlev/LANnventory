name: Phase35 publish UAT1

on:
  push:
    branches:
      - phase35-device-profiles-proxmox
    paths:
      - .github/workflows/phase35-publish-uat1.yml

permissions:
  contents: write

jobs:
  publish-tag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase35-device-profiles-proxmox
          fetch-depth: 0

      - name: Tag validated Phase 35 UAT source
        env:
          UAT_TAG: v0.1.0-beta.6.uat.1
          UAT_SHA: bb24665bd72db394c8025e08d631f21138b88923
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${UAT_TAG}" >/dev/null; then
            echo "Tag ${UAT_TAG} already exists; refusing to move it."
            exit 1
          fi
          actual="$(git rev-parse "${UAT_SHA}^{commit}")"
          test "$actual" = "${UAT_SHA}"
          test "$(git show "${UAT_SHA}:backend/internal/version/version.go" | grep -c 'var Version = "0.1.0-beta.6.uat.1"')" = "1"
          test "$(git show "${UAT_SHA}:docs/releases/v0.1.0-beta.6.uat.1.md" | grep -c '^# LANnventory v0.1.0-beta.6.uat.1$')" = "1"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${UAT_TAG}" "${UAT_SHA}" -m "LANnventory ${UAT_TAG}"
          git push origin "refs/tags/${UAT_TAG}"
