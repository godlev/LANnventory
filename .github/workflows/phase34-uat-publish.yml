name: Phase34 UAT Release Artifact

on:
  push:
    branches:
      - release-phase34-uat
    paths:
      - .github/workflows/phase34-uat-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      UAT_VERSION: 0.1.0-beta.5.uat.1
      UAT_TAG: v0.1.0-beta.5.uat.1
      TARGET_SHA: 24743373782c9b792f2c010e436f366dcb0a2d0a
    steps:
      - name: Checkout validated UAT commit
        uses: actions/checkout@v4
        with:
          ref: 24743373782c9b792f2c010e436f366dcb0a2d0a
          fetch-depth: 0

      - name: Ensure UAT tag and release do not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${UAT_TAG}" >/dev/null 2>&1; then
            echo "Remote tag ${UAT_TAG} already exists"
            exit 1
          fi
          if gh release view "${UAT_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub release ${UAT_TAG} already exists"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git tag -a "${UAT_TAG}" "${TARGET_SHA}" -m "Phase 34 UAT ${UAT_TAG}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build embedded frontend
        working-directory: frontend
        run: |
          npm ci
          make all
          git diff --exit-code -- ../backend/internal/web/public

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build exact release artifacts without publishing
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --skip=publish
          workdir: backend

      - name: Validate exact Debian package, checksum and runtime API version
        run: |
          set -euo pipefail
          cd backend/dist

          deb="lannventory_${UAT_VERSION}_linux_amd64.deb"
          test -f "$deb"
          test -f checksums.txt

          package_version="$(dpkg-deb -f "$deb" Version)"
          package_arch="$(dpkg-deb -f "$deb" Architecture)"
          printf 'Package: %s\\nVersion: %s\\nArchitecture: %s\\n' "$deb" "$package_version" "$package_arch"
          test "$package_version" = "${UAT_VERSION}"
          test "$package_arch" = "amd64"

          checksum_line="$(grep -E "^[0-9a-fA-F]{64}[[:space:]]+[*]?${deb}$" checksums.txt)"
          test -n "$checksum_line"
          expected_hash="$(printf '%s\\n' "$checksum_line" | awk '{print $1}')"
          actual_hash="$(sha256sum "$deb" | awk '{print $1}')"
          printf 'Expected SHA256: %s\\nActual SHA256:   %s\\n' "$expected_hash" "$actual_hash"
          test "$expected_hash" = "$actual_hash"

          extract_dir="$(mktemp -d)"
          runtime_dir="$(mktemp -d)"
          dpkg-deb -x "$deb" "$extract_dir"
          test -x "$extract_dir/usr/bin/lannventory"

          cat > "$runtime_dir/config_v2.yaml" <<'EOF'
          HOST: "127.0.0.1"
          PORT: "18840"
          IFACES: ""
          UPDATE_CHANNEL: "beta"
          UPDATE_CHECK_AUTO: false
          UPDATE_AUTO: false
          EOF

          cleanup() {
            if [ -n "${app_pid:-}" ]; then
              kill "${app_pid}" >/dev/null 2>&1 || true
              wait "${app_pid}" >/dev/null 2>&1 || true
            fi
            rm -rf "$extract_dir" "$runtime_dir"
          }
          trap cleanup EXIT

          "$extract_dir/usr/bin/lannventory" -d "$runtime_dir" >"$runtime_dir/lannventory.log" 2>&1 &
          app_pid=$!

          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18840/api/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            if ! kill -0 "$app_pid" >/dev/null 2>&1; then
              cat "$runtime_dir/lannventory.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            cat "$runtime_dir/lannventory.log"
            exit 1
          fi

          version_json="$(curl -fsS http://127.0.0.1:18840/api/version)"
          printf '/api/version => %s\\n' "$version_json"
          python3 -c 'import json, os, sys; got=json.load(sys.stdin); want=os.environ["UAT_VERSION"]; assert got == want, (got, want)' <<< "$version_json"

          trap - EXIT
          cleanup
          cd ../..

      - name: Publish validated UAT prerelease and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            backend/dist/checksums.txt
            backend/dist/*.deb
            backend/dist/*.rpm
            backend/dist/*.apk
            backend/dist/*.tar.gz
          )
          test "${#assets[@]}" -gt 1
          gh release create "${UAT_TAG}" \
            --repo "${{ github.repository }}" \
            --target "${TARGET_SHA}" \
            --prerelease \
            --title "${UAT_TAG}" \
            --notes-file "docs/releases/${UAT_TAG}.md" \
            "${assets[@]}"

      - name: Verify published release metadata and required assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases/tags/${UAT_TAG}" > /tmp/release.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("/tmp/release.json").read_text())
          tag = os.environ["UAT_TAG"]
          version = os.environ["UAT_VERSION"]
          if release.get("tag_name") != tag:
              raise SystemExit(f"unexpected tag: {release.get('tag_name')}")
          if not release.get("prerelease") or release.get("draft"):
              raise SystemExit("UAT release is not a published prerelease")

          names = {asset["name"] for asset in release.get("assets", [])}
          required = {
              "checksums.txt",
              f"lannventory_{version}_linux_amd64.deb",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"missing required UAT assets: {sorted(missing)}")

          print("Published UAT release:", release["html_url"])
          print("Required assets present:", sorted(required))
          PY
