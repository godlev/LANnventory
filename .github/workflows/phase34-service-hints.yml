name: Phase34 service hints

on:
  push:
    branches:
      - phase34-service-inventory
    paths:
      - .github/workflows/phase34-service-hints.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase34-service-inventory
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Add conservative TCP service hints
        run: |
          cat > backend/internal/models/service_hint.go <<'EOF'
          package models

          var tcpServiceHints = map[int]string{
            20:    "FTP data",
            21:    "FTP",
            22:    "SSH",
            23:    "Telnet",
            25:    "SMTP",
            53:    "DNS",
            80:    "HTTP",
            110:   "POP3",
            111:   "rpcbind",
            135:   "Microsoft RPC",
            139:   "NetBIOS session",
            143:   "IMAP",
            389:   "LDAP",
            443:   "HTTPS",
            445:   "SMB",
            465:   "SMTPS",
            554:   "RTSP",
            587:   "SMTP submission",
            631:   "IPP",
            636:   "LDAPS",
            853:   "DNS over TLS",
            993:   "IMAPS",
            995:   "POP3S",
            1433:  "Microsoft SQL Server",
            1521:  "Oracle Database",
            1883:  "MQTT",
            2049:  "NFS",
            2375:  "Docker API",
            2376:  "Docker API TLS",
            3306:  "MySQL",
            3389:  "RDP",
            5432:  "PostgreSQL",
            5900:  "VNC",
            6379:  "Redis",
            8080:  "HTTP alternate",
            8443:  "HTTPS alternate",
            8883:  "MQTT TLS",
            27017: "MongoDB",
            32400: "Plex Media Server",
          }

          // ServiceHintForPort returns a conservative well-known-port label.
          // It is a hint only; LANnventory does not claim protocol fingerprinting.
          func ServiceHintForPort(protocol string, port int) string {
            if protocol != string(ServiceProtocolTCP) {
              return ""
            }
            return tcpServiceHints[port]
          }
          EOF

          cat > backend/internal/models/service_hint_test.go <<'EOF'
          package models

          import "testing"

          func TestServiceHintForPortIsConservativeAndProtocolSpecific(t *testing.T) {
            tests := []struct {
              protocol string
              port     int
              want     string
            }{
              {"tcp", 22, "SSH"},
              {"tcp", 443, "HTTPS"},
              {"tcp", 445, "SMB"},
              {"tcp", 32400, "Plex Media Server"},
              {"tcp", 65000, ""},
              {"udp", 53, ""},
            }

            for _, test := range tests {
              if got := ServiceHintForPort(test.protocol, test.port); got != test.want {
                t.Fatalf("ServiceHintForPort(%q, %d) = %q, want %q", test.protocol, test.port, got, test.want)
              }
            }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one exact match, found {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'backend/internal/gdb/services.go',
              '''\tservice.Protocol = protocol\n\tservice.State = state\n\tservice.ServiceHint = strings.TrimSpace(service.ServiceHint)\n\tservice.LastScanSource = strings.TrimSpace(service.LastScanSource)''',
              '''\tservice.Protocol = protocol\n\tservice.State = state\n\tservice.ServiceHint = strings.TrimSpace(service.ServiceHint)\n\tif service.ServiceHint == "" {\n\t\tservice.ServiceHint = models.ServiceHintForPort(protocol, service.Port)\n\t}\n\tservice.LastScanSource = strings.TrimSpace(service.LastScanSource)''',
          )

          replace_once(
              'backend/internal/gdb/start.go',
              '''\tif err := candidate.Table(serviceScanSettingsTable).AutoMigrate(&models.ServiceScanSettings{}); err != nil {\n\t\treturn err\n\t}\n\tif err := backfillHostLifecycle(candidate); err != nil {''',
              '''\tif err := candidate.Table(serviceScanSettingsTable).AutoMigrate(&models.ServiceScanSettings{}); err != nil {\n\t\treturn err\n\t}\n\tif err := backfillServiceHints(candidate); err != nil {\n\t\treturn err\n\t}\n\tif err := backfillHostLifecycle(candidate); err != nil {''',
          )

          replace_once(
              'backend/internal/gdb/services.go',
              '''func normalizeService(service models.Service) (models.Service, error) {''',
              '''func backfillServiceHints(activeDB *gorm.DB) error {\n\tvar services []models.Service\n\tif err := activeDB.Table(servicesTable).\n\t\tWhere("(\\\"SERVICE_HINT\\\" = ? OR \\\"SERVICE_HINT\\\" IS NULL)", "").\n\t\tFind(&services).Error; err != nil {\n\t\treturn err\n\t}\n\n\tfor _, service := range services {\n\t\thint := models.ServiceHintForPort(strings.ToLower(strings.TrimSpace(service.Protocol)), service.Port)\n\t\tif hint == "" {\n\t\t\tcontinue\n\t\t}\n\t\tif err := activeDB.Table(servicesTable).\n\t\t\tWhere("\\\"ID\\\" = ? AND (\\\"SERVICE_HINT\\\" = ? OR \\\"SERVICE_HINT\\\" IS NULL)", service.ID, "").\n\t\t\tUpdate("SERVICE_HINT", hint).Error; err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n\treturn nil\n}\n\nfunc normalizeService(service models.Service) (models.Service, error) {''',
          )

          replace_once(
              'frontend/src/components/HostPage/ServicesCard.tsx',
              '''<div class="small device-cell-muted">{service.serviceHint}</div>''',
              '''<div class="small device-cell-muted">Hint: {service.serviceHint}</div>''',
          )

          replace_once(
              'frontend/src/components/HostPage/ServicesCard.tsx',
              '''Retained TCP service state is tracked per exact device address.''',
              '''Retained TCP service state is tracked per exact device address. Service hints are port-based labels, not protocol fingerprinting.''',
          )
          PY

          cat > backend/internal/gdb/service_hints_test.go <<'EOF'
          package gdb

          import (
            "path/filepath"
            "testing"

            "github.com/godlev/LANnventory/internal/conf"
            "github.com/godlev/LANnventory/internal/models"
          )

          func TestServiceHintsPopulateNewObservationsAndBackfillEmptyRows(t *testing.T) {
            oldConfig := conf.GetAppConfig()
            conf.SetAppConfigForTest(models.Conf{
              UseDB:  "sqlite",
              DBPath: filepath.Join(t.TempDir(), "service-hints.db"),
            })
            t.Cleanup(func() {
              if err := Close(); err != nil {
                t.Errorf("Close: %v", err)
              }
              conf.SetAppConfigForTest(oldConfig)
            })

            if err := StartErr(); err != nil {
              t.Fatalf("StartErr: %v", err)
            }

            stored, _, _, err := RecordServiceObservation(models.Service{
              Mac:            "AA:BB:CC:DD:EE:E0",
              Address:        "192.168.1.100",
              Protocol:       "tcp",
              Port:           443,
              State:          "open",
              LastScanSource: "manual",
            }, "2026-09-18 12:00:00")
            if err != nil {
              t.Fatalf("RecordServiceObservation: %v", err)
            }
            if stored.ServiceHint != "HTTPS" {
              t.Fatalf("new observation hint = %q, want HTTPS", stored.ServiceHint)
            }

            legacy := models.Service{
              Mac:            "AA:BB:CC:DD:EE:E1",
              Address:        "192.168.1.101",
              AddressFamily:  "ipv4",
              Protocol:       "tcp",
              Port:           22,
              State:          "open",
              FirstDetected:  "2026-09-18 11:00:00",
              LastDetected:   "2026-09-18 11:00:00",
              LastChecked:    "2026-09-18 11:00:00",
              StateChangedAt: "2026-09-18 11:00:00",
              ServiceHint:    "",
              LastScanSource: "manual",
            }
            if err := db.Table(servicesTable).Create(&legacy).Error; err != nil {
              t.Fatalf("create legacy service: %v", err)
            }
            if err := backfillServiceHints(db); err != nil {
              t.Fatalf("backfillServiceHints: %v", err)
            }

            selected, found, err := SelectServiceByIdentity(legacy.Mac, legacy.Address, legacy.Protocol, legacy.Port)
            if err != nil || !found {
              t.Fatalf("SelectServiceByIdentity found=%v err=%v", found, err)
            }
            if selected.ServiceHint != "SSH" {
              t.Fatalf("backfilled hint = %q, want SSH", selected.ServiceHint)
            }

            custom := models.Service{
              Mac:            "AA:BB:CC:DD:EE:E2",
              Address:        "192.168.1.102",
              AddressFamily:  "ipv4",
              Protocol:       "tcp",
              Port:           443,
              State:          "open",
              FirstDetected:  "2026-09-18 11:00:00",
              LastDetected:   "2026-09-18 11:00:00",
              LastChecked:    "2026-09-18 11:00:00",
              StateChangedAt: "2026-09-18 11:00:00",
              ServiceHint:    "Custom gateway",
              LastScanSource: "manual",
            }
            if err := db.Table(servicesTable).Create(&custom).Error; err != nil {
              t.Fatalf("create custom service: %v", err)
            }
            if err := backfillServiceHints(db); err != nil {
              t.Fatalf("second backfillServiceHints: %v", err)
            }
            selected, found, err = SelectServiceByIdentity(custom.Mac, custom.Address, custom.Protocol, custom.Port)
            if err != nil || !found {
              t.Fatalf("Select custom found=%v err=%v", found, err)
            }
            if selected.ServiceHint != "Custom gateway" {
              t.Fatalf("custom hint overwritten: %q", selected.ServiceHint)
            }
          }
          EOF

          gofmt -w backend/internal/models/service_hint.go backend/internal/models/service_hint_test.go backend/internal/gdb/services.go backend/internal/gdb/start.go backend/internal/gdb/service_hints_test.go

      - name: Build frontend and refresh embedded bundle
        working-directory: frontend
        run: |
          npm ci
          make all

      - name: Verify hints checkpoint
        working-directory: backend
        run: |
          go test ./internal/models ./internal/gdb ./internal/api ./internal/routines ./internal/servicescan
          go test -race ./internal/gdb ./internal/routines
          go vet ./...
          go build ./...

      - name: Commit hints checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/internal/models/service_hint.go backend/internal/models/service_hint_test.go backend/internal/gdb/services.go backend/internal/gdb/start.go backend/internal/gdb/service_hints_test.go frontend/src/components/HostPage/ServicesCard.tsx backend/internal/web/public
          git diff --cached --check
          git commit -m 'phase34: add conservative service hints'
          git push origin HEAD:phase34-service-inventory
