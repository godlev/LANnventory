name: Publish Phase34 Host UX UAT2

on:
  push:
    branches:
      - release-phase34-host-ux-uat2
    paths:
      - .github/workflows/publish-phase34-host-ux-uat2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      UAT_TAG: v0.1.0-beta.5.uat.2
      TARGET_SHA: 2b6e847aef20e62754a8c8a188ed71762fcd3209
    steps:
      - name: Checkout exact validated UAT2 commit
        uses: actions/checkout@v4
        with:
          ref: 2b6e847aef20e62754a8c8a188ed71762fcd3209
          fetch-depth: 0

      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git status --porcelain)" = ""
          if git ls-remote --exit-code --tags origin "refs/tags/$UAT_TAG" >/dev/null 2>&1; then
            echo "Tag $UAT_TAG already exists"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify embedded frontend is current
        working-directory: frontend
        run: |
          npm ci
          npm run test:host-ux
          make all
          git diff --exit-code -- ../backend/internal/web/public

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify updater ordering before publish
        working-directory: backend
        run: |
          go test ./internal/updater ./internal/version ./internal/api
          go vet ./internal/updater ./internal/version ./internal/api

      - name: Create exact release tag
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$UAT_TAG" -m "LANnventory $UAT_TAG" "$TARGET_SHA"
          git push origin "refs/tags/$UAT_TAG"

      - name: Publish release artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
          workdir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply UAT release notes and verify assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$UAT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LANnventory $UAT_TAG" \
            --notes-file "docs/releases/$UAT_TAG.md" \
            --prerelease

          gh release view "$UAT_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,targetCommitish,assets > /tmp/release.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("/tmp/release.json").read_text())
          tag = os.environ["UAT_TAG"]
          if data.get("tagName") != tag:
              raise SystemExit(f"tagName={data.get('tagName')!r}, want {tag!r}")
          if not data.get("isPrerelease"):
              raise SystemExit("release is not marked prerelease")
          names = {item.get("name", "") for item in data.get("assets", [])}
          required = {
              "checksums.txt",
              "lannventory_0.1.0-beta.5.uat.2_linux_amd64.deb",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("missing release assets: " + ", ".join(missing))
          print("Published assets:", ", ".join(sorted(names)))
          PY
