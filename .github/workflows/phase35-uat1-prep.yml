name: Phase35 UAT1 prep

on:
  push:
    branches:
      - phase35-device-profiles-proxmox
    paths:
      - .github/workflows/phase35-uat1-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase35-device-profiles-proxmox
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply Phase 35 UAT1 version metadata and release summary
        env:
          UAT_VERSION: 0.1.0-beta.6.uat.1
          UAT_TAG: v0.1.0-beta.6.uat.1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["UAT_VERSION"]
          tag = os.environ["UAT_TAG"]
          previous = "0.1.0-beta.6"
          previous_tag = "v" + previous
          tick = chr(96)

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one match for {old!r}, found {count}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "backend/internal/version/version.go",
              f'var Version = "{previous}"',
              f'var Version = "{version}"',
          )

          main_path = Path("backend/cmd/LANnventory/main.go")
          main_text = main_path.read_text()
          main_text, count = re.subn(
              rf'(?m)^// @version {re.escape(previous)}$',
              f'// @version {version}',
              main_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("backend/cmd/LANnventory/main.go: expected beta.6 Swagger version once")
          main_path.write_text(main_text)

          package_path = Path("frontend/package.json")
          package = json.loads(package_path.read_text())
          if package.get("version") != previous:
              raise SystemExit(f"frontend/package.json: unexpected version {package.get('version')}")
          package["version"] = version
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          lock_path = Path("frontend/package-lock.json")
          lock = json.loads(lock_path.read_text())
          if lock.get("version") != previous or lock.get("packages", {}).get("", {}).get("version") != previous:
              raise SystemExit("frontend/package-lock.json: unexpected root version")
          lock["version"] = version
          lock["packages"][""]["version"] = version
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          replace_once("Dockerfile", f"ARG LANNVENTORY_VERSION={previous}", f"ARG LANNVENTORY_VERSION={version}")
          replace_once("proxmox/lannventory.sh", f'RELEASE_TAG="{previous_tag}"', f'RELEASE_TAG="{tag}"')
          replace_once("proxmox/lannventory.sh", f'VERSION="{previous}"', f'VERSION="{version}"')

          prox_test_path = Path("proxmox/lannventory_test.sh")
          prox_test = prox_test_path.read_text()
          old_url = f'https://github.com/godlev/LANnventory/releases/download/{previous_tag}/lannventory_{previous}_linux_amd64.deb'
          new_url = f'https://github.com/godlev/LANnventory/releases/download/{tag}/lannventory_{version}_linux_amd64.deb'
          if prox_test.count(old_url) != 1:
              raise SystemExit("proxmox/lannventory_test.sh: beta.6 package URL not found exactly once")
          prox_test_path.write_text(prox_test.replace(old_url, new_url, 1))

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          old_marker = f"Current beta release: {tick}{previous}{tick}"
          new_marker = f"Current beta release: {tick}{version}{tick}"
          if readme.count(old_marker) != 1:
              raise SystemExit("README.md: beta.6 marker not found exactly once")
          readme_path.write_text(readme.replace(old_marker, new_marker, 1))

          release_path = Path("docs/releases") / f"{tag}.md"
          release_path.parent.mkdir(parents=True, exist_ok=True)
          release_path.write_text(f"""# LANnventory {tag}

          ## Summary

          - Adds managed Device Profiles with typed Network, System, and Hypervisor capability data while keeping imported/discovered data separate from user-managed fields.
          - Models Proxmox VMs and LXC containers as infrastructure workloads instead of creating fake LANnventory Hosts.
          - Adds a read-only Proxmox collector that exports an allowlisted JSON snapshot without credentials, Internet transfer, raw configs, disks, tokens, keys, or guest data.
          - Adds strict snapshot validation plus Preview/Diff before any import can be applied; incomplete snapshots and manual/import conflicts are blocked safely.
          - Reconciles complete imports transactionally, retains retired workloads, and preserves manual data and manual workload links.
          - Adds workload-to-Host matching: a unique exact MAC can auto-link; address and name evidence remain explainable suggestions requiring user choice.
          - Adds a dedicated responsive Proxmox Host panel with source state, workload status, network identity, Host matches, and the collector Preview/Apply workflow.

          ## UAT focus

          Upgrade from {previous_tag} through Settings → Updates on the Beta channel. Verify:
          - the one-click updater installs {tag} and LANnventory returns healthy after restart;
          - a Server can be configured with the Proxmox VE hypervisor capability without becoming a separate Hypervisor device type;
          - managed Device Profile values remain separate from imported Proxmox values;
          - the read-only collector JSON can be pasted or uploaded and Preview shows Add / Update / Unchanged / Retire / Conflicts before Apply;
          - Apply requires confirmation and a valid preview, then shows node/source state and VM/LXC workloads;
          - exact-MAC workload matches link automatically only when deterministic;
          - address/name matches are suggestions only, ambiguous matches require a manual choice, and manual links are preserved;
          - existing Home, Host, Identity, Services, Events, Presence, scanner diagnostics, scheduled scans, and updater behavior remain intact.

          ## Release status

          Phase 35A UAT checkpoint. This release intentionally stops before Proxmox API credentials/automatic sync (Phase 35.8+). Do not merge Phase 35 to main until this UAT passes.

          Validated development branch source before UAT metadata: 890540431effc463c61a81a800ff161d1f65c4cf.
          """.replace("          ", ""))
          PY

          cat >> backend/internal/updater/updater_test.go <<'EOF'

          func TestPhase35UAT1SelectionFromBeta6(t *testing.T) {
            releases := []release{
              {
                TagName:     "v0.1.0-beta.6.uat.1",
                Prerelease:  true,
                Draft:       false,
                PublishedAt: "2026-09-19T00:00:00Z",
                HTMLURL:     "https://github.com/godlev/LANnventory/releases/tag/v0.1.0-beta.6.uat.1",
              },
              {
                TagName:    "v0.1.0-beta.6",
                Prerelease: true,
                Draft:      false,
              },
            }

            betaStatus, selected, ok := buildStatus(
              "v0.1.0-beta.6",
              BetaChannel,
              releases,
              time.Time{},
              false,
            )
            if !ok {
              t.Fatal("Beta channel did not select a release")
            }
            if selected.TagName != "v0.1.0-beta.6.uat.1" {
              t.Fatalf("Beta selected %q, want Phase 35 UAT1", selected.TagName)
            }
            if !betaStatus.Available || betaStatus.LatestVersion != "0.1.0-beta.6.uat.1" {
              t.Fatalf("Beta status = %+v, want available Phase 35 UAT1", betaStatus)
            }

            stableStatus, selected, ok := buildStatus(
              "v0.1.0-beta.6",
              StableChannel,
              releases,
              time.Time{},
              false,
            )
            if ok || selected.TagName != "" {
              t.Fatalf("Stable channel selected prerelease: selected=%+v ok=%v", selected, ok)
            }
            if stableStatus.Available || stableStatus.LatestVersion != "" {
              t.Fatalf("Stable status exposed Phase 35 UAT1 prerelease: %+v", stableStatus)
            }

            future := []release{
              {TagName: "v0.1.0-beta.7", Prerelease: true},
              {TagName: "v0.1.0-beta.6.uat.1", Prerelease: true},
              {TagName: "v0.1.0-beta.6", Prerelease: true},
            }
            next, ok := selectLatestRelease(future, BetaChannel)
            if !ok || next.TagName != "v0.1.0-beta.7" {
              t.Fatalf("future beta.7 should supersede Phase 35 UAT1, got %+v ok=%v", next, ok)
            }
          }
          EOF

          gofmt -w backend/internal/updater/updater_test.go backend/internal/version/version.go backend/cmd/LANnventory/main.go

      - name: Build frontend and refresh embedded bundle
        working-directory: frontend
        run: |
          npm ci
          npm run test:host-ux
          make all

      - name: Refresh Swagger docs
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Validate Phase 35 UAT1 version surfaces and updater ordering
        env:
          UAT_VERSION: 0.1.0-beta.6.uat.1
          UAT_TAG: v0.1.0-beta.6.uat.1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["UAT_VERSION"]
          tag = os.environ["UAT_TAG"]
          tick = chr(96)
          checks = {
              "backend fallback": f'var Version = "{version}"' in Path("backend/internal/version/version.go").read_text(),
              "Swagger annotation": f"// @version {version}" in Path("backend/cmd/LANnventory/main.go").read_text(),
              "Docker default": f"ARG LANNVENTORY_VERSION={version}" in Path("Dockerfile").read_text(),
              "Proxmox tag": f'RELEASE_TAG="{tag}"' in Path("proxmox/lannventory.sh").read_text(),
              "Proxmox version": f'VERSION="{version}"' in Path("proxmox/lannventory.sh").read_text(),
              "README current beta": f"Current beta release: {tick}{version}{tick}" in Path("README.md").read_text(),
              "release summary": Path("docs/releases", f"{tag}.md").exists(),
          }
          package = json.loads(Path("frontend/package.json").read_text())
          lock = json.loads(Path("frontend/package-lock.json").read_text())
          checks["frontend package"] = package.get("version") == version
          checks["frontend lock"] = lock.get("version") == version and lock.get("packages", {}).get("", {}).get("version") == version

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Phase 35 UAT1 version consistency failed: " + ", ".join(failed))
          print("Phase 35 UAT1 version surfaces are consistent:")
          for name in checks:
              print(" -", name)
          PY

          cd backend
          go test ./...
          go test ./internal/version -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}"
          go vet ./...
          go build -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}" ./cmd/LANnventory
          cd ..

          node --check frontend/dev/mock-api.mjs
          bash -n proxmox/lannventory.sh
          bash proxmox/lannventory_test.sh

      - name: Commit Phase 35 UAT1 metadata
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/internal/version/version.go \
            backend/internal/updater/updater_test.go \
            backend/cmd/LANnventory/main.go \
            backend/docs \
            backend/internal/web/public \
            frontend/package.json \
            frontend/package-lock.json \
            Dockerfile \
            proxmox/lannventory.sh \
            proxmox/lannventory_test.sh \
            README.md \
            docs/releases/v0.1.0-beta.6.uat.1.md
          git diff --cached --check
          git commit -m "phase35: prepare v0.1.0-beta.6.uat.1 UAT"
          git push origin HEAD:phase35-device-profiles-proxmox
