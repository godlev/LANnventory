name: Phase34 Host UX clarity correction

on:
  push:
    branches:
      - phase34-uat-host-ux
    paths:
      - .github/workflows/phase34-host-ux-clarity.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase34-uat-host-ux
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply Host UX clarity corrections
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one exact match, found {count}")
              path.write_text(text.replace(old, new, 1))

          for old, new in [
              ('<div class="host-field-label">IP</div>', '<div class="host-field-label">Current IP</div>'),
              ('<div class="host-field-label">MAC</div>', '<div class="host-field-label">Current MAC</div>'),
              ('<div class="host-field-label">Hardware</div>', '<div class="host-field-label">Vendor</div>'),
              ('<div class="host-field-label">First seen</div>', '<div class="host-field-label">This MAC first seen</div>'),
              ('<div class="host-field-label">Last seen</div>', '<div class="host-field-label">This MAC last seen</div>'),
          ]:
              replace_once('frontend/src/components/HostPage/HostCard.tsx', old, new)

          replace_once(
              'frontend/src/components/HostPage/IdentityCard.tsx',
              'import { formatLastSeen } from "../../functions/dateFormat";',
              'import { formatLastSeen } from "../../functions/dateFormat";\nimport ActionTooltip from "../ActionTooltip";',
          )
          replace_once(
              'frontend/src/components/HostPage/IdentityCard.tsx',
              '<div class="host-panel-title">Identity observations</div>',
              '<div class="host-panel-title">Network identity history</div>',
          )
          replace_once(
              'frontend/src/components/HostPage/IdentityCard.tsx',
              'Discovered network identity is read only and never overwrites managed inventory.',
              'Network observations only; managed Inventory stays unchanged. Shared IP history alone does not mean the same physical device.',
          )
          replace_once(
              'frontend/src/components/HostPage/IdentityCard.tsx',
              '<h6 class="mb-2">Addresses</h6>',
              '<h6 class="mb-2">Address history</h6>',
          )
          replace_once(
              'frontend/src/components/HostPage/IdentityCard.tsx',
              '<h6 class="mb-2">Data sources</h6>',
              '<h6 class="mb-1">How LANnventory identified this</h6>\n                <div class="small device-cell-muted mb-2">Scanner, Reverse DNS, mDNS and SSDP are discovery sources, not device properties.</div>',
          )

          identity_path = Path('frontend/src/components/HostPage/IdentityCard.tsx')
          identity = identity_path.read_text()
          pattern = re.compile(r'function AddressObservation\(props: \{ address: HostIdentityAddress; currentMac: string \}\) \{.*?\nfunction EvidenceObservation', re.S)
          replacement = r'''function AddressObservation(props: { address: HostIdentityAddress; currentMac: string }) {
            const otherMACs = createMemo(() => {
              const current = normalizeMAC(props.currentMac);
              return props.address.macHistory.filter((item) => normalizeMAC(item.mac) !== current);
            });

            return (
              <div class="border rounded p-2 mb-2">
                <div class="d-flex flex-wrap justify-content-between gap-2 align-items-center">
                  <span>
                    <span class="device-cell-muted">IP </span>
                    <span class="font-monospace">{props.address.address}</span>
                  </span>
                  <span class={props.address.active ? "badge text-bg-success" : "badge text-bg-secondary"}>
                    {props.address.active ? "Current" : "Previous"}
                  </span>
                </div>
                <div class="small device-cell-muted mt-1">
                  {props.address.family.toUpperCase()}
                  <Show when={props.address.iface}> · Scanner interface {props.address.iface}</Show>
                </div>
                <div class="small mt-1">
                  Address first seen {formatIdentityTime(props.address.firstSeen)} · Address last seen {formatIdentityTime(props.address.lastSeen)}
                </div>

                <Show when={otherMACs().length > 0}>
                  <div class="mt-2 small">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                      <strong>
                        This IP was also used by {otherMACs().length} other MAC{otherMACs().length === 1 ? "" : "s"}
                      </strong>
                      <ActionTooltip
                        title="IP reuse history"
                        detail="An IP address can be reused by different devices. This alone does not mean the MAC addresses belong to the same physical device."
                      >
                        <span
                          class="host-lifecycle-approx"
                          title="IP reuse history"
                          aria-label="IP reuse history explanation"
                          role="img"
                          tabIndex={0}
                        >
                          <i class="bi bi-info-circle" aria-hidden="true"></i>
                        </span>
                      </ActionTooltip>
                    </div>
                    <For each={otherMACs()}>{(observation) =>
                      <MACObservation address={props.address.address} observation={observation}></MACObservation>
                    }</For>
                  </div>
                </Show>
              </div>
            );
          }

          function MACObservation(props: { address: string; observation: AddressMACObservation }) {
            return (
              <div class="mt-1 d-flex flex-wrap gap-1 align-items-baseline">
                <span class="device-cell-muted">IP</span>
                <span class="font-monospace">{props.address}</span>
                <span class="device-cell-muted">· MAC</span>
                <span class="font-monospace">{props.observation.mac}</span>
                <span class="device-cell-muted">
                  · Observed {formatIdentityTime(props.observation.firstSeen)} → {formatIdentityTime(props.observation.lastSeen)}
                  {props.observation.active ? " · currently active on this IP" : ""}
                </span>
              </div>
            );
          }

          function EvidenceObservation'''
          identity, count = pattern.subn(replacement, identity, count=1)
          if count != 1:
              raise SystemExit(f"IdentityCard.tsx: AddressObservation block replacement count={count}")
          identity_path.write_text(identity)

          replace_once(
              'frontend/src/components/HostPage/CorrelationPanel.tsx',
              'Suggestions are evidence-based. Nothing is merged automatically; your decision only records the relationship.',
              'LANnventory uses correlation evidence to suggest same-device relationships. Shared IP history alone is not a same-device conclusion.',
          )
          replace_once(
              'frontend/src/components/HostPage/CorrelationPanel.tsx',
              'No same-device candidates or explicit decisions yet.',
              'No evidence currently suggests that another MAC belongs to this same physical device.',
          )

          package_path = Path('frontend/package.json')
          package = json.loads(package_path.read_text())
          package.setdefault('scripts', {})['test:host-ux'] = 'node dev/host-ux-regression.mjs'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          PY

          cat > frontend/src/components/HostPage/HostActivityCard.tsx <<'EOF'
          import { createEffect, createSignal, For, onCleanup, onMount, Show } from "solid-js";

          import { apiGetHostActivity } from "../../functions/api";
          import {
            activityDescription,
            activityIcon,
            activityTimeDateTime,
            activityTimeTitle,
            activityTone,
            relativeActivityTime,
          } from "../../functions/activity";
          import type { Host, HostEvent } from "../../functions/exports";

          type HostActivityCardProps = {
            host: Host;
          };

          const hostActivityLimit = 10;

          function HostActivityCard(props: HostActivityCardProps) {
            const [events, setEvents] = createSignal<HostEvent[]>([]);
            let requestId = 0;
            let refreshTimer = 0;

            const loadActivity = async (hostID: number) => {
              if (hostID < 1) {
                requestId++;
                setEvents([]);
                return;
              }

              const activeRequest = ++requestId;
              try {
                const nextEvents = await apiGetHostActivity(hostID, hostActivityLimit);
                if (activeRequest === requestId) {
                  setEvents(nextEvents);
                }
              } catch {
                if (activeRequest === requestId) {
                  setEvents([]);
                }
              }
            };

            createEffect(() => {
              void loadActivity(props.host.ID);
            });

            onMount(() => {
              refreshTimer = window.setInterval(() => {
                void loadActivity(props.host.ID);
              }, 60000);
            });

            onCleanup(() => {
              requestId++;
              window.clearInterval(refreshTimer);
            });

            return (
              <section class="card wyl-panel activity-panel host-activity-panel" aria-labelledby="host-activity-title">
                <div class="card-header activity-panel-header">
                  <div>
                    <div id="host-activity-title" class="activity-panel-title">Recent events</div>
                    <div class="activity-panel-subtitle">Historical event snapshots for this Host</div>
                  </div>
                </div>

                <div class="card-body activity-panel-body">
                  <Show
                    when={events().length > 0}
                    fallback={<div class="activity-empty">No recorded events yet</div>}
                  >
                    <div class="table-responsive host-event-table-wrap">
                      <table class="table table-sm align-middle mb-0 host-event-table">
                        <thead>
                          <tr>
                            <th scope="col">Event</th>
                            <th scope="col">IP</th>
                            <th scope="col">MAC</th>
                            <th scope="col">When</th>
                          </tr>
                        </thead>
                        <tbody>
                          <For each={events()}>{(event) =>
                            <tr class={"host-event-row activity-row-" + activityTone(event.EventType)}>
                              <td data-label="Event">
                                <span class="host-event-mobile-label">Event</span>
                                <span class="host-event-description">
                                  <span class="host-event-icon" aria-hidden="true">
                                    <i class={"bi " + activityIcon(event.EventType)}></i>
                                  </span>
                                  <span>{activityDescription(event)}</span>
                                </span>
                              </td>
                              <td data-label="IP">
                                <span class="host-event-mobile-label">IP</span>
                                <span class="font-monospace host-event-network-value">{event.IP || "—"}</span>
                              </td>
                              <td data-label="MAC">
                                <span class="host-event-mobile-label">MAC</span>
                                <span class="font-monospace host-event-network-value">{event.Mac || "—"}</span>
                              </td>
                              <td data-label="When">
                                <span class="host-event-mobile-label">When</span>
                                <time
                                  class="activity-time"
                                  dateTime={activityTimeDateTime(event)}
                                  title={activityTimeTitle(event)}
                                >
                                  {relativeActivityTime(event)}
                                </time>
                              </td>
                            </tr>
                          }</For>
                        </tbody>
                      </table>
                    </div>
                  </Show>
                </div>
              </section>
            );
          }

          export default HostActivityCard;
          EOF

          cat >> frontend/src/App.css <<'EOF'

          /* Host Recent Events: event snapshots belong to the historical event, not current Host state. */
          .host-event-table {
              table-layout: fixed;
              width: 100%;
          }
          .host-event-table th,
          .host-event-table td {
              padding: 0.5rem 0.75rem;
              vertical-align: middle;
          }
          .host-event-table th:nth-child(1) { width: 34%; }
          .host-event-table th:nth-child(2) { width: 20%; }
          .host-event-table th:nth-child(3) { width: 28%; }
          .host-event-table th:nth-child(4) { width: 18%; }
          .host-event-description {
              display: inline-flex;
              align-items: center;
              gap: 0.45rem;
              min-width: 0;
          }
          .host-event-icon {
              display: inline-flex;
              align-items: center;
              justify-content: center;
              flex: 0 0 auto;
              width: 1.75rem;
              height: 1.75rem;
              border: 1px solid var(--wyl-card-border);
              border-radius: 7px;
              background-color: var(--transparent-light);
          }
          .host-event-network-value {
              display: inline-block;
              max-width: 100%;
              overflow-wrap: anywhere;
          }
          .host-event-mobile-label {
              display: none;
          }

          @media (max-width: 575.98px) {
              .host-event-table-wrap { overflow-x: visible; }
              .host-event-table,
              .host-event-table tbody {
                  display: block;
                  width: 100%;
              }
              .host-event-table thead { display: none; }
              .host-event-table tr {
                  display: grid;
                  width: 100%;
                  padding: 0.45rem 0.7rem;
                  border-top: 1px solid var(--wyl-panel-border);
              }
              .host-event-table tbody tr:first-child { border-top: 0; }
              .host-event-table td {
                  display: grid;
                  grid-template-columns: 4rem minmax(0, 1fr);
                  gap: 0.5rem;
                  align-items: start;
                  width: 100%;
                  padding: 0.28rem 0;
                  border: 0;
              }
              .host-event-mobile-label {
                  display: inline;
                  color: var(--wyl-muted);
                  font-size: 0.72rem;
                  font-weight: 800;
                  text-transform: uppercase;
              }
              .host-event-description { align-items: flex-start; }
          }
          EOF

          cat > frontend/dev/host-ux-regression.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";

          const root = resolve(import.meta.dirname, "..");
          const read = (path) => readFileSync(resolve(root, path), "utf8");

          const identity = read("src/components/HostPage/IdentityCard.tsx");
          const correlation = read("src/components/HostPage/CorrelationPanel.tsx");
          const hostActivity = read("src/components/HostPage/HostActivityCard.tsx");
          const activityFeed = read("src/components/ActivityFeed.tsx");
          const hostCard = read("src/components/HostPage/HostCard.tsx");

          function requireText(source, value, message) {
            if (!source.includes(value)) {
              throw new Error(message + " Missing: " + value);
            }
          }

          function forbidText(source, value, message) {
            if (source.includes(value)) {
              throw new Error(message + " Unexpected: " + value);
            }
          }

          requireText(identity, "Network identity history", "Identity section title must clarify history.");
          requireText(identity, "This IP was also used by", "Shared IP wording must make the IP the grammatical subject.");
          requireText(
            identity,
            "An IP address can be reused by different devices. This alone does not mean the MAC addresses belong to the same physical device.",
            "IP reuse warning must remain explicit.",
          );
          requireText(identity, '<MACObservation address={props.address.address}', "Historical MAC rows must retain explicit address context.");
          forbidText(identity, "Also observed with", "Ambiguous shared-IP wording must not return.");

          requireText(correlation, "Possible same device", "Correlation section must remain separate.");
          requireText(correlation, "Shared IP history alone is not a same-device conclusion.", "Correlation must remain separate from address reuse.");
          requireText(
            correlation,
            "No evidence currently suggests that another MAC belongs to this same physical device.",
            "Empty correlation state must not imply hidden same-device evidence.",
          );

          requireText(hostActivity, '{event.IP || "—"}', "Host Recent Events must use historical event.IP.");
          requireText(hostActivity, '{event.Mac || "—"}', "Host Recent Events must use historical event.Mac.");
          requireText(hostActivity, '<th scope="col">Event</th>', "Host Recent Events must expose Event column.");
          requireText(hostActivity, '<th scope="col">IP</th>', "Host Recent Events must expose IP column.");
          requireText(hostActivity, '<th scope="col">MAC</th>', "Host Recent Events must expose MAC column.");
          requireText(hostActivity, '<th scope="col">When</th>', "Host Recent Events must expose When column.");
          forbidText(hostActivity, 'href={"/host/"', "Host Recent Events must not link back to the same Host page.");
          forbidText(hostActivity, "activityHostName", "Host Recent Events must not repeat the Host name.");

          requireText(activityFeed, '<A href={"/host/" + event.HostID}', "Global Activity Host links must remain available.");

          for (const label of [
            "Current IP",
            "Current MAC",
            "MAC type",
            "Interface",
            "Vendor",
            "This MAC first seen",
            "This MAC last seen",
          ]) {
            requireText(hostCard, ">" + label + "</div>", "Host Details label " + label + " must remain explicit.");
          }
          forbidText(hostCard, ">Hardware</div>", "ARP/OUI vendor text must not be labelled Hardware.");

          console.log("Host UX semantic regression checks passed.");
          EOF

          cat >> backend/internal/api/api_activity_test.go <<'EOF'

          func TestHostActivityEndpointPreservesHistoricalNetworkSnapshots(t *testing.T) {
            router := setupTestRouter(t)
            host := seedHost(t, models.Host{
              Name:  "Snapshot host",
              IP:    "10.4.1.115",
              Mac:   "FC:67:1F:26:20:A5",
              Iface: "eth0",
            })

            historical := models.NewHostEvent(host, models.EventOffline, "", "")
            historical.Date = "2026-09-05 18:32:00"
            historical.IP = "10.4.1.44"
            historical.Mac = "28:C2:1F:A6:1B:8F"
            if err := gdb.AddEvent(historical); err != nil {
              t.Fatalf("AddEvent: %v", err)
            }

            rec := getPath(router, "/api/host/"+itoa(host.ID)+"/activity")
            if rec.Code != http.StatusOK {
              t.Fatalf("status = %d, want %d; body: %s", rec.Code, http.StatusOK, rec.Body.String())
            }

            events := decodeActivityEvents(t, rec)
            if len(events) != 1 {
              t.Fatalf("events len = %d, want 1: %+v", len(events), events)
            }
            if events[0].IP != historical.IP {
              t.Fatalf("event IP = %q, want historical snapshot %q", events[0].IP, historical.IP)
            }
            if events[0].Mac != historical.Mac {
              t.Fatalf("event MAC = %q, want historical snapshot %q", events[0].Mac, historical.Mac)
            }
            if events[0].IP == host.IP || events[0].Mac == host.Mac {
              t.Fatalf("historical event was overwritten with current Host network identity: %+v", events[0])
            }
          }
          EOF

          gofmt -w backend/internal/api/api_activity_test.go

      - name: Run Host UX regression checks
        working-directory: frontend
        run: |
          npm ci
          npm run test:host-ux
          npm run build

      - name: Refresh embedded frontend
        working-directory: frontend
        run: make all

      - name: Run backend regression and full acceptance checks
        working-directory: backend
        run: |
          go test ./internal/api
          go test ./...
          go test -race ./...
          go vet ./...
          go build ./...

      - name: Commit Host UX correction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            frontend/src/components/HostPage/HostCard.tsx \
            frontend/src/components/HostPage/IdentityCard.tsx \
            frontend/src/components/HostPage/CorrelationPanel.tsx \
            frontend/src/components/HostPage/HostActivityCard.tsx \
            frontend/src/App.css \
            frontend/dev/host-ux-regression.mjs \
            frontend/package.json \
            frontend/package-lock.json \
            backend/internal/api/api_activity_test.go \
            backend/internal/web/public \
          git diff --cached --check
          git commit -m "phase34: clarify Host identity and event history UX"
          git push origin HEAD:phase34-uat-host-ux
