name: Phase 35 Matching Refresh

on:
  push:
    branches:
      - phase35-device-profiles-proxmox

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase35-device-profiles-proxmox

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format Phase 35 matching files
        run: |
          gofmt -w             backend/internal/workloadmatch/match.go             backend/internal/workloadmatch/match_test.go             backend/internal/gdb/workload_matching.go             backend/internal/gdb/workload_matching_test.go             backend/internal/gdb/proxmox_script_import.go             backend/internal/api/api-workload-matches.go             backend/internal/api/api_workload_matches_test.go             backend/internal/api/routes.go

      - name: Refresh canonical Swagger
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Commit refreshed state
        run: |
          if git diff --quiet; then
            echo "No formatting or generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal backend/docs
          git commit -m "phase35: refresh workload matching generated state"
          git push origin HEAD:phase35-device-profiles-proxmox
