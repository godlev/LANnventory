name: Phase 28.4 Final Checkpoint Package

on:
  push:
    branches:
      - checkpoint-phase-28-4-final

permissions:
  contents: read

jobs:
  build-checkpoint-deb:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: checkpoint-phase-28-4-final
          fetch-depth: 0

      - name: Verify Phase 28.4 embedded Host UI
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/internal/web/public/assets/HostPage.js
          grep -Fq 'Wake on LAN' backend/internal/web/public/assets/HostPage.js
          grep -Fq 'host-details-layout' backend/internal/web/public/assets/HostPage.js
          grep -Fq 'host-detail-section-inventory' backend/internal/web/public/assets/HostPage.js
          grep -Fq 'host-detail-section-discovery' backend/internal/web/public/assets/HostPage.js
          grep -Fq 'host-pin-icons' backend/internal/web/public/assets/HostPage.js
          grep -Fq 'wyl-tooltip-anchor' backend/internal/web/public/assets/HostPage.js
          grep -Fq '.wyl-tooltip' backend/internal/web/public/assets/index.css

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean
          workdir: backend

      - name: Stage amd64 Debian package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoint
          deb="$(find backend/dist -maxdepth 1 -type f -name '*amd64*.deb' | sort | head -n 1)"
          test -n "$deb"
          cp "$deb" checkpoint/lannventory-phase28-4-final-amd64.deb
          sha256sum checkpoint/lannventory-phase28-4-final-amd64.deb > checkpoint/SHA256SUMS.txt

      - name: Upload checkpoint package
        uses: actions/upload-artifact@v4
        with:
          name: lannventory-phase28-4-final-amd64
          path: checkpoint/*
          if-no-files-found: error
          retention-days: 14
