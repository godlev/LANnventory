name: Sync Phase 31 generated assets

on:
  push:
    branches:
      - phase-31-update-notify-release-notes

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-31-update-notify-release-notes

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Format Go
        run: |
          gofmt -w backend/internal/models/models.go
          gofmt -w backend/internal/conf/read.go backend/internal/conf/write.go backend/internal/conf/read_test.go
          gofmt -w backend/internal/updater/updater.go backend/internal/updater/updater_test.go backend/internal/updater/scheduler.go
          gofmt -w backend/internal/api/api-update.go backend/internal/api/api_update_test.go

      - name: Regenerate Swagger
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Rebuild embedded frontend
        working-directory: frontend
        run: |
          npm ci
          make all

      - name: Commit generated changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/docs backend/internal/web/public backend/internal/models/models.go backend/internal/conf/read.go backend/internal/conf/write.go backend/internal/conf/read_test.go backend/internal/updater/updater.go backend/internal/updater/updater_test.go backend/internal/updater/scheduler.go backend/internal/api/api-update.go backend/internal/api/api_update_test.go
          git commit -m "Format Phase 31 and regenerate generated assets"
          git push origin HEAD:phase-31-update-notify-release-notes
