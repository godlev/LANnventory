name: Phase 33A.9 Sync

on:
  push:
    branches:
      - phase-33-device-identity
    paths:
      - .github/workflows/phase33a9-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-33-device-identity

      - name: Wire MAC assessment into frontend contract and Host UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          exports = Path('frontend/src/functions/exports.ts')
          text = exports.read_text()
          text = text.replace(
              'import type { MACType } from "./macIdentity";',
              'import type { MACAssessmentCode, MACAssessmentConfidence, MACType } from "./macIdentity";',
              1,
          )
          old = '\tMacType: MACType;\n\tHw:    string;'
          new = '\tMacType: MACType;\n\tMacAssessment: MACAssessmentCode;\n\tMacAssessmentConfidence: MACAssessmentConfidence;\n\tMacAssessmentReason: string;\n\tHw:    string;'
          if old not in text:
              raise SystemExit('Host MAC contract pattern not found')
          text = text.replace(old, new, 1)
          old = '\tMacType: "invalid",\n\tHw:    "",'
          new = '\tMacType: "invalid",\n\tMacAssessment: "invalid",\n\tMacAssessmentConfidence: "none",\n\tMacAssessmentReason: "",\n\tHw:    "",'
          if old not in text:
              raise SystemExit('emptyHost MAC contract pattern not found')
          text = text.replace(old, new, 1)
          exports.write_text(text)

          card = Path('frontend/src/components/HostPage/HostCard.tsx')
          text = card.read_text()
          old = 'import { macTypeLabel } from "../../functions/macIdentity";'
          new = 'import { macAssessmentLabel, macConfidenceLabel, macTypeLabel } from "../../functions/macIdentity";'
          if old not in text:
              raise SystemExit('HostCard MAC import pattern not found')
          text = text.replace(old, new, 1)

          anchor = '''              <div class="host-field-label">Interface</div>\n              <div class="host-field-value">{_props.host.Iface || <span class="device-cell-muted">Unknown</span>}</div>\n'''
          assessment = '''              <Show when={_props.host.MacType === "locally-administered"}>\n                <div class="host-field-label">MAC assessment</div>\n                <div class="host-field-value">\n                  <span class="host-lifecycle-value">\n                    <span>{macAssessmentLabel(_props.host.MacAssessment)}</span>\n                    <Show when={macConfidenceLabel(_props.host.MacAssessmentConfidence)}>\n                      <span class="badge rounded-pill text-bg-secondary">\n                        {macConfidenceLabel(_props.host.MacAssessmentConfidence)}\n                      </span>\n                    </Show>\n                    <ActionTooltip\n                      title="MAC assessment"\n                      detail={_props.host.MacAssessmentReason || "A locally administered MAC does not by itself prove privacy randomization."}\n                    >\n                      <span\n                        class="host-lifecycle-approx"\n                        title="MAC assessment"\n                        aria-label={_props.host.MacAssessmentReason || "MAC assessment details"}\n                        role="img"\n                        tabIndex={0}\n                      >\n                        <i class="bi bi-info-circle" aria-hidden="true"></i>\n                      </span>\n                    </ActionTooltip>\n                  </span>\n                </div>\n              </Show>\n\n''' + anchor
          if anchor not in text:
              raise SystemExit('HostCard Interface anchor not found')
          text = text.replace(anchor, assessment, 1)
          card.write_text(text)
          PY

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          make all

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Format and test backend
        run: |
          gofmt -w backend/internal/identity/mac_assessment.go backend/internal/identity/mac_assessment_test.go backend/internal/models/host_json.go
          cd backend
          go test ./...

      - name: Commit synchronized sources and generated frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/functions/exports.ts frontend/src/components/HostPage/HostCard.tsx backend/internal/identity backend/internal/models/host_json.go backend/internal/web/public
          if git diff --cached --quiet; then
            echo "Nothing to synchronize"
            exit 0
          fi
          git commit -m "Phase 33A.9: surface conservative MAC assessment"
          git push origin HEAD:phase-33-device-identity
