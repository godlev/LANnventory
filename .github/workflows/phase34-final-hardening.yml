name: Phase34 final hardening

on:
  push:
    branches:
      - phase34-service-inventory
    paths:
      - .github/workflows/phase34-final-hardening.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase34-service-inventory
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Harden scheduler configuration races
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one exact match, found {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'backend/internal/gdb/services.go',
              '''func selectServiceByIdentity(activeDB *gorm.DB, mac, address, protocol string, port int) (service models.Service, ok bool, err error) {''',
              '''// UpdateServiceScanRuntimeIfCurrent updates scheduler-owned fields only when\n// the user-controlled configuration still matches the snapshot that was scanned.\n// A false updated result is a normal stale-run outcome, not an error.\nfunc UpdateServiceScanRuntimeIfCurrent(expected models.ServiceScanSettings, nextScanAt, lastAttemptAt, lastError string, successful bool) (bool, error) {\n\tcanonical, err := identity.NormalizeMAC(strings.TrimSpace(expected.Mac))\n\tif err != nil {\n\t\treturn false, errInvalidServiceIdentity\n\t}\n\tif !expected.Enabled {\n\t\treturn false, nil\n\t}\n\n\tupdates := map[string]any{\n\t\t"NEXT_SCAN_AT":    strings.TrimSpace(nextScanAt),\n\t\t"LAST_ATTEMPT_AT": strings.TrimSpace(lastAttemptAt),\n\t\t"LAST_ERROR":      strings.TrimSpace(lastError),\n\t}\n\tif successful {\n\t\tupdates["LAST_SUCCESSFUL_AT"] = strings.TrimSpace(lastAttemptAt)\n\t}\n\n\tactiveDB, release, err := acquireDB()\n\tif err != nil {\n\t\treturn false, err\n\t}\n\tdefer release()\n\n\tresult := activeDB.Table(serviceScanSettingsTable).\n\t\tWhere("\\\"MAC\\\" = ? AND \\\"ENABLED\\\" = ? AND \\\"INTERVAL_MINUTES\\\" = ? AND \\\"PORTS_JSON\\\" = ?",\n\t\t\tcanonical, true, expected.IntervalMinutes, strings.TrimSpace(expected.PortsJSON)).\n\t\tUpdates(updates)\n\tif result.Error != nil {\n\t\treturn false, result.Error\n\t}\n\treturn result.RowsAffected > 0, nil\n}\n\nfunc selectServiceByIdentity(activeDB *gorm.DB, mac, address, protocol string, port int) (service models.Service, ok bool, err error) {''',
          )

          replace_once(
              'backend/internal/routines/service-scan.go',
              '''func runScheduledServiceScan(ctx context.Context, settings models.ServiceScanSettings, now time.Time) {\n\tif ctx.Err() != nil {\n\t\treturn\n\t}\n\n\tattemptAt := now.Format(models.HostEventDateLayout)''',
              '''func runScheduledServiceScan(ctx context.Context, settings models.ServiceScanSettings, now time.Time) {\n\tif ctx.Err() != nil || !scheduledServiceScanSettingsCurrent(settings) {\n\t\treturn\n\t}\n\n\tattemptAt := now.Format(models.HostEventDateLayout)''',
          )

          replace_once(
              'backend/internal/routines/service-scan.go',
              '''\t\tresults := scheduledScanPorts(ctx, scheduledProbeTarget(address), ports, serviceScanWorkers)\n\t\teventHost := host''',
              '''\t\tresults := scheduledScanPorts(ctx, scheduledProbeTarget(address), ports, serviceScanWorkers)\n\t\tif ctx.Err() != nil || !scheduledServiceScanSettingsCurrent(settings) {\n\t\t\treturn\n\t\t}\n\n\t\teventHost := host''',
          )

          text = Path('backend/internal/routines/service-scan.go').read_text()
          text = text.replace(
              'updateScheduledServiceScanRuntime(settings.Mac, nextAt, attemptAt, ',
              'updateScheduledServiceScanRuntime(settings, nextAt, attemptAt, ',
          )
          if 'updateScheduledServiceScanRuntime(settings.Mac' in text:
              raise SystemExit('service-scan.go: not all runtime update calls were replaced')
          Path('backend/internal/routines/service-scan.go').write_text(text)

          replace_once(
              'backend/internal/routines/service-scan.go',
              '''func updateScheduledServiceScanRuntime(mac, nextAt, attemptAt, lastError string, successful bool) {\n\tif err := gdb.UpdateServiceScanRuntime(mac, nextAt, attemptAt, lastError, successful); err != nil {\n\t\tslog.Error("Failed to update scheduled service scan runtime", "mac", mac, "err", err)\n\t}\n}''',
              '''func scheduledServiceScanSettingsCurrent(expected models.ServiceScanSettings) bool {\n\tcurrent, found, err := gdb.SelectServiceScanSettingsByMAC(expected.Mac)\n\tif err != nil {\n\t\tslog.Error("Failed to verify scheduled service scan settings", "mac", expected.Mac, "err", err)\n\t\treturn false\n\t}\n\tif !found || !current.Enabled {\n\t\treturn false\n\t}\n\treturn current.IntervalMinutes == expected.IntervalMinutes &&\n\t\tstrings.TrimSpace(current.PortsJSON) == strings.TrimSpace(expected.PortsJSON)\n}\n\nfunc updateScheduledServiceScanRuntime(settings models.ServiceScanSettings, nextAt, attemptAt, lastError string, successful bool) {\n\tupdated, err := gdb.UpdateServiceScanRuntimeIfCurrent(settings, nextAt, attemptAt, lastError, successful)\n\tif err != nil {\n\t\tslog.Error("Failed to update scheduled service scan runtime", "mac", settings.Mac, "err", err)\n\t\treturn\n\t}\n\tif !updated {\n\t\tslog.Debug("Skipped stale scheduled service scan runtime update", "mac", settings.Mac)\n\t}\n}''',
          )
          PY

          cat > backend/internal/gdb/service_scan_runtime_hardening_test.go <<'EOF'
          package gdb

          import (
            "path/filepath"
            "testing"

            "github.com/godlev/LANnventory/internal/conf"
            "github.com/godlev/LANnventory/internal/models"
          )

          func TestUpdateServiceScanRuntimeIfCurrentRejectsStaleConfiguration(t *testing.T) {
            oldConfig := conf.GetAppConfig()
            conf.SetAppConfigForTest(models.Conf{
              UseDB:  "sqlite",
              DBPath: filepath.Join(t.TempDir(), "service-runtime-hardening.db"),
            })
            t.Cleanup(func() {
              if err := Close(); err != nil {
                t.Errorf("Close: %v", err)
              }
              conf.SetAppConfigForTest(oldConfig)
            })

            if err := StartErr(); err != nil {
              t.Fatalf("StartErr: %v", err)
            }

            expected, err := UpsertServiceScanSettings(models.ServiceScanSettings{
              Mac:             "AA:BB:CC:DD:EE:F0",
              Enabled:         true,
              IntervalMinutes: 60,
              PortsJSON:       "[22]",
              NextScanAt:      "2026-09-18 10:00:00",
            })
            if err != nil {
              t.Fatalf("Upsert expected settings: %v", err)
            }

            current, err := UpsertServiceScanSettings(models.ServiceScanSettings{
              Mac:             expected.Mac,
              Enabled:         true,
              IntervalMinutes: 120,
              PortsJSON:       "[443]",
              NextScanAt:      "2026-09-18 11:05:00",
            })
            if err != nil {
              t.Fatalf("Upsert changed settings: %v", err)
            }

            updated, err := UpdateServiceScanRuntimeIfCurrent(
              expected,
              "2026-09-18 12:00:00",
              "2026-09-18 11:00:00",
              "stale result",
              true,
            )
            if err != nil {
              t.Fatalf("UpdateServiceScanRuntimeIfCurrent stale: %v", err)
            }
            if updated {
              t.Fatal("stale runtime update unexpectedly matched changed configuration")
            }

            stored, found, err := SelectServiceScanSettingsByMAC(expected.Mac)
            if err != nil || !found {
              t.Fatalf("Select stale-protected settings found=%v err=%v", found, err)
            }
            if stored.IntervalMinutes != current.IntervalMinutes ||
              stored.PortsJSON != current.PortsJSON ||
              stored.NextScanAt != current.NextScanAt ||
              stored.LastAttemptAt != "" ||
              stored.LastSuccessfulAt != "" ||
              stored.LastError != "" {
              t.Fatalf("stale update changed current settings: %+v", stored)
            }

            updated, err = UpdateServiceScanRuntimeIfCurrent(
              current,
              "2026-09-18 13:05:00",
              "2026-09-18 11:05:00",
              "",
              true,
            )
            if err != nil {
              t.Fatalf("UpdateServiceScanRuntimeIfCurrent current: %v", err)
            }
            if !updated {
              t.Fatal("current runtime update did not match")
            }

            stored, found, err = SelectServiceScanSettingsByMAC(expected.Mac)
            if err != nil || !found {
              t.Fatalf("Select current settings found=%v err=%v", found, err)
            }
            if stored.NextScanAt != "2026-09-18 13:05:00" ||
              stored.LastAttemptAt != "2026-09-18 11:05:00" ||
              stored.LastSuccessfulAt != "2026-09-18 11:05:00" {
              t.Fatalf("current runtime update = %+v", stored)
            }
          }
          EOF

          cat >> backend/internal/routines/service-scan_test.go <<'EOF'

          func TestScheduledServiceScanDiscardsResultsWhenUserDisablesDuringProbe(t *testing.T) {
            startServiceScanTestDB(t)

            host := models.Host{
              Name:  "server",
              IP:    "192.168.1.92",
              Mac:   "AA:BB:CC:DD:EE:D2",
              Iface: "eth0",
              Date:  "2026-09-18 10:00:00",
              Known: 1,
              Now:   1,
            }
            gdb.Update("now", host)
            rows := gdb.SelectByMAC("now", host.Mac)
            if len(rows) != 1 {
              t.Fatalf("current host rows = %+v", rows)
            }
            host.ID = rows[0].ID
            if err := gdb.RecordHostAddressObservations([]models.Host{host}); err != nil {
              t.Fatalf("RecordHostAddressObservations: %v", err)
            }

            if _, err := gdb.UpsertServiceScanSettings(models.ServiceScanSettings{
              Mac:             host.Mac,
              Enabled:         true,
              IntervalMinutes: 60,
              PortsJSON:       "[443]",
              NextScanAt:      "2026-09-18 10:30:00",
            }); err != nil {
              t.Fatalf("UpsertServiceScanSettings enabled: %v", err)
            }

            originalScanPorts := scheduledScanPorts
            scheduledScanPorts = func(_ context.Context, target string, ports []int, workers int) []portscan.PortResult {
              current, found, err := gdb.SelectServiceScanSettingsByMAC(host.Mac)
              if err != nil || !found {
                t.Fatalf("Select settings during probe found=%v err=%v", found, err)
              }
              current.Enabled = false
              current.IntervalMinutes = 120
              current.PortsJSON = "[]"
              current.NextScanAt = ""
              if _, err := gdb.UpsertServiceScanSettings(current); err != nil {
                t.Fatalf("disable settings during probe: %v", err)
              }

              return []portscan.PortResult{
                {Port: 443, Result: portscan.Result{State: portscan.ProbeOpen}},
              }
            }
            t.Cleanup(func() {
              scheduledScanPorts = originalScanPorts
            })

            now := time.Date(2026, 9, 18, 11, 0, 0, 0, time.Local)
            if attempted := runDueServiceScansAt(context.Background(), now); attempted != 1 {
              t.Fatalf("attempted = %d, want 1", attempted)
            }

            if _, found, err := gdb.SelectServiceByIdentity(host.Mac, host.IP, "tcp", 443); err != nil || found {
              t.Fatalf("stale scheduled result persisted found=%v err=%v", found, err)
            }

            settings, found, err := gdb.SelectServiceScanSettingsByMAC(host.Mac)
            if err != nil || !found {
              t.Fatalf("Select disabled settings found=%v err=%v", found, err)
            }
            if settings.Enabled ||
              settings.IntervalMinutes != 120 ||
              settings.PortsJSON != "[]" ||
              settings.NextScanAt != "" ||
              settings.LastAttemptAt != "" ||
              settings.LastSuccessfulAt != "" {
              t.Fatalf("stale scheduler overwrote disabled settings: %+v", settings)
            }
          }
          EOF

          cat > backend/cmd/LANnventory/service_scan_lifecycle_test.go <<'EOF'
          package main

          import (
            "context"
            "reflect"
            "testing"
          )

          func TestRunServiceScannerLifecycleStaysInsideDatabaseLifetime(t *testing.T) {
            calls := []string{}

            err := run(context.Background(), nil, appRuntime{
              startConfig: func(string, string) {
                calls = append(calls, "startConfig")
              },
              startDB: func() error {
                calls = append(calls, "startDB")
                return nil
              },
              closeDB: func() error {
                calls = append(calls, "closeDB")
                return nil
              },
              scanRestart: func() {
                calls = append(calls, "scanRestart")
              },
              scanStop: func() {
                calls = append(calls, "scanStop")
              },
              serviceScanRestart: func() {
                calls = append(calls, "serviceScanRestart")
              },
              serviceScanStop: func() {
                calls = append(calls, "serviceScanStop")
              },
              historyTrim: func(context.Context) {
                calls = append(calls, "historyTrim")
              },
              webGUI: func(context.Context) error {
                calls = append(calls, "webGUI")
                return nil
              },
            })
            if err != nil {
              t.Fatalf("run() error = %v, want nil", err)
            }

            want := []string{
              "startConfig",
              "startDB",
              "scanRestart",
              "serviceScanRestart",
              "historyTrim",
              "webGUI",
              "serviceScanStop",
              "scanStop",
              "closeDB",
            }
            if !reflect.DeepEqual(calls, want) {
              t.Fatalf("calls = %#v, want %#v", calls, want)
            }
          }
          EOF

          gofmt -w backend/internal/gdb/services.go backend/internal/gdb/service_scan_runtime_hardening_test.go backend/internal/routines/service-scan.go backend/internal/routines/service-scan_test.go backend/cmd/LANnventory/service_scan_lifecycle_test.go

      - name: Run full backend acceptance gate
        working-directory: backend
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go build ./...

      - name: Commit final hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/internal/gdb/services.go backend/internal/gdb/service_scan_runtime_hardening_test.go backend/internal/routines/service-scan.go backend/internal/routines/service-scan_test.go backend/cmd/LANnventory/service_scan_lifecycle_test.go
          git diff --cached --check
          git commit -m 'phase34: harden scheduled scan configuration races'
          git push origin HEAD:phase34-service-inventory
