name: Publish v0.1.0-beta.3

on:
  push:
    branches:
      - publish-v0.1.0-beta.3

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout validated beta.3 candidate
        uses: actions/checkout@v4
        with:
          ref: 4f9c69af0e1d34d10cc513301f0befc3778ad6dc
          fetch-depth: 0

      - name: Create beta.3 tag
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.0-beta.3"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to overwrite it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "LANnventory $tag"
          git push origin "$tag"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build embedded frontend
        working-directory: frontend
        run: make all

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Show Go version
        run: go version

      - name: Publish beta.3 release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
          workdir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
