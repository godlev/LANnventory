name: Phase 29 Sync Embedded Frontend

on:
  push:
    branches:
      - phase-29-release-readiness

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-29-release-readiness

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate embedded frontend
        working-directory: frontend
        run: make all

      - name: Commit regenerated bundle
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/internal/web/public; then
            echo "Embedded frontend bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/web/public
          git commit -m "Regenerate embedded frontend bundle"
          git push origin HEAD:phase-29-release-readiness
