name: Phase 35.10 Embed Sync

on:
  push:
    branches:
      - phase35.10-host-overview

permissions:
  contents: write

jobs:
  sync-embedded-frontend:
    if: ${{ !contains(github.event.head_commit.message, '[embed-sync]') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase35.10-host-overview

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Host UX semantic contracts
        working-directory: frontend
        run: npm run test:host-ux

      - name: Build and refresh embedded frontend
        working-directory: frontend
        run: make all

      - name: Commit generated bundle
        run: |
          if git diff --quiet -- backend/internal/web/public; then
            echo "Embedded frontend is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/web/public
          git commit -m "Phase 35.10: refresh embedded frontend [embed-sync]"
          git push origin HEAD:phase35.10-host-overview
