name: Phase34 Host UX embed refresh

on:
  push:
    branches:
      - phase34-host-ux-uat
    paths:
      - .github/workflows/phase34-host-ux-embed.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase34-host-ux-uat
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and verify Host UX
        working-directory: frontend
        run: |
          npm ci
          npm run test:host-ux
          make all
      - name: Commit embedded frontend
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/internal/web/public
          git diff --cached --check
          git commit -m "phase34: refresh embedded Host UX bundle"
          git push origin HEAD:phase34-host-ux-uat
