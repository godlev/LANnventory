name: Phase34 UAT metadata prep

on:
  push:
    branches:
      - release-phase34-uat
    paths:
      - .github/workflows/phase34-uat-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-phase34-uat
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply UAT version metadata and release summary
        env:
          UAT_VERSION: 0.1.0-beta.5.uat.1
          UAT_TAG: v0.1.0-beta.5.uat.1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["UAT_VERSION"]
          tag = os.environ["UAT_TAG"]
          tick = chr(96)

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one match for {old!r}, found {count}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "backend/internal/version/version.go",
              'var Version = "0.1.0-beta.3.1"',
              f'var Version = "{version}"',
          )

          main_path = Path("backend/cmd/LANnventory/main.go")
          main_text = main_path.read_text()
          main_text, count = re.subn(r'(?m)^// @version .+$', f'// @version {version}', main_text, count=1)
          if count != 1:
              raise SystemExit("backend/cmd/LANnventory/main.go: Swagger @version marker not found")
          main_path.write_text(main_text)

          package_path = Path("frontend/package.json")
          package = json.loads(package_path.read_text())
          package["version"] = version
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          lock_path = Path("frontend/package-lock.json")
          lock = json.loads(lock_path.read_text())
          lock["version"] = version
          lock["packages"][""]["version"] = version
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          docker_path = Path("Dockerfile")
          docker_text = docker_path.read_text()
          docker_text, count = re.subn(
              r'(?m)^ARG LANNVENTORY_VERSION=.*$',
              f'ARG LANNVENTORY_VERSION={version}',
              docker_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Dockerfile: LANNVENTORY_VERSION default not found")
          docker_path.write_text(docker_text)

          proxmox_path = Path("proxmox/lannventory.sh")
          proxmox = proxmox_path.read_text()
          proxmox, count_tag = re.subn(r'(?m)^RELEASE_TAG="[^"]+"$', f'RELEASE_TAG="{tag}"', proxmox, count=1)
          proxmox, count_ver = re.subn(r'(?m)^VERSION="[^"]+"$', f'VERSION="{version}"', proxmox, count=1)
          if count_tag != 1 or count_ver != 1:
              raise SystemExit("proxmox/lannventory.sh: release version markers not found")
          proxmox_path.write_text(proxmox)

          prox_test_path = Path("proxmox/lannventory_test.sh")
          prox_test = prox_test_path.read_text()
          prox_test, count = re.subn(
              r'expected_url="https://github\.com/godlev/LANnventory/releases/download/[^"]+"',
              f'expected_url="https://github.com/godlev/LANnventory/releases/download/{tag}/lannventory_{version}_linux_amd64.deb"',
              prox_test,
              count=1,
          )
          if count != 1:
              raise SystemExit("proxmox/lannventory_test.sh: expected package URL not found")
          prox_test_path.write_text(prox_test)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme, count = re.subn(
              r'(?m)^Current beta release: .+$',
              f'Current beta release: {tick}{version}{tick}',
              readme,
              count=1,
          )
          if count != 1:
              raise SystemExit("README.md: current beta release marker not found")
          readme_path.write_text(readme)

          release_path = Path("docs/releases") / f"{tag}.md"
          release_path.parent.mkdir(parents=True, exist_ok=True)
          release_path.write_text(f"""# LANnventory {tag}
          
          ## Summary
          
          - Phase 34 turns manual TCP port checks into a persistent Services inventory with address-specific open/closed lifecycle tracking.
          - Adds opt-in scheduled TCP service scanning with bounded concurrency, IPv4/IPv6-aware targets, and persistent next/last scan status.
          - Failed, timed-out, unreachable, or cancelled probes never fabricate a service closure; stale in-flight scheduled scans are discarded when settings change.
          - Host Services UI now shows retained service state, lifecycle timestamps, scan source, scheduled-scan controls, and conservative port-based service hints.
          
          ## UAT focus
          
          Validate the normal in-app updater path from v0.1.0-beta.5, then verify manual service scanning, persistent Services state, lifecycle Events, scheduled scanning, and restart persistence.
          
          ## Release status
          
          Phase 34 UAT prerelease. Do not treat this build as the Phase 34 final merge or stable release.
          """.replace("          ", ""))
          PY

          cat >> backend/internal/updater/updater_test.go <<'EOF'

          func TestPhase34UATReleaseSelectionFromBeta5(t *testing.T) {
            releases := []release{
              {
                TagName:     "v0.1.0-beta.5.uat.1",
                Prerelease:  true,
                Draft:       false,
                PublishedAt: "2026-09-18T00:00:00Z",
                HTMLURL:     "https://github.com/godlev/LANnventory/releases/tag/v0.1.0-beta.5.uat.1",
              },
              {
                TagName:    "v0.1.0-beta.5",
                Prerelease: true,
                Draft:      false,
              },
            }

            betaStatus, selected, ok := buildStatus(
              "v0.1.0-beta.5",
              BetaChannel,
              releases,
              time.Time{},
              false,
            )
            if !ok {
              t.Fatal("Beta channel did not select a release")
            }
            if selected.TagName != "v0.1.0-beta.5.uat.1" {
              t.Fatalf("Beta selected %q, want Phase 34 UAT", selected.TagName)
            }
            if !betaStatus.Available || betaStatus.LatestVersion != "0.1.0-beta.5.uat.1" {
              t.Fatalf("Beta status = %+v, want available Phase 34 UAT", betaStatus)
            }

            stableStatus, selected, ok := buildStatus(
              "v0.1.0-beta.5",
              StableChannel,
              releases,
              time.Time{},
              false,
            )
            if ok || selected.TagName != "" {
              t.Fatalf("Stable channel selected prerelease: selected=%+v ok=%v", selected, ok)
            }
            if stableStatus.Available || stableStatus.LatestVersion != "" {
              t.Fatalf("Stable status exposed UAT prerelease: %+v", stableStatus)
            }

            beta6 := []release{
              {TagName: "v0.1.0-beta.6", Prerelease: true},
              {TagName: "v0.1.0-beta.5.uat.1", Prerelease: true},
            }
            future, ok := selectLatestRelease(beta6, BetaChannel)
            if !ok || future.TagName != "v0.1.0-beta.6" {
              t.Fatalf("future beta.6 should supersede UAT, got %+v ok=%v", future, ok)
            }
          }
          EOF

          gofmt -w backend/internal/updater/updater_test.go backend/internal/version/version.go backend/cmd/LANnventory/main.go

      - name: Build frontend and refresh embedded bundle
        working-directory: frontend
        run: |
          npm ci
          make all

      - name: Refresh Swagger docs
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Validate UAT version surfaces and updater selection
        env:
          UAT_VERSION: 0.1.0-beta.5.uat.1
          UAT_TAG: v0.1.0-beta.5.uat.1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["UAT_VERSION"]
          tag = os.environ["UAT_TAG"]
          tick = chr(96)

          checks = {
              "backend fallback": version in Path("backend/internal/version/version.go").read_text(),
              "Swagger annotation": f"// @version {version}" in Path("backend/cmd/LANnventory/main.go").read_text(),
              "Docker default": f"ARG LANNVENTORY_VERSION={version}" in Path("Dockerfile").read_text(),
              "Proxmox tag": f'RELEASE_TAG="{tag}"' in Path("proxmox/lannventory.sh").read_text(),
              "Proxmox version": f'VERSION="{version}"' in Path("proxmox/lannventory.sh").read_text(),
              "README current beta": f"Current beta release: {tick}{version}{tick}" in Path("README.md").read_text(),
          }
          package = json.loads(Path("frontend/package.json").read_text())
          lock = json.loads(Path("frontend/package-lock.json").read_text())
          checks["frontend package"] = package.get("version") == version
          checks["frontend lock"] = lock.get("version") == version and lock.get("packages", {}).get("", {}).get("version") == version
          release_path = Path("docs/releases", f"{tag}.md")
          checks["local release summary"] = release_path.exists() and "## Summary" in release_path.read_text()

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("UAT version consistency failed: " + ", ".join(failed))
          print("UAT version surfaces are consistent:")
          for name in checks:
              print(" -", name)
          PY

          cd backend
          go test ./internal/updater ./internal/version ./internal/api
          go test ./internal/version -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}"
          go vet ./internal/updater ./internal/version ./internal/api
          go build -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}" ./cmd/LANnventory
          cd ..

          bash -n proxmox/lannventory.sh
          bash proxmox/lannventory_test.sh

          printf '\\n=== ACTIVE VERSION REFERENCES ===\\n'
          grep -R -n --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
            -E 'LANNVENTORY_VERSION=|RELEASE_TAG=|^VERSION="|Current beta release:|var Version =|// @version ' \
            Dockerfile README.md proxmox backend/internal/version backend/cmd/LANnventory frontend/package.json frontend/package-lock.json \
            | head -n 80

      - name: Commit UAT metadata
        env:
          UAT_TAG: v0.1.0-beta.5.uat.1
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/internal/version/version.go \
            backend/internal/updater/updater_test.go \
            backend/cmd/LANnventory/main.go \
            backend/docs \
            backend/internal/web/public \
            frontend/package.json \
            frontend/package-lock.json \
            Dockerfile \
            proxmox/lannventory.sh \
            proxmox/lannventory_test.sh \
            README.md \
            "docs/releases/${UAT_TAG}.md"
          git diff --cached --check
          git commit -m "phase34: prepare v0.1.0-beta.5.uat.1 UAT metadata"

      - name: Remove one-shot prep workflow and push clean release branch
        run: |
          set -euo pipefail
          git rm .github/workflows/phase34-uat-prep.yml
          git commit -m "chore: remove one-shot Phase 34 UAT prep workflow"
          git push origin HEAD:release-phase34-uat
