name: Phase35 release UAT1

on:
  push:
    branches:
      - phase35-device-profiles-proxmox
    paths:
      - .github/workflows/phase35-release-uat1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout validated UAT tag
        uses: actions/checkout@v4
        with:
          ref: v0.1.0-beta.6.uat.1
          fetch-depth: 0

      - name: Verify tag source
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 v0.1.0-beta.6.uat.1)" = "bb24665bd72db394c8025e08d631f21138b88923"
          test "$(git rev-parse HEAD)" = "bb24665bd72db394c8025e08d631f21138b88923"
          grep -qx 'var Version = "0.1.0-beta.6.uat.1"' backend/internal/version/version.go
          test -f docs/releases/v0.1.0-beta.6.uat.1.md

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build embedded frontend
        working-directory: frontend
        run: make all

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build release artifacts with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
          workdir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply curated release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit v0.1.0-beta.6.uat.1 \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file docs/releases/v0.1.0-beta.6.uat.1.md
