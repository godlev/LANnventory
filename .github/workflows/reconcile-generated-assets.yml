name: Reconcile Generated Assets

on:
  push:
    branches:
      - phase-29-reconcile-checkpoint

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-29-reconcile-checkpoint

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Format Go changes
        run: gofmt -w backend/internal/updater/updater.go backend/internal/updater/updater_test.go backend/internal/api/api-update.go backend/internal/api/api_update_test.go

      - name: Regenerate embedded frontend
        working-directory: frontend
        run: |
          npm ci
          make all

      - name: Commit generated changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/updater/updater.go backend/internal/updater/updater_test.go backend/internal/api/api-update.go backend/internal/api/api_update_test.go backend/internal/web/public
          git commit -m "Format updater and regenerate embedded frontend"
          git push origin HEAD:phase-29-reconcile-checkpoint
