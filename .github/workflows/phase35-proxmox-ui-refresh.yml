name: Phase 35 Proxmox UI Refresh

on:
  push:
    branches:
      - phase35-device-profiles-proxmox

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase35-device-profiles-proxmox

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build canonical embedded frontend
        working-directory: frontend
        run: make all

      - name: Verify mock API syntax
        run: node --check frontend/dev/mock-api.mjs

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format Phase 35 source
        run: |
          gofmt -w \
            backend/internal/api/api-proxmox-source-state.go \
            backend/internal/api/api_proxmox_source_state_test.go \
            backend/internal/api/routes.go

      - name: Refresh canonical Swagger
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Commit refreshed state
        run: |
          if git diff --quiet; then
            echo "No generated or formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal backend/docs
          git commit -m "phase35: refresh Proxmox UI generated state"
          git push origin HEAD:phase35-device-profiles-proxmox
