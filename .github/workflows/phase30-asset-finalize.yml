name: Phase 30 Frontend Asset Finalize

on:
  push:
    branches:
      - phase-30-update-ux-automation

permissions:
  contents: write

jobs:
  finalize-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: phase-30-update-ux-automation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Replace complete embedded frontend asset set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/internal/web/public/assets
          mkdir -p backend/internal/web/public/assets
          cp -a frontend/dist/assets/. backend/internal/web/public/assets/
          python3 - <<'PY'
          from pathlib import Path
          root = Path("backend/internal/web/public/assets")
          entry_js = root / "index.js"
          entry_css = root / "index.css"
          entry_js.write_text(entry_js.read_text().replace("assets/", "fs/public/assets/"))
          entry_css.write_text(entry_css.read_text().replace("url(/assets/", "url(/fs/public/assets/"))
          PY

      - name: Verify Phase 30 generated UI
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'LANnventory update available' backend/internal/web/public/assets/index.js
          grep -Fq 'Review update' backend/internal/web/public/assets/index.js
          grep -Fq 'Update now' backend/internal/web/public/assets/index.js
          grep -Fq 'Automatic updates' backend/internal/web/public/assets/Config.js
          grep -Fq 'Update channel' backend/internal/web/public/assets/Config.js
          grep -Fq 'Release notes' backend/internal/web/public/assets/Config.js
          grep -Fq 'No update' backend/internal/web/public/assets/Config.js
          grep -Fq 'host-diagnostics-grid' backend/internal/web/public/assets/HostPage.js
          grep -Fq 'Approximate first seen' backend/internal/web/public/assets/HostPage.js

      - name: Commit complete generated assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase30-asset-finalize.yml
          git add -A backend/internal/web/public/assets
          git diff --cached --check
          git commit -m "Refresh Phase 30 embedded frontend assets"
          git push origin HEAD:phase-30-update-ux-automation
