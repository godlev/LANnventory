name: Packaging Check

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          run_audit_with_retries() {
            local attempt=1
            local max_attempts=3
            local delay=10
            local output
            local status

            while true; do
              output="$(mktemp)"
              set +e
              "$@" >"$output" 2>&1
              status=$?
              set -e
              cat "$output"

              if [ "$status" -eq 0 ]; then
                rm -f "$output"
                return 0
              fi

              if ! grep -Eiq "audit endpoint returned an error|500 Internal Server Error|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|ECONNRESET|ETIMEDOUT|EAI_AGAIN" "$output"; then
                echo "::error::npm audit failed with a non-transient result; failing without retry."
                rm -f "$output"
                return "$status"
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::npm audit failed after $max_attempts transient attempts."
                rm -f "$output"
                return "$status"
              fi

              echo "::warning::npm audit hit a transient registry/service failure; retrying in ${delay}s."
              rm -f "$output"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          run_audit_with_retries npm audit
          run_audit_with_retries npm audit --omit=dev

      - name: Build frontend
        working-directory: frontend
        run: make all

      - name: Upload generated frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: phase32-frontend-bundle
          path: backend/internal/web/public
          if-no-files-found: error

      - name: Check mock API syntax
        run: node --check frontend/dev/mock-api.mjs

      - name: Check Proxmox installer syntax and helpers
        run: |
          if [ -f proxmox/lannventory.sh ]; then
            bash -n proxmox/lannventory.sh
            bash proxmox/lannventory_test.sh
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Swagger docs are current
        working-directory: backend
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models
          git diff --exit-code docs

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Race test backend
        working-directory: backend
        run: go test -race ./...

      - name: Vet backend
        working-directory: backend
        run: go vet ./...

      - name: Build backend
        working-directory: backend
        run: go build ./...

  docker-build:
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build LANnventory image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: lannventory:ci

      - name: Validate Docker Compose config
        run: |
          docker compose config
          docker compose -f docker-compose-auth.yml config

      - name: Run safe container smoke test
        run: bash .github/scripts/container-smoke-test.sh lannventory:ci


  promote-phase32:
    if: github.ref == 'refs/heads/phase-32-frontend-build'
    runs-on: ubuntu-22.04
    needs:
      - build-and-test
      - docker-build
    permissions:
      contents: write
    steps:
      - name: Checkout frontend build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generated frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: phase32-frontend-bundle
          path: backend/internal/web/public

      - name: Prepare clean Phase 32.5 commit
        run: |
          git fetch origin phase-32-beta-hardening
          git checkout origin/phase-32-beta-hardening -- .github/workflows/packaging-check.yml
          git reset origin/phase-32-beta-hardening
          git add \
            frontend/src/components/Header.tsx \
            frontend/src/components/Config/Diagnostics.tsx \
            frontend/src/pages/Config.tsx \
            frontend/src/functions/scannerApi.ts \
            frontend/src/App.css \
            frontend/dev/mock-api.mjs \
            backend/internal/web/public
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 32.5: add scanner health and diagnostics UI"
          git push --force origin HEAD:phase-32-frontend-ready
