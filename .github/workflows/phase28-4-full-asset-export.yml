name: Phase 28.4 Full Frontend Asset Finalize

on:
  push:
    branches:
      - phase-28-4-host-details-ux

permissions:
  contents: write

jobs:
  finalize-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: phase-28-4-host-details-ux

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Replace complete embedded frontend asset set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/internal/web/public/assets
          mkdir -p backend/internal/web/public/assets
          cp -a frontend/dist/assets/. backend/internal/web/public/assets/
          python3 - <<'PY'
          from pathlib import Path
          root = Path("backend/internal/web/public/assets")
          entry_js = root / "index.js"
          entry_css = root / "index.css"
          entry_js.write_text(entry_js.read_text().replace("assets/", "fs/public/assets/"))
          entry_css.write_text(entry_css.read_text().replace("url(/assets/", "url(/fs/public/assets/"))
          PY

      - name: Verify Phase 28.4 generated Host UI
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/internal/web/public/assets/HostPage.js
          grep -Fq 'Network & Discovery' backend/internal/web/public/assets/HostPage.js
          grep -Fq 'Wake on LAN' backend/internal/web/public/assets/HostPage.js
          grep -Fq 'This device is currently marked Unknown' backend/internal/web/public/assets/HostPage.js
          grep -Fq 'Pin this device at the top of the Home device list' backend/internal/web/public/assets/HostPage.js
          grep -Fq 'host-pin-icons' backend/internal/web/public/assets/HostPage.js
          grep -Fq 'Remove this device from LANnventory' backend/internal/web/public/assets/HostPage.js
          grep -Fq '.wyl-tooltip' backend/internal/web/public/assets/index.css
          grep -Fq '.host-details-layout' backend/internal/web/public/assets/index.css

      - name: Commit complete generated asset set and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase28-4-full-asset-export.yml
          git add -A backend/internal/web/public/assets
          git diff --cached --check
          git commit -m "Refresh complete Phase 28.4 frontend asset set"
          git push origin HEAD:phase-28-4-host-details-ux
