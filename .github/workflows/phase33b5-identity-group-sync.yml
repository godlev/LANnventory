name: Phase33B5 Identity Group Sync

on:
  push:
    branches:
      - phase-33-device-identity
    paths:
      - .github/workflows/phase33b5-identity-group-sync.yml

permissions:
  contents: write

jobs:
  validate-sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-33-device-identity

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and sync embedded frontend
        working-directory: frontend
        run: make all

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format Phase 33B.4 and 33B.5 Go files
        run: |
          gofmt -w backend/internal/correlation/decision_graph.go
          gofmt -w backend/internal/correlation/decision_graph_test.go
          gofmt -w backend/internal/gdb/identity_correlation_decisions.go
          gofmt -w backend/internal/gdb/identity_correlation_decisions_test.go
          gofmt -w backend/internal/api/api-correlation-decisions.go
          gofmt -w backend/internal/api/api_correlation_conflict_test.go
          gofmt -w backend/internal/api/api-correlation-group.go
          gofmt -w backend/internal/api/api_correlation_group_test.go
          gofmt -w backend/internal/api/routes.go

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Race test backend
        working-directory: backend
        run: go test -race ./...

      - name: Regenerate Swagger
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Commit synchronized files
        run: |
          if git diff --quiet; then
            echo "No generated or formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/correlation/decision_graph.go backend/internal/correlation/decision_graph_test.go backend/internal/gdb/identity_correlation_decisions.go backend/internal/gdb/identity_correlation_decisions_test.go backend/internal/api/api-correlation-decisions.go backend/internal/api/api_correlation_conflict_test.go backend/internal/api/api-correlation-group.go backend/internal/api/api_correlation_group_test.go backend/internal/api/routes.go backend/docs backend/internal/web/public
          git commit -m "Phase 33B.5: sync confirmed identity group generated files"
          git push origin HEAD:phase-33-device-identity

      # This temporary workflow is removed after the clean Packaging Check passes.
