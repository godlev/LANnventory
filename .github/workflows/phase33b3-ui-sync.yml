name: Phase33B3 UI Sync

on:
  push:
    branches:
      - phase-33-device-identity
    paths:
      - .github/workflows/phase33b3-ui-sync.yml

permissions:
  contents: write

jobs:
  validate-sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-33-device-identity

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: make all

      - name: Commit embedded frontend assets
        run: |
          if git diff --quiet -- backend/internal/web/public; then
            echo "No embedded frontend changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/web/public
          git commit -m "Phase 33B.3: sync correlation UI assets"
          git push origin HEAD:phase-33-device-identity
