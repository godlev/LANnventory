name: Phase34 scheduled service scan runtime

on:
  push:
    branches:
      - phase34-service-inventory
    paths:
      - .github/workflows/phase34-service-scan-runtime.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase34-service-inventory
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Add scheduled service scan runtime
        run: |
          cat > backend/internal/routines/service-scan.go <<'EOF'
          package routines

          import (
            "context"
            "fmt"
            "log/slog"
            "net"
            "strings"
            "sync"
            "time"

            "github.com/godlev/LANnventory/internal/gdb"
            "github.com/godlev/LANnventory/internal/models"
            "github.com/godlev/LANnventory/internal/portscan"
            "github.com/godlev/LANnventory/internal/servicescan"
          )

          const (
            serviceScanPollInterval = 30 * time.Second
            serviceScanBatchSize    = 32
            serviceScanWorkers      = 32
          )

          var (
            scheduledServiceScanNow = time.Now
            scheduledScanPorts      = portscan.ScanPorts

            serviceScanRestartMu sync.Mutex
            serviceScanCancel    context.CancelFunc
            serviceScanDone      chan struct{}
            startServiceScanFunc = startServiceScan
          )

          // ServiceScanRestart stops any existing scheduled service scanner before
          // starting a replacement. The database must already be available.
          func ServiceScanRestart() {
            serviceScanRestartMu.Lock()
            defer serviceScanRestartMu.Unlock()

            stopActiveServiceScanLocked()

            ctx, cancel := context.WithCancel(context.Background())
            done := make(chan struct{})
            serviceScanCancel = cancel
            serviceScanDone = done

            go func() {
              defer close(done)
              startServiceScanFunc(ctx)
            }()
          }

          // ServiceScanStop cancels the scheduled service scanner and waits for it.
          func ServiceScanStop() {
            serviceScanRestartMu.Lock()
            defer serviceScanRestartMu.Unlock()
            stopActiveServiceScanLocked()
          }

          func stopActiveServiceScanLocked() {
            if serviceScanCancel == nil {
              return
            }

            serviceScanCancel()
            if serviceScanDone != nil {
              <-serviceScanDone
            }
            serviceScanCancel = nil
            serviceScanDone = nil
          }

          func startServiceScan(ctx context.Context) {
            for {
              if ctx.Err() != nil {
                return
              }

              runDueServiceScansAt(ctx, scheduledServiceScanNow())

              timer := time.NewTimer(serviceScanPollInterval)
              select {
              case <-ctx.Done():
                if !timer.Stop() {
                  select {
                  case <-timer.C:
                  default:
                  }
                }
                return
              case <-timer.C:
              }
            }
          }

          func runDueServiceScansAt(ctx context.Context, now time.Time) int {
            dueAt := now.Format(models.HostEventDateLayout)
            settings, err := gdb.SelectDueServiceScanSettings(dueAt, serviceScanBatchSize)
            if err != nil {
              slog.Error("Failed to load due service scans", "err", err)
              return 0
            }

            attempted := 0
            for _, setting := range settings {
              if ctx.Err() != nil {
                return attempted
              }
              attempted++
              runScheduledServiceScan(ctx, setting, now)
            }
            return attempted
          }

          func runScheduledServiceScan(ctx context.Context, settings models.ServiceScanSettings, now time.Time) {
            if ctx.Err() != nil {
              return
            }

            attemptAt := now.Format(models.HostEventDateLayout)
            nextAt := now.Add(time.Duration(settings.IntervalMinutes) * time.Minute).Format(models.HostEventDateLayout)

            ports, err := servicescan.DecodePortsJSON(settings.PortsJSON)
            if err != nil || len(ports) == 0 {
              updateScheduledServiceScanRuntime(settings.Mac, nextAt, attemptAt, "scheduled scan has invalid or empty port configuration", false)
              return
            }

            host, ok := currentHostForScheduledServiceScan(settings.Mac)
            if !ok {
              updateScheduledServiceScanRuntime(settings.Mac, nextAt, attemptAt, "host is no longer present in current inventory", false)
              return
            }

            addresses, err := activeAddressesForScheduledServiceScan(host)
            if err != nil {
              updateScheduledServiceScanRuntime(settings.Mac, nextAt, attemptAt, "failed to load active host addresses", false)
              return
            }
            if len(addresses) == 0 {
              updateScheduledServiceScanRuntime(settings.Mac, nextAt, attemptAt, "host has no active addresses", false)
              return
            }

            totalProbes := 0
            indeterminate := 0
            persistenceFailures := 0

            for _, address := range addresses {
              if ctx.Err() != nil {
                return
              }

              results := scheduledScanPorts(ctx, scheduledProbeTarget(address), ports, serviceScanWorkers)
              eventHost := host
              eventHost.IP = address.Address
              if strings.TrimSpace(address.Iface) != "" {
                eventHost.Iface = address.Iface
              }

              for _, result := range results {
                if ctx.Err() != nil || result.Result.State == portscan.ProbeCanceled {
                  return
                }
                totalProbes++

                if result.Result.State == portscan.ProbeIndeterminate {
                  indeterminate++
                  continue
                }
                if result.Result.State != portscan.ProbeOpen && result.Result.State != portscan.ProbeClosed {
                  indeterminate++
                  continue
                }

                if _, _, _, err := gdb.RecordHostServiceObservation(eventHost, models.Service{
                  Mac:            settings.Mac,
                  Address:        address.Address,
                  Protocol:       string(models.ServiceProtocolTCP),
                  Port:           result.Port,
                  State:          string(result.Result.State),
                  LastScanSource: "scheduled",
                }, attemptAt); err != nil {
                  persistenceFailures++
                  slog.Error(
                    "Failed to persist scheduled service observation",
                    "mac", settings.Mac,
                    "address", address.Address,
                    "port", result.Port,
                    "err", err,
                  )
                }
              }
            }

            if totalProbes == 0 {
              updateScheduledServiceScanRuntime(settings.Mac, nextAt, attemptAt, "scheduled scan produced no probe results", false)
              return
            }

            errors := make([]string, 0, 2)
            if indeterminate > 0 {
              errors = append(errors, fmt.Sprintf("%d of %d probes indeterminate", indeterminate, totalProbes))
            }
            if persistenceFailures > 0 {
              errors = append(errors, fmt.Sprintf("%d service observations could not be persisted", persistenceFailures))
            }

            successful := len(errors) == 0
            updateScheduledServiceScanRuntime(settings.Mac, nextAt, attemptAt, strings.Join(errors, "; "), successful)
          }

          func currentHostForScheduledServiceScan(mac string) (models.Host, bool) {
            hosts := gdb.SelectByMAC("now", mac)
            for _, host := range hosts {
              if host.ID > 0 {
                return host, true
              }
            }
            return models.Host{}, false
          }

          func activeAddressesForScheduledServiceScan(host models.Host) ([]models.HostAddress, error) {
            retained, err := gdb.SelectHostAddressesByMAC(host.Mac)
            if err != nil {
              return nil, err
            }

            active := make([]models.HostAddress, 0, len(retained))
            for _, address := range retained {
              if address.Active {
                active = append(active, address)
              }
            }
            if len(active) > 0 {
              return active, nil
            }

            if host.Now == 1 && net.ParseIP(strings.TrimSpace(host.IP)) != nil {
              return []models.HostAddress{{
                Mac:     host.Mac,
                Address: strings.TrimSpace(host.IP),
                Iface:   strings.TrimSpace(host.Iface),
                Active:  true,
              }}, nil
            }
            return active, nil
          }

          func scheduledProbeTarget(address models.HostAddress) string {
            ip := net.ParseIP(strings.TrimSpace(address.Address))
            if ip != nil && ip.To4() == nil && ip.IsLinkLocalUnicast() && strings.TrimSpace(address.Iface) != "" {
              return strings.TrimSpace(address.Address) + "%" + strings.TrimSpace(address.Iface)
            }
            return strings.TrimSpace(address.Address)
          }

          func updateScheduledServiceScanRuntime(mac, nextAt, attemptAt, lastError string, successful bool) {
            if err := gdb.UpdateServiceScanRuntime(mac, nextAt, attemptAt, lastError, successful); err != nil {
              slog.Error("Failed to update scheduled service scan runtime", "mac", mac, "err", err)
            }
          }
          EOF

          cat > backend/internal/routines/service-scan_test.go <<'EOF'
          package routines

          import (
            "context"
            "path/filepath"
            "strings"
            "testing"
            "time"

            "github.com/godlev/LANnventory/internal/conf"
            "github.com/godlev/LANnventory/internal/gdb"
            "github.com/godlev/LANnventory/internal/models"
            "github.com/godlev/LANnventory/internal/portscan"
          )

          func TestRunDueServiceScansPersistsDefinitiveResultsAndRuntime(t *testing.T) {
            startServiceScanTestDB(t)

            oldAddressHost := models.Host{
              Name:  "server",
              IP:    "192.168.1.89",
              Mac:   "AA:BB:CC:DD:EE:D0",
              Iface: "eth0",
              Date:  "2026-09-18 09:00:00",
              Known: 1,
              Now:   1,
            }
            if !gdb.Update("now", oldAddressHost) {
              t.Fatal("gdb.Update old host failed")
            }
            if err := gdb.RecordHostAddressObservations([]models.Host{oldAddressHost}); err != nil {
              t.Fatalf("RecordHostAddressObservations old: %v", err)
            }

            host := oldAddressHost
            host.IP = "192.168.1.90"
            host.Date = "2026-09-18 10:00:00"
            currentRows := gdb.SelectByMAC("now", host.Mac)
            if len(currentRows) != 1 {
              t.Fatalf("current rows before update = %+v", currentRows)
            }
            host.ID = currentRows[0].ID
            if !gdb.Update("now", host) {
              t.Fatal("gdb.Update current host failed")
            }
            if err := gdb.RecordHostAddressObservations([]models.Host{host}); err != nil {
              t.Fatalf("RecordHostAddressObservations current: %v", err)
            }

            if _, err := gdb.UpsertServiceScanSettings(models.ServiceScanSettings{
              Mac:             host.Mac,
              Enabled:         true,
              IntervalMinutes: 60,
              PortsJSON:       "[22,443]",
              NextScanAt:      "2026-09-18 10:30:00",
            }); err != nil {
              t.Fatalf("UpsertServiceScanSettings: %v", err)
            }

            originalScanPorts := scheduledScanPorts
            var targets []string
            scheduledScanPorts = func(_ context.Context, target string, ports []int, workers int) []portscan.PortResult {
              targets = append(targets, target)
              if workers != serviceScanWorkers {
                t.Fatalf("workers = %d, want %d", workers, serviceScanWorkers)
              }
              return []portscan.PortResult{
                {Port: 22, Result: portscan.Result{State: portscan.ProbeClosed}},
                {Port: 443, Result: portscan.Result{State: portscan.ProbeOpen}},
              }
            }
            t.Cleanup(func() {
              scheduledScanPorts = originalScanPorts
            })

            now := time.Date(2026, 9, 18, 11, 0, 0, 0, time.Local)
            if attempted := runDueServiceScansAt(context.Background(), now); attempted != 1 {
              t.Fatalf("attempted = %d, want 1", attempted)
            }
            if len(targets) != 1 || targets[0] != host.IP {
              t.Fatalf("targets = %v, want only active address %s", targets, host.IP)
            }

            service, found, err := gdb.SelectServiceByIdentity(host.Mac, host.IP, "tcp", 443)
            if err != nil || !found {
              t.Fatalf("SelectServiceByIdentity open found=%v err=%v", found, err)
            }
            if service.State != "open" || service.LastScanSource != "scheduled" || service.LastChecked != "2026-09-18 11:00:00" {
              t.Fatalf("open service = %+v", service)
            }
            if _, found, err := gdb.SelectServiceByIdentity(host.Mac, host.IP, "tcp", 22); err != nil || found {
              t.Fatalf("never-open closed service found=%v err=%v", found, err)
            }

            settings, found, err := gdb.SelectServiceScanSettingsByMAC(host.Mac)
            if err != nil || !found {
              t.Fatalf("SelectServiceScanSettingsByMAC found=%v err=%v", found, err)
            }
            if settings.LastAttemptAt != "2026-09-18 11:00:00" ||
              settings.LastSuccessfulAt != "2026-09-18 11:00:00" ||
              settings.NextScanAt != "2026-09-18 12:00:00" ||
              settings.LastError != "" {
              t.Fatalf("runtime settings = %+v", settings)
            }
          }

          func TestRunDueServiceScansLeavesStateUntouchedOnIndeterminate(t *testing.T) {
            startServiceScanTestDB(t)

            host := models.Host{
              Name:  "nas",
              IP:    "192.168.1.91",
              Mac:   "AA:BB:CC:DD:EE:D1",
              Iface: "eth0",
              Date:  "2026-09-18 10:00:00",
              Known: 1,
              Now:   1,
            }
            if !gdb.Update("now", host) {
              t.Fatal("gdb.Update host failed")
            }
            currentRows := gdb.SelectByMAC("now", host.Mac)
            host.ID = currentRows[0].ID
            if err := gdb.RecordHostAddressObservations([]models.Host{host}); err != nil {
              t.Fatalf("RecordHostAddressObservations: %v", err)
            }
            if _, _, _, err := gdb.RecordHostServiceObservation(host, models.Service{
              Mac:            host.Mac,
              Address:        host.IP,
              Protocol:       "tcp",
              Port:           445,
              State:          "open",
              LastScanSource: "manual",
            }, "2026-09-18 10:00:00"); err != nil {
              t.Fatalf("RecordHostServiceObservation seed: %v", err)
            }
            if _, err := gdb.UpsertServiceScanSettings(models.ServiceScanSettings{
              Mac:             host.Mac,
              Enabled:         true,
              IntervalMinutes: 30,
              PortsJSON:       "[445]",
              NextScanAt:      "2026-09-18 10:30:00",
            }); err != nil {
              t.Fatalf("UpsertServiceScanSettings: %v", err)
            }

            originalScanPorts := scheduledScanPorts
            scheduledScanPorts = func(_ context.Context, target string, ports []int, workers int) []portscan.PortResult {
              return []portscan.PortResult{
                {Port: 445, Result: portscan.Result{State: portscan.ProbeIndeterminate}},
              }
            }
            t.Cleanup(func() {
              scheduledScanPorts = originalScanPorts
            })

            now := time.Date(2026, 9, 18, 11, 0, 0, 0, time.Local)
            if attempted := runDueServiceScansAt(context.Background(), now); attempted != 1 {
              t.Fatalf("attempted = %d, want 1", attempted)
            }

            service, found, err := gdb.SelectServiceByIdentity(host.Mac, host.IP, "tcp", 445)
            if err != nil || !found {
              t.Fatalf("SelectServiceByIdentity found=%v err=%v", found, err)
            }
            if service.State != "open" || service.LastChecked != "2026-09-18 10:00:00" || service.LastDetected != "2026-09-18 10:00:00" {
              t.Fatalf("indeterminate scan changed service = %+v", service)
            }

            settings, found, err := gdb.SelectServiceScanSettingsByMAC(host.Mac)
            if err != nil || !found {
              t.Fatalf("SelectServiceScanSettingsByMAC found=%v err=%v", found, err)
            }
            if settings.LastSuccessfulAt != "" || settings.NextScanAt != "2026-09-18 11:30:00" || !strings.Contains(settings.LastError, "indeterminate") {
              t.Fatalf("indeterminate runtime settings = %+v", settings)
            }
          }

          func TestScheduledProbeTargetAddsZoneForLinkLocalIPv6(t *testing.T) {
            target := scheduledProbeTarget(models.HostAddress{
              Address: "fe80::1234",
              Iface:   "eth0",
              Active:  true,
            })
            if target != "fe80::1234%eth0" {
              t.Fatalf("target = %q, want fe80::1234%%eth0", target)
            }

            global := scheduledProbeTarget(models.HostAddress{
              Address: "2001:db8::1",
              Iface:   "eth0",
              Active:  true,
            })
            if global != "2001:db8::1" {
              t.Fatalf("global target = %q, want 2001:db8::1", global)
            }
          }

          func startServiceScanTestDB(t *testing.T) {
            t.Helper()

            oldConfig := conf.GetAppConfig()
            conf.SetAppConfigForTest(models.Conf{
              UseDB:  "sqlite",
              DBPath: filepath.Join(t.TempDir(), "service-scheduler.db"),
            })
            t.Cleanup(func() {
              ServiceScanStop()
              if err := gdb.Close(); err != nil {
                t.Errorf("gdb.Close: %v", err)
              }
              conf.SetAppConfigForTest(oldConfig)
            })

            if err := gdb.StartErr(); err != nil {
              t.Fatalf("gdb.StartErr: %v", err)
            }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one exact match, found {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'backend/cmd/LANnventory/main.go',
              '''\tscanRestart func()\n\tscanStop    func()\n\thistoryTrim func(context.Context)''',
              '''\tscanRestart        func()\n\tscanStop           func()\n\tserviceScanRestart func()\n\tserviceScanStop    func()\n\thistoryTrim        func(context.Context)''',
          )
          replace_once(
              'backend/cmd/LANnventory/main.go',
              '''\t\tscanRestart: routines.ScanRestart,\n\t\tscanStop:    routines.ScanStop,\n\t\thistoryTrim: routines.HistoryTrimContext,''',
              '''\t\tscanRestart:        routines.ScanRestart,\n\t\tscanStop:           routines.ScanStop,\n\t\tserviceScanRestart: routines.ServiceScanRestart,\n\t\tserviceScanStop:    routines.ServiceScanStop,\n\t\thistoryTrim:        routines.HistoryTrimContext,''',
          )
          replace_once(
              'backend/cmd/LANnventory/main.go',
              '''\truntime.scanRestart()\n\tdefer runtime.scanStop()\n\n\truntime.historyTrim(ctx)''',
              '''\truntime.scanRestart()\n\tdefer runtime.scanStop()\n\n\tif runtime.serviceScanRestart != nil {\n\t\truntime.serviceScanRestart()\n\t\tif runtime.serviceScanStop != nil {\n\t\t\tdefer runtime.serviceScanStop()\n\t\t}\n\t}\n\n\truntime.historyTrim(ctx)''',
          )
          PY

          gofmt -w backend/internal/routines/service-scan.go backend/internal/routines/service-scan_test.go backend/cmd/LANnventory/main.go

      - name: Verify scheduler checkpoint
        working-directory: backend
        run: |
          go test ./internal/routines ./internal/servicescan ./internal/gdb ./internal/portscan ./cmd/LANnventory
          go test -race ./internal/routines ./internal/servicescan ./internal/gdb ./internal/portscan
          go vet ./internal/routines ./internal/servicescan ./internal/gdb ./internal/portscan ./cmd/LANnventory
          go build ./...

      - name: Commit scheduler checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/internal/routines/service-scan.go backend/internal/routines/service-scan_test.go backend/cmd/LANnventory/main.go
          git diff --cached --check
          git commit -m 'phase34: run opt-in scheduled service scans'
          git push origin HEAD:phase34-service-inventory
