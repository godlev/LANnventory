name: Phase 35.10 UAT Tag

on:
  push:
    branches:
      - phase35.10-host-overview

permissions:
  contents: write

jobs:
  create-uat-tag:
    if: ${{ github.event.head_commit.message == 'chore: trigger Phase 35.10 UAT tag' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create exact UAT tag
        env:
          TARGET_SHA: 835821c13e7a8b36c1a7e54bb3035c0bc468760a
          UAT_TAG: v0.1.0-beta.10.uat.1
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_SHA^{commit}"
          if git ls-remote --exit-code --tags origin "refs/tags/$UAT_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $UAT_TAG already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$UAT_TAG" "$TARGET_SHA" -m "Phase 35.10 UAT 1"
          git push origin "refs/tags/$UAT_TAG"
