name: Phase34 Host UX UAT2 prep

on:
  push:
    branches:
      - release-phase34-host-ux-uat2
    paths:
      - .github/workflows/phase34-host-ux-uat2-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-phase34-host-ux-uat2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply UAT2 version metadata and release summary
        env:
          UAT_VERSION: 0.1.0-beta.5.uat.2
          UAT_TAG: v0.1.0-beta.5.uat.2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["UAT_VERSION"]
          tag = os.environ["UAT_TAG"]
          previous = "0.1.0-beta.5.uat.1"
          previous_tag = "v" + previous
          tick = chr(96)

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one match for {old!r}, found {count}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "backend/internal/version/version.go",
              f'var Version = "{previous}"',
              f'var Version = "{version}"',
          )

          main_path = Path("backend/cmd/LANnventory/main.go")
          main_text = main_path.read_text()
          main_text, count = re.subn(
              rf'(?m)^// @version {re.escape(previous)}$',
              f'// @version {version}',
              main_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("backend/cmd/LANnventory/main.go: expected previous Swagger version once")
          main_path.write_text(main_text)

          package_path = Path("frontend/package.json")
          package = json.loads(package_path.read_text())
          if package.get("version") != previous:
              raise SystemExit(f"frontend/package.json: unexpected previous version {package.get('version')}")
          package["version"] = version
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          lock_path = Path("frontend/package-lock.json")
          lock = json.loads(lock_path.read_text())
          if lock.get("version") != previous or lock.get("packages", {}).get("", {}).get("version") != previous:
              raise SystemExit("frontend/package-lock.json: unexpected previous root version")
          lock["version"] = version
          lock["packages"][""]["version"] = version
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          replace_once("Dockerfile", f"ARG LANNVENTORY_VERSION={previous}", f"ARG LANNVENTORY_VERSION={version}")
          replace_once("proxmox/lannventory.sh", f'RELEASE_TAG="{previous_tag}"', f'RELEASE_TAG="{tag}"')
          replace_once("proxmox/lannventory.sh", f'VERSION="{previous}"', f'VERSION="{version}"')

          prox_test_path = Path("proxmox/lannventory_test.sh")
          prox_test = prox_test_path.read_text()
          old_url = f'https://github.com/godlev/LANnventory/releases/download/{previous_tag}/lannventory_{previous}_linux_amd64.deb'
          new_url = f'https://github.com/godlev/LANnventory/releases/download/{tag}/lannventory_{version}_linux_amd64.deb'
          if prox_test.count(old_url) != 1:
              raise SystemExit("proxmox/lannventory_test.sh: previous package URL not found exactly once")
          prox_test_path.write_text(prox_test.replace(old_url, new_url, 1))

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          old_marker = f"Current beta release: {tick}{previous}{tick}"
          new_marker = f"Current beta release: {tick}{version}{tick}"
          if readme.count(old_marker) != 1:
              raise SystemExit("README.md: previous beta marker not found exactly once")
          readme_path.write_text(readme.replace(old_marker, new_marker, 1))

          release_path = Path("docs/releases") / f"{tag}.md"
          release_path.parent.mkdir(parents=True, exist_ok=True)
          release_path.write_text(f"""# LANnventory {tag}
          
          ## Summary
          
          - Clarifies Host → Network & Discovery with Current IP, Current MAC, Vendor, and MAC-scoped lifecycle labels.
          - Renames the identity panel to Network identity history and makes shared-IP reuse explicit: an IP observed with another MAC is address history, not proof of the same physical device.
          - Keeps same-device correlation visually and semantically separate from IP reuse history; the correlation algorithm and decisions are unchanged.
          - Host → Recent events now shows Event, historical IP, historical MAC, and time from each stored event snapshot, without redundant links back to the same Host page.
          - Adds responsive Host event layout and regression checks that preserve Global Events Host links and handle missing historical IP/MAC safely.
          
          ## UAT focus
          
          Upgrade from {previous_tag} through Settings → Updates on the Beta channel. Verify the Host page wording, IP/MAC history semantics, correlation separation, historical Recent Events IP/MAC values, and mobile/desktop layout.
          
          ## Release status
          
          Phase 34 Host UX UAT correction. Do not merge Phase 34 to main until this UAT passes.
          
          Validated Host UX branch source: 89c9e61caf1885a54416309ff486c55b11c9626d.
          Functional UX correction commit: a2817f0c1a35124d10e29e514bc6fcf2995017e9.
          """.replace("          ", ""))
          PY

          cat >> backend/internal/updater/updater_test.go <<'EOF'

          func TestPhase34HostUXUAT2SelectionFromUAT1(t *testing.T) {
            releases := []release{
              {
                TagName:     "v0.1.0-beta.5.uat.2",
                Prerelease:  true,
                Draft:       false,
                PublishedAt: "2026-09-18T00:00:00Z",
                HTMLURL:     "https://github.com/godlev/LANnventory/releases/tag/v0.1.0-beta.5.uat.2",
              },
              {
                TagName:    "v0.1.0-beta.5.uat.1",
                Prerelease: true,
                Draft:      false,
              },
              {
                TagName:    "v0.1.0-beta.5",
                Prerelease: true,
                Draft:      false,
              },
            }

            betaStatus, selected, ok := buildStatus(
              "v0.1.0-beta.5.uat.1",
              BetaChannel,
              releases,
              time.Time{},
              false,
            )
            if !ok {
              t.Fatal("Beta channel did not select a release")
            }
            if selected.TagName != "v0.1.0-beta.5.uat.2" {
              t.Fatalf("Beta selected %q, want Host UX UAT2", selected.TagName)
            }
            if !betaStatus.Available || betaStatus.LatestVersion != "0.1.0-beta.5.uat.2" {
              t.Fatalf("Beta status = %+v, want available Host UX UAT2", betaStatus)
            }

            stableStatus, selected, ok := buildStatus(
              "v0.1.0-beta.5.uat.1",
              StableChannel,
              releases,
              time.Time{},
              false,
            )
            if ok || selected.TagName != "" {
              t.Fatalf("Stable channel selected prerelease: selected=%+v ok=%v", selected, ok)
            }
            if stableStatus.Available || stableStatus.LatestVersion != "" {
              t.Fatalf("Stable status exposed Host UX UAT2 prerelease: %+v", stableStatus)
            }

            future := []release{
              {TagName: "v0.1.0-beta.6", Prerelease: true},
              {TagName: "v0.1.0-beta.5.uat.2", Prerelease: true},
              {TagName: "v0.1.0-beta.5.uat.1", Prerelease: true},
            }
            next, ok := selectLatestRelease(future, BetaChannel)
            if !ok || next.TagName != "v0.1.0-beta.6" {
              t.Fatalf("future beta.6 should supersede UAT2, got %+v ok=%v", next, ok)
            }
          }
          EOF

          gofmt -w backend/internal/updater/updater_test.go backend/internal/version/version.go backend/cmd/LANnventory/main.go

      - name: Build frontend and refresh embedded bundle
        working-directory: frontend
        run: |
          npm ci
          npm run test:host-ux
          make all

      - name: Refresh Swagger docs
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models

      - name: Validate UAT2 version surfaces and updater ordering
        env:
          UAT_VERSION: 0.1.0-beta.5.uat.2
          UAT_TAG: v0.1.0-beta.5.uat.2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["UAT_VERSION"]
          tag = os.environ["UAT_TAG"]
          tick = chr(96)
          checks = {
              "backend fallback": f'var Version = "{version}"' in Path("backend/internal/version/version.go").read_text(),
              "Swagger annotation": f"// @version {version}" in Path("backend/cmd/LANnventory/main.go").read_text(),
              "Docker default": f"ARG LANNVENTORY_VERSION={version}" in Path("Dockerfile").read_text(),
              "Proxmox tag": f'RELEASE_TAG="{tag}"' in Path("proxmox/lannventory.sh").read_text(),
              "Proxmox version": f'VERSION="{version}"' in Path("proxmox/lannventory.sh").read_text(),
              "README current beta": f"Current beta release: {tick}{version}{tick}" in Path("README.md").read_text(),
              "release summary": Path("docs/releases", f"{tag}.md").exists(),
          }
          package = json.loads(Path("frontend/package.json").read_text())
          lock = json.loads(Path("frontend/package-lock.json").read_text())
          checks["frontend package"] = package.get("version") == version
          checks["frontend lock"] = lock.get("version") == version and lock.get("packages", {}).get("", {}).get("version") == version

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("UAT2 version consistency failed: " + ", ".join(failed))
          print("UAT2 version surfaces are consistent:")
          for name in checks:
              print(" -", name)
          PY

          cd backend
          go test ./internal/updater ./internal/version ./internal/api
          go test ./internal/version -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}"
          go vet ./internal/updater ./internal/version ./internal/api
          go build -ldflags="-X github.com/godlev/LANnventory/internal/version.Version=${UAT_VERSION}" ./cmd/LANnventory
          cd ..

          bash -n proxmox/lannventory.sh
          bash proxmox/lannventory_test.sh

      - name: Commit UAT2 metadata
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/internal/version/version.go \
            backend/internal/updater/updater_test.go \
            backend/cmd/LANnventory/main.go \
            backend/docs \
            backend/internal/web/public \
            frontend/package.json \
            frontend/package-lock.json \
            Dockerfile \
            proxmox/lannventory.sh \
            proxmox/lannventory_test.sh \
            README.md \
            docs/releases/v0.1.0-beta.5.uat.2.md
          git diff --cached --check
          git commit -m "phase34: prepare v0.1.0-beta.5.uat.2 Host UX UAT"
          git push origin HEAD:release-phase34-host-ux-uat2
