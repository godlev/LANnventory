name: Phase34 structured scan repair

on:
  push:
    branches:
      - phase34-service-inventory
    paths:
      - .github/workflows/phase34-structured-scan-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase34-service-inventory
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply structured scan contract updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one exact match, found {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'backend/internal/api/api_network_test.go',
              '''\tif rec.Code != http.StatusServiceUnavailable {\n\t\tt.Fatalf("status = %d, want %d; body: %s", rec.Code, http.StatusServiceUnavailable, rec.Body.String())\n\t}\n\n\tservice, ok, err := gdb.SelectServiceByIdentity(host.Mac, host.IP, "tcp", 445)''',
              '''\tif rec.Code != http.StatusOK {\n\t\tt.Fatalf("status = %d, want %d; body: %s", rec.Code, http.StatusOK, rec.Body.String())\n\t}\n\n\tvar result hostPortScanResponse\n\tif err := json.Unmarshal(rec.Body.Bytes(), &result); err != nil {\n\t\tt.Fatalf("json.Unmarshal: %v", err)\n\t}\n\tif result.Port != 445 || result.Open || result.State != string(portscan.ProbeIndeterminate) {\n\t\tt.Fatalf("result = %+v, want indeterminate port 445", result)\n\t}\n\n\tservice, ok, err := gdb.SelectServiceByIdentity(host.Mac, host.IP, "tcp", 445)''',
          )

          replace_once(
              'frontend/src/functions/api.ts',
              '''export type HostPortScanResult = {\n  port: number;\n  open: boolean;\n};''',
              '''export type HostPortScanResult = {\n  port: number;\n  open: boolean;\n  state: "open" | "closed" | "indeterminate";\n};''',
          )
          PY
      - name: Refresh frontend bundle
        working-directory: frontend
        run: |
          npm ci
          make all
      - name: Refresh Swagger docs
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g main.go --dir cmd/LANnventory,internal/api,internal/models
      - name: Verify repair
        run: |
          cd backend
          go test ./internal/api ./internal/gdb ./internal/models ./internal/portscan
          go vet ./internal/api ./internal/gdb ./internal/models ./internal/portscan
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/internal/api/api_network_test.go frontend/src/functions/api.ts backend/docs backend/internal/web/public
          git diff --cached --check
          git commit -m 'phase34: align structured manual scan contract'
          git push origin HEAD:phase34-service-inventory
