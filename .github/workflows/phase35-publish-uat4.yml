name: Phase35 publish UAT4

on:
  push:
    branches:
      - phase35-device-profiles-proxmox
    paths:
      - .github/workflows/phase35-publish-uat4.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase35-device-profiles-proxmox
          fetch-depth: 0

      - name: Tag validated clean UAT4 source
        env:
          UAT_TAG: v0.1.0-beta.6.uat.4
          UAT_SHA: 24ae75da804dcfd0345c35fe5fa0eacf0793d67c
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${UAT_TAG}" >/dev/null; then
            echo "Tag ${UAT_TAG} already exists; refusing to move it."
            exit 1
          fi
          test "$(git rev-parse "${UAT_SHA}^{commit}")" = "${UAT_SHA}"
          test "$(git show "${UAT_SHA}:backend/internal/version/version.go" | grep -c 'var Version = "0.1.0-beta.6.uat.4"')" = "1"
          test "$(git show "${UAT_SHA}:docs/releases/v0.1.0-beta.6.uat.4.md" | grep -c '^# LANnventory v0.1.0-beta.6.uat.4$')" = "1"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${UAT_TAG}" "${UAT_SHA}" -m "LANnventory ${UAT_TAG}"
          git push origin "refs/tags/${UAT_TAG}"

      - name: Checkout exact UAT4 tag
        run: |
          set -euo pipefail
          git checkout --detach v0.1.0-beta.6.uat.4
          test "$(git rev-parse HEAD)" = "24ae75da804dcfd0345c35fe5fa0eacf0793d67c"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build embedded frontend
        working-directory: frontend
        run: make all

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build release artifacts with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
          workdir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply curated UAT4 release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit v0.1.0-beta.6.uat.4 \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file docs/releases/v0.1.0-beta.6.uat.4.md
