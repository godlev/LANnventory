name: Phase34 activity test repair

on:
  push:
    branches:
      - phase34-service-inventory
    paths:
      - .github/workflows/phase34-activity-test-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase34-service-inventory
      - name: Apply minimal taxonomy-resilient assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/internal/api/api_activity_test.go')
          text = path.read_text()
          old = '''\tstats := decodeActivityStats(t, rec)\n\tif stats.Total != 14 || stats.Online != 2 || stats.Offline != 2 || stats.Discovered != 1 || stats.Known != 1 || stats.Unknown != 1 || stats.DeviceTypeChanged != 1 || stats.MetadataChanged != 5 {\n\t\tt.Fatalf("stats = %+v, want totals for all seeded events", stats)\n\t}'''
          new = '''\tstats := decodeActivityStats(t, rec)\n\twantTotal := int64(len(models.HostEventTypeValues) + 2)\n\tif stats.Total != wantTotal || stats.Online != 2 || stats.Offline != 2 || stats.Discovered != 1 || stats.Known != 1 || stats.Unknown != 1 || stats.DeviceTypeChanged != 1 || stats.MetadataChanged != 5 {\n\t\tt.Fatalf("stats = %+v, want totals for all seeded event types plus two NAS connectivity events", stats)\n\t}'''
          if text.count(old) != 1:
              raise SystemExit('expected activity stats assertion block not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify focused backend test
        working-directory: backend
        run: go test ./internal/api -run TestActivityStatsEndpointReturnsTotals -count=1
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/internal/api/api_activity_test.go
          git diff --cached --check
          git commit -m 'phase34: keep activity stats test taxonomy resilient'
          git push origin HEAD:phase34-service-inventory
