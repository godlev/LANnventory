name: Phase 33 frontend bundle sync

on:
  push:
    branches:
      - phase-33-device-identity
    paths:
      - .github/workflows/phase33-sync-frontend.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Rebuild embedded frontend bundle
        working-directory: frontend
        run: make all

      - name: Commit generated bundle
        run: |
          git add backend/internal/web/public/assets
          if git diff --cached --quiet; then
            echo "Embedded frontend bundle is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 33A.1: sync embedded frontend bundle"
          git push origin HEAD:phase-33-device-identity
