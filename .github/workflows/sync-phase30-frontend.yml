name: Sync Phase 30 frontend bundle

on:
  push:
    branches:
      - phase-30-update-ux-reconciled

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-30-update-ux-reconciled

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build embedded frontend
        working-directory: frontend
        run: make all

      - name: Commit embedded frontend
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/internal/web/public; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/web/public
          git commit -m "Refresh Phase 30 embedded frontend"
          git push origin HEAD:phase-30-update-ux-reconciled
