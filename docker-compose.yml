services:
  lannventory:
    build:
      context: .
    image: lannventory:dev
    container_name: lannventory
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - lannventory-data:/data/WatchYourLAN
    environment:
      TZ: Etc/UTC
      HOST: 0.0.0.0
      PORT: "8840"
      # Set IFACES to one or more real Linux host interfaces before scanning.
      # Example: IFACES: "eth0 wlan0"
      IFACES: ""
      # Optional settings:
      # TIMEOUT: "120"
      # LOG_LEVEL: "info"
      # THEME: "sand"
      # COLOR: "dark"
      # SHOUTRRR_URL: ""
      # USE_DB: "sqlite"
      # PG_CONNECT: ""
      # INFLUX_ENABLE: "false"
      # INFLUX_ADDR: ""
      # INFLUX_TOKEN: ""
      # PROMETHEUS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${PORT:-8840}/api/health\" >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lannventory-data:
