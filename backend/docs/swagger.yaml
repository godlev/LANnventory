  /config_influx/:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Update InfluxDB integration settings from a form submission.
      parameters:
      - description: Truthy value enables InfluxDB
        in: formData
        name: enable
        type: string
      - description: InfluxDB address
        in: formData
        name: addr
        type: string
      - description: InfluxDB token. Leave blank to keep configured secret.
        in: formData
        name: token
        type: string
      - description: Truthy value clears the stored InfluxDB token
        in: formData
        name: clear_influx_token
        type: string
      - description: InfluxDB organization
        in: formData
        name: org
        type: string
      - description: InfluxDB bucket
        in: formData
        name: bucket
        type: string
      - description: Truthy value skips TLS verification
        in: formData
        name: skip
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to referrer
          schema:
            type: string
        "500":
          description: Failed to write config
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save InfluxDB configuration
      tags:
      - configuration
  /config_prometheus/:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Update Prometheus integration settings from a form submission.
      parameters:
      - description: Truthy value enables Prometheus metrics
        in: formData
        name: enable
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to referrer
          schema:
            type: string
        "500":
          description: Failed to write config
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save Prometheus configuration
      tags:
      - configuration
  /config_settings/:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Update scan and database settings from a form submission, then
        restart scanning.
      parameters:
      - description: Log level
        enum:
        - debug
        - info
        - warn
        - error
        in: formData
        name: log
        required: true
        type: string
      - description: arp-scan arguments
        in: formData
        name: arpargs
        type: string
      - description: Interfaces to scan
        in: formData
        name: ifaces
        type: string
      - description: Database backend
        enum:
        - sqlite
        - postgres
        in: formData
        name: usedb
        required: true
        type: string
      - description: PostgreSQL connection URL. Leave blank to keep configured secret.
        in: formData
        name: pgconnect
        type: string
      - description: Truthy value clears the stored PostgreSQL connection URL
        in: formData
        name: clear_pgconnect
        type: string
      - description: Scan interval in seconds
        in: formData
        minimum: 1
        name: timeout
        required: true
        type: integer
      - description: Presence history retention in hours
        in: formData
        minimum: 1
        name: trim
        type: integer
      - description: Connectivity event retention in hours
        in: formData
        minimum: 1
        name: connectivity_retention
        type: integer
      - collectionFormat: multi
        description: Repeatable static ARP result strings
        in: formData
        items:
          type: string
        name: arpstrs
        type: array
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to referrer
          schema:
            type: string
        "400":
          description: Invalid settings
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to reconnect database or write config
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save scan and database settings
      tags:
      - configuration
  /edit/{id}/{name}/{known}:
    get:
      description: Update a host's name and optionally toggle its "known" status
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      - description: New name for the host
        in: path
        name: name
        required: true
        type: string
      - description: Pass 'toggle' to flip the known/unknown status
        in: path
        name: known
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Edit host
      tags:
      - hosts
  /export/backup:
    get:
      description: Export a versioned logical backup containing current hosts, host
        history, activity events, host metadata, host lifecycle and managed device
        profiles. Configuration secrets are not included.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Backup generation failure
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download portable data backup
      tags:
      - export
  /export/inventory.csv:
    get:
      description: Export the current device inventory, metadata and lifecycle as
        CSV. This is not a full backup and does not include history or events.
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            type: string
        "500":
          description: CSV generation failure
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download current inventory CSV
      tags:
      - export
  /health:
    get:
      description: Returns OK without triggering scans or mutations
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health check
      tags:
      - system
  /history:
    get:
      description: |-
        Retrieve the complete history of all hosts. Not recommended, the output can be a lot
        Inventory metadata fields are not included on history rows.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Host'
            type: array
      summary: Get full history
      tags:
      - history
  /history/{mac}:
    get:
      description: |-
        Retrieve the latest history entries for a specific host by MAC address
        Inventory metadata fields are not included on history rows.
      parameters:
      - description: MAC address of the host
        in: path
        name: mac
        required: true
        type: string
      - description: Number of history entries to return
        in: query
        name: num
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Host'
            type: array
      summary: Get history by MAC
      tags:
      - history
  /history/{mac}/{date}:
    get:
      description: |-
        Retrieve history for a specific host on a given date
        Inventory metadata fields are not included on history rows.
        The date format is flexible and can be:
        - Year only: `2025`
        - Year + month: `2025-09`
        - Full date: `2025-09-06`
        - Full timestamp: `2025-09-06 00:58:26`
      parameters:
      - description: MAC address of the host
        in: path
        name: mac
        required: true
        type: string
      - description: Date filter (supports YYYY, YYYY-MM, YYYY-MM-DD, YYYY-MM-DD HH:mm:ss)
        in: path
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Host'
            type: array
      summary: Get history by date
      tags:
      - history
  /host/{id}:
    get:
      description: Retrieve detailed information about a current host by its unique
        ID, enriched with inventory metadata and lifecycle fields.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Host'
      summary: Get host by ID
      tags:
      - hosts
    patch:
      consumes:
      - application/json
      description: Atomically update editable host fields and manually managed inventory
        metadata. Actual known, device type, and metadata changes are recorded as
        Device change events. Name changes do not create events.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      - description: Host inventory payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.HostInventoryPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Host'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update host inventory
      tags:
      - hosts
  /host/{id}/activity:
    get:
      description: Retrieve recent host activity events for a host ID
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      - description: Event limit from 1 to 100. Defaults to 20.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.HostEvent'
            type: array
        "400":
          description: Invalid host ID or limit
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Database query failure
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get recent activity for one host
      tags:
      - activity
  /host/{id}/identity:
    get:
      description: Return retained addresses, reverse address-to-MAC history, discovery
        evidence, and discovery sources for a host without changing user-managed inventory
        fields.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HostIdentityResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get host identity observations
      tags:
      - hosts
  /host/{id}/identity/candidates:
    get:
      description: Return read-only, explainable suggestions for MAC identities that
        may represent the same physical device. This endpoint never merges or mutates
        identities.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HostIdentityCandidatesResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get host identity correlation candidates
      tags:
      - hosts
  /host/{id}/identity/decisions:
    get:
      description: Return user-confirmed or user-rejected MAC relationships for a
        host. Decisions do not merge host observations, events, presence, or lifecycle
        history.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HostIdentityDecisionsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get explicit identity correlation decisions
      tags:
      - hosts
  /host/{id}/identity/decisions/{mac}:
    delete:
      description: Remove the user's explicit confirm/reject decision for a MAC pair
        without modifying either identity or its historical observations.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      - description: Other MAC
        in: path
        name: mac
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Clear an identity correlation decision
      tags:
      - hosts
    put:
      consumes:
      - application/json
      description: Confirm or reject that another observed MAC identity belongs to
        the same physical device. This records user intent only and never merges historical
        observations. Contradictory confirmed/rejected relationship graphs are rejected.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      - description: Other observed MAC
        in: path
        name: mac
        required: true
        type: string
      - description: Correlation decision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.correlationDecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.IdentityCorrelationDecisionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set an identity correlation decision
      tags:
      - hosts
  /host/{id}/identity/group:
    get:
      description: Return the transitive group of MAC identities explicitly confirmed
        by the user as the same physical device. The projection is read only and does
        not rewrite Hosts, Events, Presence, or historical observations.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HostIdentityGroupResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get confirmed logical identity group
      tags:
      - hosts
  /host/{id}/metadata:
    patch:
      consumes:
      - application/json
      description: Partially update manually managed inventory metadata. Tags are
        trimmed, empty tags are removed, duplicates are removed case-insensitively,
        and user order is preserved. Actual changes are recorded as Device change
        events.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      - description: Metadata payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.HostMetadataPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Host'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update host metadata
      tags:
      - hosts
  /host/{id}/port/{port}/scan:
    post:
      description: Scan a TCP port using the host's current IP. Definitive results
        update persistent service inventory and emit lifecycle activity only on state
        transitions. Indeterminate transport failures are returned without changing
        persisted service state.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: integer
      - description: Port number
        in: path
        name: port
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.hostPortScanResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Scan one port for a host
      tags:
      - network
  /host/{id}/profile:
    get:
      description: Return manually managed generic and typed device-profile information.
        Imported/discovered integration data is stored separately and never overwrites
        these fields.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DeviceProfileResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get managed device profile
      tags:
      - hosts
    patch:
      consumes:
      - application/json
      description: Partially update manually managed generic device-profile fields.
        Empty values clear fields; clearing all fields removes the managed base profile
        row.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      - description: Managed profile payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.DeviceProfilePatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DeviceProfileResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update managed device profile
      tags:
      - hosts
  /host/{id}/profile/hypervisor:
    delete:
      description: Remove only the manual Hypervisor capability/profile. The Host
        and its generic/system inventory remain unchanged.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DeviceProfileResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove managed hypervisor profile
      tags:
      - hosts
    patch:
      consumes:
      - application/json
      description: Mark a Host as a managed hypervisor capability and store manually
        maintained platform details. This does not change Device Type and does not
        use credentials.
      parameters:
      - description: Host ID
        in: path
        name: id
        required: true
        type: string
      - description: Hypervisor profile payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.HypervisorProfilePatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DeviceProfileResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create or update managed hypervisor profile
      tags:
      - hosts
  /host/{id}/profile/network:
    patch:
      consumes:
      - application/json
      description: Partially update network-device-specific managed fields. Physical
        port count 0 means not set.
      parameters:
      - description: Host ID
        in: path
