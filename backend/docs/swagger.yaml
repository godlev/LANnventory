      parameters:
      - description: Bind host
        in: formData
        name: host
        type: string
      - description: Bind port
        in: formData
        name: port
        type: string
      - description: Theme name
        in: formData
        name: theme
        type: string
      - description: Color mode
        enum:
        - dark
        - light
        in: formData
        name: color
        type: string
      - description: Legacy local node-bootstrap URL
        in: formData
        name: node
        type: string
      - description: Notification URL. Leave blank to keep configured secret.
        in: formData
        name: shout
        type: string
      - description: Truthy value clears the stored notification URL
        in: formData
        name: clear_shout
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to referrer
          schema:
            type: string
        "500":
          description: Failed to write config
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save general configuration
      tags:
      - configuration
  /config/color:
