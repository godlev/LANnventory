version: 2
project_name: lannventory
builds:
  - main: ./cmd/WatchYourLAN/
    binary: lannventory
    id: default
    env: [CGO_ENABLED=0]
    goos:
      - linux
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    goarm:
      - "5"
      - "6"
      - "7"

nfpms:
  - id: systemd
    formats:
    - deb
    - rpm
    maintainer: LANnventory maintainers
    description: LAN inventory and presence monitoring web UI
    homepage: https://github.com/godlev/LANnventory
    license: MIT
    section: utils
    dependencies: # Don't forget to edit!
    - arp-scan
    - tzdata
    contents:
    - src: ./configs/watchyourlan.service
      dst: /lib/systemd/system/lannventory.service
    scripts:
      postinstall: ./configs/postinstall.sh

  - id: alpine
    formats:
    - apk
    maintainer: LANnventory maintainers
    description: LAN inventory and presence monitoring web UI
    homepage: https://github.com/godlev/LANnventory
    license: MIT
    section: utils
    dependencies: # Don't forget to edit!
    - arp-scan
    - tzdata
    contents:
    - src: ./configs/watchyourlan
      dst: /etc/init.d/lannventory

archives:
  - files:
    - LICENSE
    - src: ./configs/watchyourlan.service
      dst: lannventory.service
    - src: ./configs/install.sh
      dst: install.sh
    wrap_in_directory: true
    format_overrides:
    - goos: windows
      format: zip

checksum:
  name_template: "checksums.txt"
