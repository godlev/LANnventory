services:
  lanventory:
    build:
      context: .
    image: lanventory:dev
    container_name: lanventory
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - lanventory-data:/data/WatchYourLAN
    environment:
      TZ: Etc/UTC
      HOST: 0.0.0.0
      PORT: "8840"
      IFACES: ""
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${PORT:-8840}/api/health\" >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  forauth:
    image: aceberg/forauth
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8800:8800"
      - "8801:8801"
    volumes:
      - forauth-data:/data/ForAuth
    environment:
      TZ: Etc/UTC
      FA_TARGET: "host.docker.internal:8840"
      FA_AUTH: "true"
      FA_AUTH_EXPIRE: 7d
      # Example bcrypt hash for the demo password used by the inherited upstream sample.
      # Replace both user and password hash before using this file.
      FA_AUTH_USER: user
      FA_AUTH_PASSWORD: "$$2a$$10$$wGLUHXh2cRN1257uGg1s5eZvYgnjw8wB9vAcfcHqqqrxm5hvBqAzK"

volumes:
  lanventory-data:
  forauth-data:
